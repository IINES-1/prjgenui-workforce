/* =========================================================
   RELEASE 0.3-E — LIVE EVIDENCE AND REPLACEMENT INCIDENTS
   Every step below orchestrates existing, unchanged functions
   (transitionAssignmentStatus, generateMatchesForRequest, approveMatch,
   createAssignmentFromMatch, createOffer, recordOfferResponse,
   confirmAssignment, activateAssignment) — nothing here invents a new
   gate, a new scoring engine, or a shortcut around any of them. Per the
   approved Continuity/replacement boundary: this manages a documented
   operational incident, never a predictive engine. No automatic
   deployment, no automatic CapacityHoldCandidate conversion, no
   inference of acceptance/availability, no bypass of Match, approval,
   Offer, or final-gate controls — every step below is an explicit
   operator action.
   ========================================================= */
function blankReplacementIncident(){
  return {
    id: uid(), assignmentId:'', requestId:'', incidentType:'', // CANCELLATION | NO_SHOW | REPLACEMENT_REQUIRED
    recordedAt: new Date().toISOString(), recordedBy:'', notes:'',
    replacementMatchGenerationId:'', replacementAssignmentId:'',
    contractorApprovalHistory:[], // append-only [{approverName, decision, timestamp, notes}] — controlling decision is the most recent entry, never overwritten
    sitePackAcknowledgement: null, // {actor, timestamp}
    quantityOverrideOperationId:'', quantityOverridePreviousLimit:null, quantityOverrideRestoredOperationId:'', // full temporary-override lifecycle — see applyReplacementQuantityOverride()/restoreReplacementQuantityOverride()
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };
}
function normaliseReplacementIncident(i){
  const b = blankReplacementIncident();
  i = i || {};
  const merged = Object.assign({}, b, i, { id: i.id || b.id });
  if(!Array.isArray(merged.contractorApprovalHistory) || merged.contractorApprovalHistory.length===0){
    merged.contractorApprovalHistory = i.contractorApproval ? [i.contractorApproval] : [];
  }
  delete merged.contractorApproval; // superseded by contractorApprovalHistory — never carried forward as a separate stray field
  return merged;
}
async function persistReplacementIncidents(){ await Storage.set(REPLACEMENT_INCIDENT_KEY, {schemaVersion:SCHEMA_VERSION, data:replacementIncidents}); }

const REPLACEMENT_INCIDENT_TYPES = ['CANCELLATION','NO_SHOW','REPLACEMENT_REQUIRED'];
/* Step 1 of the permitted scope: record the incident against an existing
   Assignment/Request. Only transitions the original Assignment's status
   when the incident type maps to one of the existing, frozen lifecycle's
   own exception states, and only when that transition is actually legal
   from the assignment's current status (ASSIGNMENT_TRANSITIONS itself
   decides this — never bypassed or duplicated here). REPLACEMENT_REQUIRED
   deliberately does not force any status change, since it may be raised
   ahead of an actual cancellation. */
function recordReplacementIncident(assignment, incidentType, recordedBy, notes){
  if(!REPLACEMENT_INCIDENT_TYPES.includes(incidentType)){
    return { ok:false, reason:'Unknown incident type: '+incidentType };
  }
  const statusForType = { CANCELLATION:'CANCELLED', NO_SHOW:'NO_SHOW', REPLACEMENT_REQUIRED:null };
  const targetStatus = statusForType[incidentType];
  if(targetStatus){
    const result = transitionAssignmentStatus(assignment, targetStatus, 'Replacement incident recorded: '+incidentType, recordedBy||'operator');
    if(!result.ok) return { ok:false, reason: result.reason };
  }
  const incident = Object.assign(blankReplacementIncident(), {
    assignmentId: assignment.id, requestId: assignment.requestId, incidentType,
    recordedBy: recordedBy||'', notes: notes||''
  });
  replacementIncidents.push(incident);
  return { ok:true, incident };
}

/* Step 6 of the permitted scope: once a replacement Assignment exists,
   this is an explicit, separate operator action — never an automatic
   side effect of the replacement being confirmed. Only legal (per the
   frozen transition table) when the original Assignment is still ACTIVE
   — REPLACED is unreachable from any other status, so this correctly
   refuses otherwise rather than attempting an illegal transition. */
function markOriginalReplaced(incident, actor){
  const original = assignmentEntities.find(a=>a.id===incident.assignmentId);
  if(!original) return { ok:false, reason:'Original assignment not found.' };
  const result = transitionAssignmentStatus(original, 'REPLACED', 'Replacement assignment confirmed', actor||'operator');
  if(!result.ok) return { ok:false, reason: result.reason };
  // Cutover is complete: if a temporary quantity override was applied for
  // this incident, restore it now as part of the same successful action —
  // never left as a silently-inflated limit. Idempotent and safe either
  // way. The REPLACED transition above has already genuinely succeeded
  // and is never rolled back if this restoration fails — undoing a
  // correct state change over a secondary bookkeeping step would be
  // worse — but the outcome is surfaced to the caller via restoreWarning
  // rather than silently ignored, so an unresolved override is never
  // hidden behind an unqualified success message.
  let restoreOutcome = null;
  const request = workforceRequests.find(r=>r.id===incident.requestId);
  if(incident.quantityOverrideOperationId && request){
    restoreOutcome = restoreReplacementQuantityOverride(incident, request, actor||'operator');
  }
  if(restoreOutcome && !restoreOutcome.ok){
    return { ok:true, restoreWarning: restoreOutcome.reason };
  }
  return { ok:true };
}

/* ---- Genuinely temporary quantity override for an in-flight ACTIVE
   replacement handoff. Available only once the replacement Assignment
   itself exists and only before it reaches CONFIRMED (the deadlock is
   at confirmation time; before the Assignment exists there is nothing
   to confirm, and after CONFIRMED the override has already served its
   purpose). Both apply and restore are idempotent — checked here at the
   incident level before ever calling the underlying (frozen, itself
   idempotent-by-operationId) recordQuantityOverride() — and restoration
   never reduces the limit below the Request's actual current
   confirmed/active count, even if that count has changed since the
   override was applied. ---- */
function replacementQuantityOverrideAvailable(incident, replacementAssignment){
  if(!replacementAssignment) return false;
  if(incident.quantityOverrideOperationId) return false; // already applied — idempotent short-circuit for the UI's own offer of the control
  return !['CONFIRMED','ACTIVE','COMPLETED','REVIEWED'].includes(replacementAssignment.status);
}
function applyReplacementQuantityOverride(incident, request, approvedBy, reason){
  if(incident.quantityOverrideOperationId){
    return { ok:true, alreadyApplied:true }; // idempotent — a retry is a no-op success, never a second override
  }
  if(!approvedBy || !approvedBy.trim()) return { ok:false, reason:'Approver name is required.' };
  const previousLimit = effectiveQuantityLimit(request);
  const opId = 'replacement-qty-apply-'+incident.id;
  const result = recordQuantityOverride(request, opId, approvedBy.trim(), reason||('Temporary +1 to allow in-flight replacement handoff for incident '+incident.id), previousLimit+1);
  if(!result.ok) return result;
  incident.quantityOverrideOperationId = opId;
  incident.quantityOverridePreviousLimit = previousLimit;
  incident.updatedAt = new Date().toISOString();
  return { ok:true };
}
function restoreReplacementQuantityOverride(incident, request, actor){
  if(!incident.quantityOverrideOperationId){
    return { ok:false, reason:'No override was applied for this incident — nothing to restore.' };
  }
  if(incident.quantityOverrideRestoredOperationId){
    return { ok:true, alreadyRestored:true }; // idempotent — a retry is a no-op success, never a duplicate restore
  }
  const currentActual = countConfirmedPrimaryAssignments(request.id);
  const restoreTo = Math.max(incident.quantityOverridePreviousLimit, currentActual);
  const opId = 'replacement-qty-restore-'+incident.id;
  const result = recordQuantityOverride(request, opId, actor||'system', 'Restoring quantity limit after replacement cutover for incident '+incident.id, restoreTo);
  if(!result.ok) return result;
  incident.quantityOverrideRestoredOperationId = opId;
  incident.updatedAt = new Date().toISOString();
  return { ok:true };
}

/* ---- Structural exclusion for replacement matching. The worker being
   replaced, and any worker who already holds a live (non-terminal)
   Assignment against the same Request, must never be selectable as the
   replacement — this prevents both "replacing someone with themselves"
   and duplicate deployment of an already-assigned worker. generateMatchesForRequest()
   itself is frozen and untouched; a Match it creates for an ineligible
   worker is never mutated (MatchGeneration/Match/MatchFactor stay
   immutable) — instead, this function returns the set of ineligible
   worker IDs, which the RENDER layer uses to show an explicit,
   explained exclusion instead of the normal approve/create controls,
   and which the CREATE-ASSIGNMENT wiring uses as a hard guard so an
   ineligible worker's match can never actually produce an Assignment
   even if something attempted it directly. ---- */
function findIneligibleReplacementWorkerIds(requestId, originalWorkerId){
  const liveStatuses = ['PROPOSED','OFFERED','ACCEPTED','CONFIRMED','ACTIVE'];
  const ids = new Set();
  if(originalWorkerId) ids.add(originalWorkerId);
  assignmentEntities.filter(a=>a.requestId===requestId && liveStatuses.includes(a.status)).forEach(a=>ids.add(a.workerId));
  return ids;
}

/* ---- THE single, shared replacement-eligibility gate. Every route that
   can approve a Match or create an Assignment from one — Request Detail's
   own matching workspace and Assignment Detail's incident panel alike —
   calls this SAME function before doing so, so a replacement-ineligible
   worker can never slip through via whichever screen happens to lack a
   guard. Not a replacement-specific match at all (no incident references
   this generation) is always eligible: this only constrains matches that
   are actually part of a recorded replacement incident's own generation. ---- */
function validateReplacementEligibility(match){
  const incident = replacementIncidents.find(ri=>ri.replacementMatchGenerationId===match.generationId);
  if(!incident) return { ok:true };
  const original = assignmentEntities.find(a=>a.id===incident.assignmentId);
  const ineligible = findIneligibleReplacementWorkerIds(incident.requestId, original ? original.workerId : null);
  if(ineligible.has(match.workerId)){
    return { ok:false, reason:'This worker is structurally ineligible for this replacement (the original worker, or already deployed on this Request).' };
  }
  return { ok:true };
}

/* ---- Contractor approval as an OPERATIONAL GATE, not just a stored
   opinion. Decisions are append-only — recordContractorApproval() never
   overwrites incident.contractorApprovalHistory, it only appends, and the
   CONTROLLING decision is explicitly defined as the most recent entry.
   validateContractorApprovalForProgression() is the single check called
   before replacement Assignment creation and before sending a
   replacement Offer: it requires the controlling decision to be
   APPROVED, refusing outright if it is REJECTED or simply absent. ---- */
function recordContractorApproval(incident, approverName, decision, notes){
  if(!approverName || !approverName.trim()) return { ok:false, reason:'Approver name is required.' };
  if(decision !== 'APPROVED' && decision !== 'REJECTED') return { ok:false, reason:'Decision must be APPROVED or REJECTED.' };
  if(!incident.contractorApprovalHistory) incident.contractorApprovalHistory = [];
  incident.contractorApprovalHistory.push({ approverName: approverName.trim(), decision, timestamp: new Date().toISOString(), notes: notes||'' });
  incident.updatedAt = new Date().toISOString();
  return { ok:true };
}
function controllingContractorDecision(incident){
  const history = incident.contractorApprovalHistory || [];
  return history.length ? history[history.length-1] : null;
}
function validateContractorApprovalForProgression(incident){
  const controlling = controllingContractorDecision(incident);
  if(!controlling) return { ok:false, reason:'Contractor approval has not yet been recorded for this replacement.' };
  if(controlling.decision !== 'APPROVED') return { ok:false, reason:'The controlling contractor decision is REJECTED — this replacement cannot proceed to Assignment creation or Offer.' };
  return { ok:true };
}

function recordSitePackAcknowledgement(incident, actor){
  if(!actor || !actor.trim()) return { ok:false, reason:'Actor name is required.' };
  incident.sitePackAcknowledgement = { actor: actor.trim(), timestamp: new Date().toISOString() };
  incident.updatedAt = new Date().toISOString();
  return { ok:true };
}

/* Full incident audit presentation — assembled read-only from existing
   data at every stage: incident -> generation -> proposed replacement ->
   contractor approval -> Offer -> acceptance -> final gates ->
   confirmation/activation -> original Assignment disposition. Nothing
   here is stored separately; it is a view over facts already recorded
   elsewhere (the incident record, the Match, the Offer, statusHistory,
   readinessSnapshots), so it can never drift from them. */
function buildReplacementIncidentAuditTrail(incident){
  const stages = [];
  stages.push({ stage:'Incident recorded', done:true, detail:`${incident.incidentType} — ${formatAuditTimestamp(incident.recordedAt)}${incident.recordedBy?' by '+incident.recordedBy:''}` });
  stages.push({ stage:'Replacement matching generation', done: !!incident.replacementMatchGenerationId, detail: incident.replacementMatchGenerationId ? 'Generation '+incident.replacementMatchGenerationId : 'Not yet run' });
  const replacement = incident.replacementAssignmentId ? assignmentEntities.find(a=>a.id===incident.replacementAssignmentId) : null;
  stages.push({ stage:'Proposed replacement Assignment created', done: !!replacement, detail: replacement ? (replacement.publicReference||replacement.id) : 'Not yet created' });
  stages.push({ stage:'Contractor approval', done: !!controllingContractorDecision(incident), detail: (function(){ const c = controllingContractorDecision(incident); return c ? `${c.decision} by ${c.approverName} — ${formatAuditTimestamp(c.timestamp)}` : 'Not yet recorded'; })() });
  const offer = replacement ? assignmentOffers.find(o=>o.assignmentId===replacement.id) : null;
  stages.push({ stage:'Offer sent', done: !!offer, detail: offer ? offer.status : 'Not yet sent' });
  stages.push({ stage:'Worker acceptance', done: !!offer && offer.status==='ACCEPTED', detail: offer ? offer.status : 'N/A' });
  const preConfSnap = replacement ? readinessSnapshots.filter(s=>s.assignmentId===replacement.id && s.snapshotType==='PRE_CONFIRMATION').pop() : null;
  stages.push({ stage:'Pre-confirmation final gate', done: !!preConfSnap, detail: preConfSnap ? preConfSnap.assignmentReadinessStatus : 'Not yet run' });
  stages.push({ stage:'Site-pack / RAMS acknowledgement', done: !!incident.sitePackAcknowledgement, detail: incident.sitePackAcknowledgement ? `${incident.sitePackAcknowledgement.actor} — ${formatAuditTimestamp(incident.sitePackAcknowledgement.timestamp)}` : 'Not yet recorded' });
  const preDeploySnap = replacement ? readinessSnapshots.filter(s=>s.assignmentId===replacement.id && s.snapshotType==='PRE_DEPLOYMENT').pop() : null;
  stages.push({ stage:'Pre-deployment final gate', done: !!preDeploySnap, detail: preDeploySnap ? preDeploySnap.assignmentReadinessStatus : 'Not yet run' });
  stages.push({ stage:'Replacement confirmed/activated', done: !!replacement && ['CONFIRMED','ACTIVE'].includes(replacement.status), detail: replacement ? replacement.status : 'N/A' });
  const original = assignmentEntities.find(a=>a.id===incident.assignmentId);
  stages.push({ stage:'Original Assignment disposition', done: !!original && original.status!=='ACTIVE', detail: original ? original.status : 'Not found' });
  return stages;
}

/* Elapsed time is measured, computed data — never a guaranteed SLA claim.
   Resolved once the replacement Assignment's own statusHistory shows it
   reaching CONFIRMED; otherwise reports the incident as still open. */
function computeReplacementElapsedTime(incident){
  if(!incident.replacementAssignmentId){
    return { resolved:false, elapsedMs: Date.now() - new Date(incident.recordedAt).getTime() };
  }
  const replacement = assignmentEntities.find(a=>a.id===incident.replacementAssignmentId);
  if(!replacement) return { resolved:false, elapsedMs: Date.now() - new Date(incident.recordedAt).getTime() };
  const confirmedEntry = replacement.statusHistory.find(h=>h.newStatus==='CONFIRMED');
  if(!confirmedEntry) return { resolved:false, elapsedMs: Date.now() - new Date(incident.recordedAt).getTime() };
  return { resolved:true, elapsedMs: new Date(confirmedEntry.timestamp).getTime() - new Date(incident.recordedAt).getTime() };
}
function formatElapsedDuration(ms){
  const mins = Math.round(ms/60000);
  if(mins < 60) return mins+' minute'+(mins===1?'':'s');
  const hours = Math.floor(mins/60), remMins = mins%60;
  if(hours < 24) return hours+'h '+remMins+'m';
  const days = Math.floor(hours/24), remHours = hours%24;
  return days+'d '+remHours+'h';
}

/* ---- Attendance evidence — the same generic Evidence Provenance Layer
   from 0.3-A, category ATTENDANCE, explicitly linked to the Assignment it
   concerns via sourceType/sourceRecordId. No new entity, no separate
   attendance store — exactly the minimum extension the approved scope
   calls for. Self-attestation checking (from 0.3-A) still applies
   automatically via createEvidenceRecord() itself. ---- */
const ATTENDANCE_OUTCOMES = ['attended','late','no_show','excused','not_recorded'];
/* Captures the full field set required for genuine attendance provenance:
   event date, verifier name/role, verification method (evidence source),
   verification date, supporting evidence reference, and note — all
   existing fields on the generic EvidenceRecord from 0.3-A, simply
   exposed here rather than hardcoded to a bare minimum. An explicit event
   date is REQUIRED — never silently defaulted to today, since a silent
   default would misrepresent which shift the record actually concerns.
   Sufficient provenance for status:'verified' requires BOTH an
   identified, non-self verifier (via createEvidenceRecord()'s own
   unchanged self-attestation check) AND a nonblank verification
   method/evidence source — checked here as an additional condition this
   function applies on top of that unchanged check, never by feeding it
   fabricated input to manufacture a particular flag. Otherwise the
   record is preserved exactly as reported, only its status downgraded to
   pending/manual review. Prevents a silent duplicate active record for
   the same Assignment/shift date — an operator must dispute the existing
   one first rather than layering a second one over it unexplained. */
function recordAttendanceEvidence(assignment, params){
  params = params || {};
  if(!ATTENDANCE_OUTCOMES.includes(params.outcomeValue)){
    return { ok:false, reason:'Invalid attendance outcome: '+params.outcomeValue };
  }
  if(!params.eventDate || !params.eventDate.trim()){
    return { ok:false, reason:'An event date is required — it is never silently defaulted to today.' };
  }
  const worker = workers.find(w=>w.id===assignment.workerId);
  if(!worker) return { ok:false, reason:'Worker not found.' };

  const eventDate = params.eventDate;
  const existingActive = evidenceRecords.find(e=>
    e.sourceType==='ASSIGNMENT' && e.sourceRecordId===assignment.id && e.category==='ATTENDANCE' &&
    e.eventDate===eventDate && e.status!=='disputed'
  );
  if(existingActive){
    return { ok:false, reason:'An attendance record already exists for this assignment and date. Dispute it first if it needs correcting — the existing record is the authoritative one until then.', existingRecordId: existingActive.id };
  }

  const record = createEvidenceRecord({
    subjectType:'WORKER', subjectId: worker.id, category:'ATTENDANCE',
    sourceType:'ASSIGNMENT', sourceRecordId: assignment.id,
    verifierName: params.verifierName||'', verifierRole: params.verifierRole||'',
    verificationMethod: params.verificationMethod||'',
    eventDate, verifiedDate: params.verifiedDate||'',
    fileReference: params.fileReference||'',
    outcomeValue: params.outcomeValue, status:'verified', note: params.note||''
  });

  // Downgrade to pending/manual-review whenever provenance is not
  // independently sound — either the unchanged self-attestation check
  // already flagged it, or (this function's own additional condition)
  // the verification method/evidence source was left blank. The record
  // itself is never withheld or altered beyond this status field.
  const missingMethod = !params.verificationMethod || !params.verificationMethod.trim();
  if(record.provenanceFlag === 'INSUFFICIENT' || record.provenanceFlag === 'SELF_ATTESTED_REVIEW_REQUIRED'){
    record.status = 'pending';
  } else if(missingMethod){
    record.provenanceFlag = 'INSUFFICIENT';
    record.status = 'pending';
  }
  return { ok:true, record };
}

/* Auditable attendance summary, recalculated from independently verified
   ELIGIBLE outcomes only, per the exact rule:
   - denominator: independently verified (status:'verified', no
     provenanceFlag) records whose outcome is attended, late, or no_show;
   - numerator: the subset of those that are attended or late;
   - excused, not_recorded, disputed, pending, insufficient-provenance
     and self-attested records never affect this percentage, whatever
     their outcome value — they are excluded from both numerator and
     denominator, not merely down-weighted.
   The raw recorded-event count (every record, any status) is reported
   separately for transparency, never blended into the percentage.
   Coverage is defined as, and therefore reconciles exactly with, the
   share of raw recorded events that met the verification rule above —
   never a separately-derived figure that could drift from it. */
function computeAttendanceSummary(assignmentId){
  const records = evidenceRecords.filter(e=>e.sourceType==='ASSIGNMENT' && e.sourceRecordId===assignmentId && e.category==='ATTENDANCE');
  const rawRecordedEventCount = records.length;

  const independentlyVerified = records.filter(r=>r.status==='verified' && !r.provenanceFlag);
  const eligibleOutcomes = ['attended','late','no_show'];
  const eligibleVerified = independentlyVerified.filter(r=>eligibleOutcomes.includes(r.outcomeValue));

  const denominator = eligibleVerified.length;
  const lateCount = eligibleVerified.filter(r=>r.outcomeValue==='late').length;
  const attendedCount = eligibleVerified.filter(r=>r.outcomeValue==='attended').length;
  const numerator = attendedCount + lateCount; // documented: late counts as attended in the numerator
  const percentage = denominator > 0 ? Math.round(numerator/denominator*100) : null;
  const independentlyVerifiedCoverage = rawRecordedEventCount > 0 ? Math.round(denominator/rawRecordedEventCount*100) : null;

  const dates = eligibleVerified.map(r=>r.eventDate).filter(Boolean).sort();
  return {
    numerator, denominator, percentage, attendedCount, lateCount, rawRecordedEventCount,
    period: dates.length ? { earliest: dates[0], latest: dates[dates.length-1] } : null,
    independentlyVerifiedCount: denominator, independentlyVerifiedCoverage,
    excludedNotRecorded: records.filter(r=>r.outcomeValue==='not_recorded').length,
    excludedExcused: records.filter(r=>r.outcomeValue==='excused').length,
    excludedDisputed: records.filter(r=>r.status==='disputed').length,
    excludedPending: records.filter(r=>r.status==='pending').length,
    excludedInsufficientProvenance: records.filter(r=>r.provenanceFlag==='INSUFFICIENT').length,
    excludedSelfAttested: records.filter(r=>r.provenanceFlag==='SELF_ATTESTED_REVIEW_REQUIRED').length
  };
}


/* Non-binding by construction: this is the ONLY function that changes a
   candidate's status, and it never touches any Assignment, Match, Offer,
   or role:'RESERVE' field — there is nothing here for it to convert. */
function transitionCapacityHoldCandidateStatus(candidate, newStatus, actor, reason){
  if(!CAPACITY_HOLD_CANDIDATE_STATUSES.includes(newStatus)){
    return { ok:false, reason:'Unknown status: '+newStatus };
  }
  const previousStatus = candidate.status;
  candidate.statusHistory.push({ timestamp:new Date().toISOString(), previousStatus, newStatus, actor: actor||'system', reason: reason||'' });
  candidate.status = newStatus;
  candidate.updatedAt = new Date().toISOString();
  return { ok:true };
}

/* ---- Computed planning outputs — all read-only. None of these create a
   Match, MatchGeneration, Assignment, or Offer; "matches" here are
   informational only, evidence to inform a bid, never a binding
   placement. Corrected per explicit review: compliance and availability
   are kept as separately explained factors, never blended into one
   silent pass/fail; nothing is called "local" without evidence; a crew
   match is only "proven" with actual verified joint-deployment history,
   never on trade alone; unevaluable compliance items are marked so, not
   silently passed. ---- */
function computeLabourDemandByPhase(plan){
  return plan.phases.map(phase=>{
    const totalQuantity = phase.tradesNeeded.reduce((sum,t)=>sum+t.quantity,0);
    let days = 0;
    if(phase.startDate && phase.endDate){
      const diff = Math.round((new Date(phase.endDate)-new Date(phase.startDate))/(1000*60*60*24))+1;
      if(diff>0) days = diff;
    }
    return { phaseId: phase.id, phaseName: phase.phaseName, totalQuantity, estimatedLabourDays: totalQuantity*days, tradesNeeded: phase.tradesNeeded };
  });
}
function totalEstimatedLabourDays(plan){
  return computeLabourDemandByPhase(plan).reduce((sum,p)=>sum+p.estimatedLabourDays, 0);
}

/* Genuine weekly demand, alongside phase demand — not a replacement for
   it. Weeks are calendar weeks starting Monday. A phase spanning a week
   boundary contributes only the calendar days that actually fall within
   each week — never a full-week assumption for a partial week. Every day
   is treated identically regardless of weekday/weekend, exactly matching
   computeLabourDemandByPhase()'s own basis above, since nothing in this
   data distinguishes a working day from a rest day. Calculation basis:
   labour-days = quantity x calendar days in that phase within that week;
   no working-day, weekday-only, or holiday adjustment is applied.
   Deliberately pure-UTC throughout — a date-only string is parsed as UTC
   midnight, and every subsequent operation stays in UTC (Date.UTC(),
   getUTCDay(), getUTCFullYear() etc.), never crossing over to a
   local-time getter/setter at any point. Mixing the two was the exact
   bug in an earlier version: constructing a UTC-parsed date, mutating it
   with LOCAL-time setDate()/setHours(), then reading it back with
   toISOString() (which reports in UTC) silently shifted the labelled
   date by a day whenever the runtime's local time zone had a non-zero
   offset from UTC (e.g. British Summer Time, UTC+1) — local midnight
   becomes the previous UTC day's late evening. Working entirely in UTC
   timestamps (plain numbers) makes the result correct regardless of
   what time zone the browser or server happens to be running in. */
function computeWeeklyDemand(plan){
  const DAY_MS = 24*60*60*1000;
  function parseUTCDateTs(str){
    const parts = String(str).split('-').map(Number);
    if(parts.length !== 3 || parts.some(isNaN)) return NaN;
    return Date.UTC(parts[0], parts[1]-1, parts[2]);
  }
  function mondayOfWeekTs(ts){
    const d = new Date(ts);
    const day = d.getUTCDay(); // 0=Sun..6=Sat, evaluated in UTC only
    const offsetDays = (day===0 ? -6 : 1-day);
    return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()+offsetDays);
  }
  function isoDateOfTs(ts){
    const d = new Date(ts);
    const y = d.getUTCFullYear(), m = String(d.getUTCMonth()+1).padStart(2,'0'), day = String(d.getUTCDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  const weeks = {};
  plan.phases.forEach(phase=>{
    if(!phase.startDate || !phase.endDate) return;
    const startTs = parseUTCDateTs(phase.startDate), endTs = parseUTCDateTs(phase.endDate);
    if(isNaN(startTs) || isNaN(endTs) || startTs > endTs) return;
    let cursorTs = startTs;
    while(cursorTs <= endTs){
      const weekStartTs = mondayOfWeekTs(cursorTs);
      const weekEndTs = weekStartTs + 6*DAY_MS;
      const segStartTs = Math.max(cursorTs, weekStartTs);
      const segEndTs = Math.min(endTs, weekEndTs);
      const daysInThisWeek = Math.round((segEndTs - segStartTs)/DAY_MS) + 1;
      const weekKey = isoDateOfTs(weekStartTs);
      if(!weeks[weekKey]) weeks[weekKey] = { weekStart: weekKey, totalLabourDays: 0, phaseContributions: [] };
      (phase.tradesNeeded||[]).forEach(t=>{
        const labourDays = daysInThisWeek * (t.quantity||0);
        weeks[weekKey].totalLabourDays += labourDays;
        weeks[weekKey].phaseContributions.push({ phaseId: phase.id, phaseName: phase.phaseName, trade: t.trade, days: daysInThisWeek, quantity: t.quantity, labourDays });
      });
      cursorTs = segEndTs + DAY_MS;
    }
  });
  return Object.values(weeks).sort((a,b)=> a.weekStart.localeCompare(b.weekStart));
}

/* Structured compliance-requirement evaluation. Only CARD and TRAINING
   types can resolve to a definitive PASS/FAIL from the frozen
   evaluateRequirement(); everything else (QUALIFICATION, CAPABILITY,
   TOOLS, TRANSPORT, OTHER, or a CARD naming an unsupported scheme)
   resolves to REVIEW_REQUIRED there, which is treated here as "not
   evaluated" — visibly marked as needing manual review, and never
   counted toward a verified-match claim. */
function evaluateComplianceRequirement(worker, requirement){
  const result = evaluateRequirement(worker, requirement);
  const evaluated = result.result === 'PASS' || result.result === 'FAIL';
  return { requirementType: requirement.requirementType, value: requirement.value, result: result.result, reason: result.reason, evaluated };
}

function findVerifiedWorkerMatches(phase, plan){
  const neededTrades = new Set(phase.tradesNeeded.map(t=>(t.trade||'').toLowerCase()).filter(Boolean));
  if(neededTrades.size===0) return [];
  const complianceReqs = (plan && plan.siteComplianceRequirements) || [];
  return workers.filter(w=>neededTrades.has((w.tradeProfile.primaryTrade||'').toLowerCase())).map(w=>{
    const general = evaluateGeneralReadiness(w);
    const complianceStatus = general.status;
    const compliant = complianceStatus !== 'BLOCKED' && complianceStatus !== 'NOT_VERIFIED';
    const availability = w.commercial.availability;
    const available = availability === 'Available' || availability === 'Within 24h';
    const requirementResults = complianceReqs.map(r=>evaluateComplianceRequirement(w, r));
    const anyUnevaluated = requirementResults.some(r=>!r.evaluated);
    const anyFailed = requirementResults.some(r=>r.evaluated && r.result==='FAIL');
    return {
      workerId: w.id, workerName: w.identity.fullName, trade: w.tradeProfile.primaryTrade,
      complianceStatus, compliant, availability, available,
      locationStatus: 'NOT_EVALUATED', // honest — no travel/mobilisation-radius-vs-worker-location data exists to evaluate this
      requirementResults, anyUnevaluated, anyFailed,
      countsAsVerifiedCapacity: compliant && available && !anyFailed && !anyUnevaluated
    };
  });
}

function findCrewMatches(phase){
  const neededTrades = new Set(phase.tradesNeeded.map(t=>(t.trade||'').toLowerCase()).filter(Boolean));
  if(neededTrades.size===0) return [];
  return crews.filter(c=>c.trade && neededTrades.has(c.trade.toLowerCase())).map(c=>{
    const history = deriveCrewAssignmentHistory(c);
    return { crewId:c.id, crewName:c.name, trade:c.trade, evidenceLevel:history.evidenceLevel, jointDeploymentCount:history.jointDeploymentCount, proven: history.jointDeploymentCount > 0 };
  });
}

function computeForecastGaps(plan){
  return plan.phases.map(phase=>{
    const totalNeeded = phase.tradesNeeded.reduce((sum,t)=>sum+t.quantity, 0);
    const workerMatches = findVerifiedWorkerMatches(phase, plan);
    const verifiedWorkerIds = new Set(workerMatches.filter(m=>m.countsAsVerifiedCapacity).map(m=>m.workerId));
    const verifiedAvailable = verifiedWorkerIds.size;

    const holdsForPhase = capacityHolds.filter(h=>h.phaseId===phase.id);
    const candidatesForPhase = capacityHoldCandidates.filter(c=>holdsForPhase.some(h=>h.id===c.capacityHoldId));
    // Only provisionally_accepted and activated genuinely contribute to
    // forecast capacity — draft and invited are not yet any kind of
    // commitment and must never reduce a reported gap. Deduplicated by
    // worker ID so the same person cannot inflate the count through
    // multiple candidate records.
    const contributingWorkerIds = new Set(
      candidatesForPhase.filter(c=>c.status==='provisionally_accepted' || c.status==='activated').map(c=>c.workerId)
    );
    const provisionalCandidates = contributingWorkerIds.size;

    const statusTotals = {};
    CAPACITY_HOLD_CANDIDATE_STATUSES.forEach(s=>{ statusTotals[s] = new Set(candidatesForPhase.filter(c=>c.status===s).map(c=>c.workerId)).size; });

    // A genuine distinct-worker union — not Math.max(count, count), which
    // silently lost non-overlapping workers and miscounted overlapping
    // ones. verifiedAvailable and provisionalCandidates above remain the
    // two separately displayed source counts; only the gap calculation
    // itself uses the union.
    const unionWorkerIds = new Set([...verifiedWorkerIds, ...contributingWorkerIds]);
    const available = unionWorkerIds.size;
    const ratio = totalNeeded===0 ? 1 : available/totalNeeded;
    return {
      phaseId: phase.id, phaseName: phase.phaseName, needed: totalNeeded,
      verifiedAvailable, provisionalCandidates, statusTotals,
      gap: Math.max(0, totalNeeded-available),
      riskLevel: totalNeeded===0 ? 'NONE' : ratio>=1 ? 'LOW' : ratio>=0.5 ? 'MEDIUM' : 'HIGH'
    };
  });
}

/* The only path that creates a CapacityHoldCandidate — refuses a
   duplicate for the same (hold, worker) pair rather than allowing the
   same person to be added twice and inflate provisional capacity. */
function addCapacityHoldCandidate(capacityHoldId, workerId){
  const duplicate = capacityHoldCandidates.some(c=>c.capacityHoldId===capacityHoldId && c.workerId===workerId);
  if(duplicate){
    return { ok:false, reason:'This worker is already a candidate for this capacity hold.' };
  }
  const candidate = Object.assign(blankCapacityHoldCandidate(), { capacityHoldId, workerId });
  capacityHoldCandidates.push(candidate);
  return { ok:true, candidate };
}

function normaliseRequirementForCompare(r){ return [r.requirementType, r.value, !!r.mandatory, r.source].join('|'); }
function haveRequirementsChanged(liveRequirements, snapshotRequirements){
  const a = (liveRequirements||[]).map(normaliseRequirementForCompare).sort();
  const b = (snapshotRequirements||[]).map(normaliseRequirementForCompare).sort();
  return JSON.stringify(a) !== JSON.stringify(b);
}

/* =========================================================
   RELEASE 0.3-B — DEPLOYMENT CLEARANCE
   Worker Passport x Site Passport = Deployment Clearance, per the brief.
   A computed view over EXISTING authoritative data only (Decision 4) —
   never a stored entity, never a second gate. Reads the same frozen
   evaluateGeneralReadiness()/evaluateAssignmentReadiness() every other
   screen already trusts, plus the most recent final-gate snapshot for
   this assignment if one exists. Returns CLEARED / ACTION REQUIRED /
   BLOCKED with exact reasons — never lets a Performance Evidence score
   override a mandatory compliance failure, because it never computes
   anything itself that could do that; it only reads what the frozen
   engine already decided.
   ========================================================= */
function computeDeploymentClearance(worker, assignment){
  const request = workforceRequests.find(r=>r.id===assignment.requestId);
  const liveRequirements = request ? (request.requirements||[]) : [];
  const pure = evaluateRequirementsPure(worker, liveRequirements);

  let outcome, reasons;
  if(pure.status === 'BLOCKED'){
    outcome = 'BLOCKED';
    reasons = pure.generalReadiness.blockers.concat(pure.failedChecks);
  } else if(pure.status === 'HOLD' || pure.status === 'HUMAN_REVIEW'){
    outcome = 'ACTION REQUIRED';
    reasons = pure.failedChecks.concat(pure.reviewItems.map(r=>r.message||r));
  } else {
    outcome = 'CLEARED';
    reasons = pure.status === 'EXPIRING_SOON' ? pure.generalReadiness.warnings.slice() : [];
  }
  reasons = Array.from(new Set(reasons.filter(Boolean)));

  // The most recent recorded snapshot, if any, is separate historical
  // evidence — never blended into the outcome above. A BLOCKED snapshot
  // from yesterday does not make today's live CLEARED result BLOCKED, and
  // a CLEARED live result does not erase yesterday's BLOCKED snapshot as
  // evidence. Whether a fresh gate run is still required to actually
  // progress the assignment is a separate, honest question this function
  // answers explicitly rather than implying through the outcome alone.
  const latestSnapshot = readinessSnapshots
    .filter(s=>s.assignmentId===assignment.id)
    .sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt))[0] || null;

  const nonTerminal = !['ACTIVE','COMPLETED','REVIEWED','CANCELLED','NO_SHOW','REPLACED'].includes(assignment.status);
  const freshGateRequired = nonTerminal && (assignment.status==='ACCEPTED' || assignment.status==='CONFIRMED');

  return {
    outcome, reasons,
    expiringSoon: pure.status === 'EXPIRING_SOON',
    evaluatedAt: new Date().toISOString(),
    historicalSnapshot: latestSnapshot,
    freshGateRequired
  };
}
function deploymentClearanceTone(outcome){
  return outcome==='CLEARED' ? 'ok' : outcome==='ACTION REQUIRED' ? 'review' : 'danger';
}


/* ---- Snapshot recording — pure record function. Idempotent on
   (assignmentId, snapshotType, operationId): a repeated call for the SAME
   attempt returns the existing snapshot; a different operationId is a
   genuinely new attempt and may create a new one. ---- */
function takeReadinessSnapshot(params){
  const existing = readinessSnapshots.find(s=>s.assignmentId===params.assignmentId && s.snapshotType===params.snapshotType && s.operationId===params.operationId);
  if(existing) return { snapshot: existing, reused: true };
  const snap = normaliseReadinessSnapshot(Object.assign({}, params, { id: uid(), createdAt: new Date().toISOString() }));
  readinessSnapshots.push(snap);
  return { snapshot: snap, reused: false };
}

/* ---- Human Match approval (Section E / Rule 2) ----
   Idempotent: once match.decision is set, it is immutable — a repeated call
   returns the existing decision rather than overwriting it. APPROVE can
   never be recorded against a BLOCKED match; there is no override field. */
function approveMatch(match, decision, reviewedBy, reason){
  if(match.decision) return { ok:true, alreadyDecided:true, match };
  if(decision === 'APPROVE' && match.eligibility === 'BLOCKED'){
    return { ok:false, reason:'Cannot approve a BLOCKED match — a mandatory compliance failure cannot be overridden' };
  }
  match.decision = decision; match.reviewedBy = reviewedBy; match.reviewedAt = new Date().toISOString();
  if(reason) match.notes = reason;
  match.status = 'REVIEWED';
  return { ok:true, alreadyDecided:false, match };
}

/* ---- Production Assignment creation (Section E, Rules 1/2) ----
   Idempotent on matchId: a Match can only ever produce one Assignment.
   Every eligibility other than a genuinely clean or expiring-soon result,
   PLUS an explicit APPROVE decision, is refused. ---- */
function createAssignmentFromMatch(match, role){
  const existing = assignmentEntities.find(a=>a.matchId===match.id);
  if(existing) return { ok:true, alreadyExists:true, assignment:existing };

  if(match.eligibility === 'BLOCKED') return { ok:false, reason:'Cannot create an Assignment from a BLOCKED match' };
  if(match.eligibility === 'HOLD') return { ok:false, reason:'Cannot create an Assignment from a HOLD match — resolve availability first' };
  if(match.decision !== 'APPROVE') return { ok:false, reason:'Match requires a recorded APPROVE decision before an Assignment can be created' };

  const request = workforceRequests.find(r=>r.id===match.requestId);
  if(!request) return { ok:false, reason:'Match has no valid originating WorkforceRequest' };
  const worker = workers.find(w=>w.id===match.workerId);
  if(!worker) return { ok:false, reason:'Match has no valid Worker' };

  const a = blankAssignmentEntity();
  a.legacyRecord = false;
  a.matchId = match.id; a.generationId = match.generationId;
  a.workerId = match.workerId; a.requestId = match.requestId;
  a.contractorId = request.contractorId; a.projectId = request.projectId; a.siteId = request.siteId;
  a.trade = request.tradeRequired; a.startDate = request.startDate; a.endDate = request.endDate;
  a.role = role || 'PRIMARY';
  a.humanApprovedBy = match.reviewedBy || null; a.humanApprovedAt = match.reviewedAt || null;
  a.status = 'PROPOSED';
  a.statusHistory.push({ timestamp:new Date().toISOString(), actor:match.reviewedBy||'system', previousStatus:null, newStatus:'PROPOSED', reason:'Created from an approved Match', source:'MATCH_APPROVAL' });

  const v = validateAssignment(a);
  if(!v.valid) return { ok:false, reason:v.reason };

  assignmentEntities.push(a);

  const perf = performanceEvidence(worker);
  const general = evaluateGeneralReadiness(worker);
  takeReadinessSnapshot({
    workerId: worker.id, assignmentId: a.id, snapshotType:'MATCH_APPROVAL', operationId:'match-approval-'+match.id,
    generalReadinessStatus: general.status, assignmentReadinessStatus: match.eligibility,
    mandatoryChecks: match.matchFactors.filter(f=>f.mandatory).map(f=>f.reason),
    passedChecks: match.matchFactors.filter(f=>f.result==='PASS').map(f=>f.reason),
    failedChecks: match.matchFactors.filter(f=>f.result==='FAIL').map(f=>f.reason),
    warnings: general.warnings,
    reviewItems: match.matchFactors.filter(f=>f.result==='REVIEW_REQUIRED').map(f=>({type:f.factorType, message:f.reason})),
    performanceEvidenceScore: perf.score, performanceEvidenceBand: perf.band, performanceEvidenceParts: perf.parts,
    evaluatedAt: general.evaluatedAt, createdBy: match.reviewedBy || 'system',
    requirementsChangedSinceMatch: false // nothing has had a chance to change yet at the moment of creation
  });

  return { ok:true, alreadyExists:false, assignment:a };
}

/* ---- AssignmentOffer (Section F, Rule 7) ----
   Idempotent: a PENDING or already-ACCEPTED offer for this Assignment is
   reused, never duplicated. ---- */
function createOffer(assignment){
  const existing = assignmentOffers.find(o=>o.assignmentId===assignment.id && (o.status==='PENDING'||o.status==='ACCEPTED'));
  if(existing) return { ok:true, alreadyExists:true, offer:existing };
  if(assignment.status !== 'PROPOSED') return { ok:false, reason:`Cannot create an Offer from Assignment status ${assignment.status}` };

  const offer = blankAssignmentOffer();
  offer.assignmentId = assignment.id; offer.workerId = assignment.workerId; offer.requestId = assignment.requestId;
  assignmentOffers.push(offer);
  assignment.offerId = offer.id;
  transitionAssignmentStatus(assignment, 'OFFERED', 'Offer created and sent', 'system');
  return { ok:true, alreadyExists:false, offer };
}
// Per Rule 7: ACCEPTED means only that the worker accepted the offer — it
// does not confirm, ready, or deploy anything by itself. Decline is neutral:
// worker.assignments[] and performanceEvidence() are never touched here.
function recordOfferResponse(offer, status, declineReason){
  if(offer.status !== 'PENDING') return { ok:true, alreadyResolved:true, offer };
  offer.status = status; offer.workerResponseAt = new Date().toISOString();
  if(status !== 'ACCEPTED') offer.declineReason = declineReason || '';

  const assignment = assignmentEntities.find(a=>a.id===offer.assignmentId);
  if(assignment){
    if(status === 'ACCEPTED') transitionAssignmentStatus(assignment, 'ACCEPTED', 'Worker accepted the offer', 'worker');
    else transitionAssignmentStatus(assignment, 'CANCELLED', `Offer ${String(status).toLowerCase()}`, 'system');
  }
  return { ok:true, alreadyResolved:false, offer };
}

/* ---- Final readiness gate (Rules 1, 2, 3, 5 — the safety core) ----
   Always uses CURRENT worker data and CURRENT live Request/Site
   requirements — never the frozen MatchGeneration snapshot for the
   decision itself, only for comparison. Never modifies
   evaluateAssignmentReadiness() or anything it calls. ---- */
function evaluateFinalGate(assignment, gateType, operationId, actor){
  const worker = workers.find(w=>w.id===assignment.workerId);
  const request = workforceRequests.find(r=>r.id===assignment.requestId);
  const generation = matchGenerations.find(g=>g.id===assignment.generationId);

  const liveRequirements = request ? (request.requirements||[]) : [];
  const snapshotRequirements = generation ? (generation.requirementsSnapshot||[]) : [];
  const changed = haveRequirementsChanged(liveRequirements, snapshotRequirements);

  const mandatoryReqs = liveRequirements.filter(r=>r.mandatory);
  const adapterReqs = requirementsFromRequest(mandatoryReqs);
  const readiness = evaluateAssignmentReadiness(worker, adapterReqs);

  const customTypes = ['CARD','QUALIFICATION','CAPABILITY','TOOLS','TRANSPORT','OTHER'];
  let hasCustomMandatoryFail = false;
  const reviewItems = readiness.reviewItems.slice();
  const failedChecks = readiness.failedChecks.slice();
  const passedChecks = readiness.passedChecks.slice();
  let hasCustomReviewRequired = false;
  liveRequirements.filter(r=>customTypes.includes(r.requirementType)).forEach(r=>{
    const ev = evaluateRequirement(worker, r);
    if(ev.result==='PASS') passedChecks.push(`${r.requirementType}: ${ev.reason}`);
    else if(ev.result==='FAIL'){ failedChecks.push(`${r.requirementType}: ${ev.reason}`); if(r.mandatory) hasCustomMandatoryFail = true; }
    else if(ev.result==='REVIEW_REQUIRED'){ reviewItems.push({type:r.requirementType, message:ev.reason}); hasCustomReviewRequired = true; }
  });

  // RC4-A: an unresolved Site/Request conflict in the CURRENT live
  // requirements must be caught here too, not just at initial matching.
  // Same detection function, same principle — neither row is preferred,
  // both stay untouched, this only adds review evidence.
  const liveConflicts = detectRequirementConflictDetails(liveRequirements);
  liveConflicts.forEach(c=>{ reviewItems.push({type:'REQUIREMENT_CONFLICT', message:c.reason}); });

  const finalBlocked = (readiness.status==='BLOCKED') || hasCustomMandatoryFail;
  const finalHold = !finalBlocked && (readiness.status==='HOLD');
  // Use the frozen engine's own requiresHumanReview boolean directly, plus
  // any custom-requirement REVIEW_REQUIRED — never re-derive "needs review"
  // from reviewItems.length, since that array also carries the evidence-
  // completeness note, which Release 0.1 deliberately made non-blocking and
  // non-review-triggering on its own.
  const finalReview = !finalBlocked && !finalHold && (readiness.requiresHumanReview || hasCustomReviewRequired || liveConflicts.length > 0);

  let assignmentReadinessStatus;
  if(finalBlocked) assignmentReadinessStatus='BLOCKED';
  else if(finalHold) assignmentReadinessStatus='HOLD';
  else if(finalReview) assignmentReadinessStatus='HUMAN_REVIEW';
  else assignmentReadinessStatus=readiness.status;

  const perf = performanceEvidence(worker);
  const { snapshot, reused } = takeReadinessSnapshot({
    workerId: worker.id, assignmentId: assignment.id, snapshotType: gateType, operationId,
    generalReadinessStatus: readiness.generalReadiness.status, assignmentReadinessStatus,
    mandatoryChecks: mandatoryReqs.map(r=>`${r.requirementType}: ${r.value}`),
    passedChecks, failedChecks, warnings: readiness.warnings, reviewItems,
    performanceEvidenceScore: perf.score, performanceEvidenceBand: perf.band, performanceEvidenceParts: perf.parts,
    evaluatedAt: readiness.generalReadiness.evaluatedAt, createdBy: actor || 'system',
    requirementsChangedSinceMatch: changed
  });

  return { status: assignmentReadinessStatus, snapshot, reused, requirementsChangedSinceMatch: changed };
}

/* =========================================================
   0.3-B PATCH — PURE REQUIREMENT EVALUATION, WRITE-FREE
   Deliberately duplicates evaluateFinalGate()'s own evaluation logic
   above (mandatory-only adapter via requirementsFromRequest(), per-type
   evaluation of CARD/QUALIFICATION/CAPABILITY/TOOLS/TRANSPORT/OTHER via
   evaluateRequirement(), live conflict detection via
   detectRequirementConflictDetails()) rather than extracting it into a
   function evaluateFinalGate() itself calls. This is a deliberate
   trade-off against normal DRY practice: evaluateFinalGate() is part of
   the backend already verified byte-identical at every release since
   0.2C-Backend+RC4, and refactoring it — even a pure, behavior-preserving
   extraction — would show up as a changed function on that diff. Keeping
   it untouched and duplicating its rules here was judged the safer
   choice. If the two ever need to change, they must be changed together
   by hand; there is no shared source to update once.
   Performs zero writes: no snapshot, no persistence, nothing.
   ========================================================= */
function evaluateRequirementsPure(worker, liveRequirements){
  const mandatoryReqs = liveRequirements.filter(r=>r.mandatory);
  const adapterReqs = requirementsFromRequest(mandatoryReqs);
  const readiness = evaluateAssignmentReadiness(worker, adapterReqs);

  const customTypes = ['CARD','QUALIFICATION','CAPABILITY','TOOLS','TRANSPORT','OTHER'];
  let hasCustomMandatoryFail = false;
  const reviewItems = readiness.reviewItems.slice();
  const failedChecks = readiness.failedChecks.slice();
  const passedChecks = readiness.passedChecks.slice();
  let hasCustomReviewRequired = false;
  liveRequirements.filter(r=>customTypes.includes(r.requirementType)).forEach(r=>{
    const ev = evaluateRequirement(worker, r);
    if(ev.result==='PASS') passedChecks.push(`${r.requirementType}: ${ev.reason}`);
    else if(ev.result==='FAIL'){ failedChecks.push(`${r.requirementType}: ${ev.reason}`); if(r.mandatory) hasCustomMandatoryFail = true; }
    else if(ev.result==='REVIEW_REQUIRED'){ reviewItems.push({type:r.requirementType, message:ev.reason}); hasCustomReviewRequired = true; }
  });

  const liveConflicts = detectRequirementConflictDetails(liveRequirements);
  liveConflicts.forEach(c=>{ reviewItems.push({type:'REQUIREMENT_CONFLICT', message:c.reason}); });

  const finalBlocked = (readiness.status==='BLOCKED') || hasCustomMandatoryFail;
  const finalHold = !finalBlocked && (readiness.status==='HOLD');
  const finalReview = !finalBlocked && !finalHold && (readiness.requiresHumanReview || hasCustomReviewRequired || liveConflicts.length > 0);

  let status;
  if(finalBlocked) status='BLOCKED';
  else if(finalHold) status='HOLD';
  else if(finalReview) status='HUMAN_REVIEW';
  else status=readiness.status;

  return { status, passedChecks, failedChecks, reviewItems, warnings: readiness.warnings, generalReadiness: readiness.generalReadiness, liveConflicts };
}

/* =========================================================
   RELEASE 0.3-C — VERIFIED CREW INTELLIGENCE
   Crew joint-history can only be computed from assignments explicitly
   linked to a crew via crewId. Nothing in the app set crewId before this
   release, so it is added here as an optional, additive tag an operator
   can apply to any Assignment (new or existing) — createAssignmentFromMatch()
   itself is untouched. Crew metrics are computed only from assignments
   carrying crewId === this crew's id, and legacy assignments (which never
   had crewId at all) are correctly excluded by that filter alone, never
   specially handled — this is an honest limitation, not a workaround: a
   crew's Passport is only as deep as the joint-tagged history behind it.
   ========================================================= */
function setAssignmentCrew(assignment, crewId, actor){
  if(assignment.legacyRecord){
    return { ok:false, reason:'Legacy assignments have no verified crew linkage and cannot be tagged to a crew.' };
  }
  if(assignment.crewId && assignment.crewId !== crewId){
    return { ok:false, reason:'This assignment is already tagged to a different crew — remove that link first rather than silently reassigning it.' };
  }
  const crew = crews.find(c=>c.id===crewId);
  if(!crew){
    return { ok:false, reason:'Crew not found.' };
  }
  if(!crew.memberIds.includes(assignment.workerId)){
    return { ok:false, reason:'This assignment\'s worker is not an active member of this crew.' };
  }
  assignment.crewId = crewId;
  assignment.updatedAt = new Date().toISOString();
  assignment.statusHistory.push({
    timestamp: new Date().toISOString(), actor: actor||'system',
    previousStatus: assignment.status, newStatus: assignment.status,
    reason: 'Tagged to crew', source: 'CREW_LINK', newCrewId: crewId
  });
  return { ok:true };
}

/* ---- Controlled unlink (Correction 5) — the ONLY way a crew link is
   ever cleared. Always appends a traceable statusHistory entry (the same
   audit array every other Assignment event already uses) and persists.
   setAssignmentCrew() above still refuses to move a linked Assignment
   directly to a different crew — unlinking here and tagging elsewhere are
   always two separate, explicit actions, never one silent move. ---- */
function unlinkAssignmentFromCrew(assignment, actor, reason){
  if(!assignment.crewId){
    return { ok:false, reason:'This assignment is not currently linked to a crew.' };
  }
  const previousCrewId = assignment.crewId;
  assignment.statusHistory.push({
    timestamp: new Date().toISOString(), actor: actor||'system',
    previousStatus: assignment.status, newStatus: assignment.status,
    reason: reason || 'Crew link removed', source: 'CREW_UNLINK', previousCrewId
  });
  assignment.crewId = null;
  assignment.updatedAt = new Date().toISOString();
  return { ok:true, previousCrewId };
}

/* ---- Membership sync (0.3-C corrective patch) — the only place
   memberships[] is ever written. Preserves every existing record exactly;
   closes out a removed member's active record with leftAt rather than
   deleting it; gives a genuinely new member a real joinedAt; gives a
   migrated member (already active before membership tracking existed for
   this crew) an honest blank joinedAt rather than inventing one; never
   creates a second active record for the same worker; keeps role in sync
   with the current supervisor for active records only. ---- */
function syncCrewMemberships(oldMemberIds, newMemberIds, existingMemberships, supervisorId){
  const now = new Date().toISOString();
  const memberships = (existingMemberships||[]).map(m=>Object.assign({}, m));

  memberships.forEach(m=>{
    if(!m.leftAt && !newMemberIds.includes(m.workerId)){
      m.leftAt = now;
    }
  });

  newMemberIds.forEach(workerId=>{
    const hasActive = memberships.some(m=>m.workerId===workerId && !m.leftAt);
    if(!hasActive){
      const hasAnyPriorRecord = memberships.some(m=>m.workerId===workerId);
      const wasAlreadyInOldMemberIds = oldMemberIds.includes(workerId);
      memberships.push({
        workerId,
        role: workerId===supervisorId ? 'supervisor' : 'member',
        joinedAt: (wasAlreadyInOldMemberIds && !hasAnyPriorRecord) ? '' : now,
        leftAt: ''
      });
    }
  });

  return memberships.map(m => m.leftAt ? m : Object.assign({}, m, { role: m.workerId===supervisorId ? 'supervisor' : 'member' }));
}

/* ---- Period overlap — missing or unparsceable dates can never prove two
   people worked together; only a genuine, checkable date overlap can. ---- */
function assignmentPeriodsOverlap(a, b){
  if(!a.startDate || !a.endDate || !b.startDate || !b.endDate) return false;
  const aStart = new Date(a.startDate).getTime(), aEnd = new Date(a.endDate).getTime();
  const bStart = new Date(b.startDate).getTime(), bEnd = new Date(b.endDate).getTime();
  if([aStart,aEnd,bStart,bEnd].some(n=>isNaN(n))) return false;
  return aStart <= bEnd && bStart <= aEnd;
}

/* =========================================================
   VERIFIED-DEPLOYMENT DEFINITIONS
   Two related but distinct questions, answered by two functions sharing
   the same eligibility rule and the same assignmentPeriodsOverlap()
   primitive, so they can never disagree about what an overlap is — but
   deliberately different in what they conclude from it:
   - findVerifiedDeploymentGroups() (below): "was this one continuous
     crew deployment?" — transitive: A-B overlap and B-C overlap is one
     deployment even if A and C never directly overlapped, because B
     bridges them in time. Used for deployment-level counting.
   - findDirectOverlapEdges() (further below): "did these two specific
     people actually work together?" — strict pairwise only, never
     transitive. Used for partner-finding. A and C in the example above
     are never partners of each other on the strength of B alone.
   Shared eligibility for both: the same explicit crewId; the same
   non-empty requestId (no site/date fallback — a record without
   requestId is never eligible at all); at least two DISTINCT workers who
   each hold a crew membership record for this crew (current OR
   historical — removing a member must affect current availability and
   recommendations, never erase the verified deployments they actually
   completed while linked); assignment periods that genuinely overlap
   (same requestId alone is insufficient — sequential replacements under
   one request must not be counted as having worked together; missing
   dates cannot prove it). Legacy assignments are excluded outright,
   never specially handled.
   ========================================================= */
function findVerifiedDeploymentGroups(crew){
  const everMemberIds = new Set((crew.memberships||[]).map(m=>m.workerId));
  const eligible = assignmentEntities.filter(a=>!a.legacyRecord && a.crewId===crew.id && a.requestId && everMemberIds.has(a.workerId));

  const byRequest = {};
  eligible.forEach(a=>{ (byRequest[a.requestId] = byRequest[a.requestId]||[]).push(a); });

  const verifiedGroups = [];
  Object.values(byRequest).forEach(group=>{
    const visited = new Array(group.length).fill(false);
    for(let i=0;i<group.length;i++){
      if(visited[i]) continue;
      const queue=[i]; visited[i]=true; const component=[group[i]];
      while(queue.length){
        const cur = queue.shift();
        for(let j=0;j<group.length;j++){
          if(visited[j]) continue;
          if(assignmentPeriodsOverlap(group[cur], group[j])){ visited[j]=true; queue.push(j); component.push(group[j]); }
        }
      }
      const distinctMembers = new Set(component.map(a=>a.workerId));
      if(distinctMembers.size >= 2) verifiedGroups.push(component);
    }
  });
  return verifiedGroups;
}

/* ---- Direct overlap edges — STRICT pairwise only, never transitive.
   findVerifiedDeploymentGroups() above is correct for representing one
   continuous crew deployment as a whole (A-B-C can be one deployment even
   if A and C never directly overlapped, because B bridges them in time).
   But that is not the same claim as "A and C are verified partners" — if
   A only ever overlapped B, and B only ever overlapped C, A and C never
   actually worked together and must never be recorded as partners of each
   other. This function returns only the direct edges: two distinct
   workers, same crew, same non-empty request, both holding a membership
   record, whose OWN assignment periods directly overlap. Shares the same
   grouping-by-request and the same assignmentPeriodsOverlap() primitive
   as the function above, so the two can never disagree about what counts
   as an overlap — they simply answer different questions with it. ---- */
function findDirectOverlapEdges(crew){
  const everMemberIds = new Set((crew.memberships||[]).map(m=>m.workerId));
  const eligible = assignmentEntities.filter(a=>!a.legacyRecord && a.crewId===crew.id && a.requestId && everMemberIds.has(a.workerId));
  const byRequest = {};
  eligible.forEach(a=>{ (byRequest[a.requestId] = byRequest[a.requestId]||[]).push(a); });

  const edges = [];
  Object.values(byRequest).forEach(group=>{
    for(let i=0;i<group.length;i++){
      for(let j=i+1;j<group.length;j++){
        if(group[i].workerId !== group[j].workerId && assignmentPeriodsOverlap(group[i], group[j])){
          edges.push({ workerA: group[i].workerId, workerB: group[j].workerId });
        }
      }
    }
  });
  return edges;
}

function deriveCrewAssignmentHistory(crew){
  const verifiedGroups = findVerifiedDeploymentGroups(crew);
  const verifiedAssignments = verifiedGroups.flat();
  const verifiedIds = new Set(verifiedAssignments.map(a=>a.id));

  // Honestly labelled, never silently dropped: every crewId-tagged,
  // non-legacy record that did NOT make it into a verified group — no
  // requestId, or a requestId shared with no one, or no date overlap.
  const allTagged = assignmentEntities.filter(a=>!a.legacyRecord && a.crewId===crew.id);
  const insufficientlyLinkedCount = allTagged.filter(a=>!verifiedIds.has(a.id)).length;

  const outcomesRecorded = verifiedAssignments.filter(a => a.attended === true || a.attended === false);
  const attendedCount = outcomesRecorded.filter(a => a.attended === true).length;
  const noShowCount = verifiedAssignments.filter(a => a.noShow === true).length;
  const punctualBase = outcomesRecorded.filter(a => a.attended === true);
  const onTimeCount = punctualBase.filter(a => !a.late).length;

  return {
    jointDeploymentCount: verifiedGroups.length,
    verifiedAssignmentCount: verifiedAssignments.length,
    insufficientlyLinkedCount,
    outcomesRecordedNumerator: outcomesRecorded.length,
    outcomesRecordedDenominator: verifiedAssignments.length,
    attendedCount, noShowCount,
    punctualityNumerator: onTimeCount,
    punctualityDenominator: punctualBase.length,
    replacementsRequired: verifiedAssignments.filter(a => a.status === 'REPLACED').length,
    rehires: verifiedAssignments.filter(a => a.rehireDecision === 'yes').length,
    provenProjectTypes: Array.from(new Set(verifiedAssignments.map(a => a.trade).filter(Boolean))),
    evidenceLevel: verifiedGroups.length === 0 ? 'NO_VERIFIED_JOINT_HISTORY' : verifiedGroups.length < 3 ? 'LIMITED' : 'ESTABLISHED'
  };
}

/* ---- Distinct verified deployment partners for a worker — uses ONLY the
   direct overlap edges above, across every crew the worker has ever held
   a membership record for. Deliberately does NOT walk
   findVerifiedDeploymentGroups()'s transitive components: being in the
   same continuous deployment as someone is not the same fact as having
   directly overlapped with them. A Set naturally de-duplicates a partner
   reached via multiple overlapping assignment rows. ---- */
function findVerifiedDeploymentPartners(workerId){
  const partners = new Set();
  crews.forEach(crew=>{
    const everMember = (crew.memberships||[]).some(m=>m.workerId===workerId);
    if(!everMember) return;
    findDirectOverlapEdges(crew).forEach(edge=>{
      if(edge.workerA===workerId) partners.add(edge.workerB);
      else if(edge.workerB===workerId) partners.add(edge.workerA);
    });
  });
  return partners;
}

/* ---- Substitution ranking — a recommendation, never a decision. Excludes
   every case evaluateAssignmentReadiness() itself calls BLOCKED — general
   compliance BLOCKED, NOT_VERIFIED, and trade mismatch alike, via the one
   correct check rather than re-deriving exclusion from general status
   alone. A HOLD candidate (e.g. availability not confirmed) is kept
   visible but labelled explicitly as not currently deployable, with the
   exact reason shown — never silently ranked as if fully available.
   Never creates an Assignment and never bypasses Match, approval, Offer,
   or the final-gate lifecycle — this only informs who an operator might
   consider next. ---- */
function rankCrewSubstitutes(crew, departingWorkerId){
  const remainingMemberIds = crew.memberIds.filter(id => id !== departingWorkerId);
  const departingWorker = workers.find(w => w.id === departingWorkerId);
  const targetTrade = crew.trade || (departingWorker ? departingWorker.tradeProfile.primaryTrade : '');

  const candidates = workers.filter(w => !crew.memberIds.includes(w.id));
  const scored = candidates.map(w => {
    let score = 0;
    const reasons = [];
    const assignmentReadiness = evaluateAssignmentReadiness(w, {tradeRequired: targetTrade, requiredTraining:[], requiredSectorExperience:[]});
    const general = assignmentReadiness.generalReadiness;

    if(targetTrade && w.tradeProfile.primaryTrade.toLowerCase().includes(targetTrade.toLowerCase())){ score += 25; reasons.push('Trade match'); }
    if(general.status === 'GENERAL_READY'){ score += 25; reasons.push('Compliance eligible'); }
    else if(general.status === 'EXPIRING_SOON'){ score += 15; reasons.push('Compliance eligible — a credential expires soon'); }
    if(assignmentReadiness.requiresHumanReview){ reasons.push('Would need human review before deployment (e.g. limited verified history)'); }

    let notCurrentlyDeployable = false, availabilityReason = '';
    if(assignmentReadiness.status === 'HOLD'){
      notCurrentlyDeployable = true;
      availabilityReason = assignmentReadiness.failedChecks[0] || 'Availability not confirmed';
      reasons.push('Not currently deployable — ' + availabilityReason);
    }

    const partners = findVerifiedDeploymentPartners(w.id);
    const overlapCount = remainingMemberIds.filter(mId => partners.has(mId)).length;
    if(overlapCount > 0){ score += Math.min(20, overlapCount*5); reasons.push(`Verified prior deployment alongside ${overlapCount} remaining member${overlapCount===1?'':'s'}`); }

    if(w.commercial.availability === 'Available'){ score += 15; reasons.push('Currently available'); }
    else if(w.commercial.availability === 'Within 24h'){ score += 8; reasons.push('Available within 24h'); }

    const perf = performanceEvidence(w);
    if(perf.score !== null){ score += Math.round(perf.score * 0.15); reasons.push(`Performance Evidence ${perf.score}%`); }

    return { workerId: w.id, workerName: w.identity.fullName, score, reasons, assignmentStatus: assignmentReadiness.status, notCurrentlyDeployable, availabilityReason };
  });

  return scored
    .filter(s => s.assignmentStatus !== 'BLOCKED')
    .sort((a,b) => b.score - a.score)
    .slice(0, 10);
}

/* ---- Final-gate human review resolution (Rule 2) ----
   Idempotent on snapshotId. Structurally cannot be recorded against a
   BLOCKED result — there is no code path that lets a human "approve past"
   a genuine mandatory compliance failure. ---- */
const FINAL_GATE_DECISIONS = ['APPROVE','REJECT'];
function resolveFinalGateReview(assignment, snapshotId, resolvedBy, decision, reason){
  if(!FINAL_GATE_DECISIONS.includes(decision)){
    return { ok:false, reason:`Unknown decision "${decision}" — must be APPROVE or REJECT` };
  }
  const existing = assignment.finalGateReviews.find(r=>r.snapshotId===snapshotId);
  if(existing) return { ok:true, alreadyResolved:true, review:existing };

  const snapshot = readinessSnapshots.find(s=>s.id===snapshotId);
  if(!snapshot) return { ok:false, reason:'Snapshot not found' };
  if(snapshot.assignmentId !== assignment.id){
    return { ok:false, reason:'Snapshot does not belong to this Assignment' };
  }
  // Only genuine uncertainty is reviewable. BLOCKED/HOLD/ASSIGNMENT_READY/
  // EXPIRING_SOON are all refused here — APPROVE resolves uncertainty only,
  // it can never be the mechanism that turns a mandatory FAIL (or any other
  // non-HUMAN_REVIEW result) into permission to proceed.
  if(snapshot.assignmentReadinessStatus !== 'HUMAN_REVIEW'){
    return { ok:false, reason:`Cannot record a final-gate review against a ${snapshot.assignmentReadinessStatus} result — only HUMAN_REVIEW can be resolved by human decision` };
  }
  const review = { snapshotId, gate: snapshot.snapshotType, resolvedBy, resolvedAt: new Date().toISOString(), decision, reason: reason||'' };
  assignment.finalGateReviews.push(review);
  return { ok:true, alreadyResolved:false, review };
}

/* ---- Quantity / reserve controls (Rule 6) ---- */
function effectiveQuantityLimit(request){
  if(!request.quantityOverrides || !request.quantityOverrides.length) return request.quantityRequired;
  return request.quantityOverrides[request.quantityOverrides.length-1].newQuantity;
}
function countConfirmedPrimaryAssignments(requestId){
  return assignmentEntities.filter(a=>a.requestId===requestId && a.role==='PRIMARY' && (a.status==='CONFIRMED'||a.status==='ACTIVE')).length;
}
// Every override is its own immutable historical entry — never overwritten.
// Every override is its own immutable historical entry — never overwritten.
// Idempotent on (requestId, operationId): a repeated call for the same
// attempt returns the existing override rather than creating another.
function recordQuantityOverride(request, operationId, approvedBy, reason, newQuantity){
  const existing = (request.quantityOverrides||[]).find(o=>o.operationId===operationId);
  if(existing) return { ok:true, alreadyExists:true, override:existing };

  if(!Number.isInteger(newQuantity) || newQuantity <= 0){
    return { ok:false, reason:'newQuantity must be a positive integer' };
  }
  const currentConfirmed = countConfirmedPrimaryAssignments(request.id);
  if(newQuantity < currentConfirmed){
    return { ok:false, reason:`Cannot set quantity (${newQuantity}) below the number of already confirmed/active primary Assignments (${currentConfirmed}) — no rule exists for retroactively un-confirming a worker` };
  }

  const previousQuantity = effectiveQuantityLimit(request);
  const entry = { operationId, approvedBy, approvedAt:new Date().toISOString(), reason, previousQuantity, newQuantity };
  request.quantityOverrides.push(entry);
  return { ok:true, alreadyExists:false, override:entry };
}
// Minimum reserve support (not full Continuity): a deliberate, human-recorded
// action. No automatic promotion, no replacement search.
// RC4-B: reserve promotion is a domain operation and must establish CURRENT
// readiness itself, atomically, rather than trusting a stale Match approval
// or a previously-taken snapshot handed in by a caller. Reuses the existing
// evaluateFinalGate() directly — a new snapshotType ('RESERVE_PROMOTION'),
// not a second readiness engine and not a new data structure. If operationId
// is omitted, one is generated so every call without an explicit one gets
// its own fresh check; a caller that wants idempotent-retry behaviour for a
// genuine double-click passes the same operationId deliberately.
function promoteReserveToPrimary(assignment, actor, reason, operationId){
  if(assignment.role === 'PRIMARY') return { ok:true, noop:true };

  const gate = evaluateFinalGate(assignment, 'RESERVE_PROMOTION', operationId || uid(), actor);

  if(gate.status === 'BLOCKED') return { ok:false, reason:'Cannot promote — current readiness is BLOCKED', gate };
  if(gate.status === 'HOLD') return { ok:false, reason:'Cannot promote — current readiness is HOLD (e.g. availability not confirmed)', gate };
  if(gate.status === 'HUMAN_REVIEW'){
    const resolved = assignment.finalGateReviews.find(r=>r.snapshotId===gate.snapshot.id && r.decision==='APPROVE');
    if(!resolved) return { ok:false, reason:'Promotion paused — HUMAN_REVIEW must be explicitly resolved before this reserve can become primary', gate };
  }

  const request = workforceRequests.find(r=>r.id===assignment.requestId);
  if(request){
    const limit = effectiveQuantityLimit(request);
    const currentCount = countConfirmedPrimaryAssignments(request.id);
    if(currentCount >= limit){
      return { ok:false, reason:`Promoting would exceed the permitted quantity (${currentCount}/${limit}) — requires an authorised quantity override first`, gate };
    }
  }

  assignment.role = 'PRIMARY';
  assignment.statusHistory.push({ timestamp:new Date().toISOString(), actor, previousStatus:assignment.status, newStatus:assignment.status, reason: reason||'Promoted from reserve', source:'RESERVE_PROMOTION' });
  return { ok:true, noop:false, gate };
}

/* ---- The one authoritative state-transition function (Section D) ----
   Idempotent: already-at-target is a safe no-op with no duplicate
   statusHistory entry. Anything not in ASSIGNMENT_TRANSITIONS is refused. ---- */
function transitionAssignmentStatus(assignment, newStatus, reason, actor){
  if(assignment.status === newStatus) return { ok:true, noop:true };
  const allowed = ASSIGNMENT_TRANSITIONS[assignment.status] || [];
  if(!allowed.includes(newStatus)) return { ok:false, reason:`Illegal transition from ${assignment.status} to ${newStatus}` };
  const previousStatus = assignment.status;
  assignment.status = newStatus;
  assignment.updatedAt = new Date().toISOString();
  assignment.statusHistory.push({ timestamp:new Date().toISOString(), actor, previousStatus, newStatus, reason, source:'PRJGENUI' });
  return { ok:true, noop:false };
}

/* ---- CONFIRMED and ACTIVE — each its own independent fresh gate (Rules 1, 3, 6) ---- */
function confirmAssignment(assignment, operationId, actor){
  if(assignment.status === 'CONFIRMED') return { ok:true, noop:true };
  if(assignment.status !== 'ACCEPTED') return { ok:false, reason:`Cannot confirm from status ${assignment.status}` };

  const gate = evaluateFinalGate(assignment, 'PRE_CONFIRMATION', operationId, actor);

  if(gate.status === 'BLOCKED' || gate.status === 'HOLD'){
    return { ok:false, reason:`PRE_CONFIRMATION gate: ${gate.status} — cannot confirm`, gate };
  }
  if(gate.status === 'HUMAN_REVIEW'){
    const resolved = assignment.finalGateReviews.find(r=>r.snapshotId===gate.snapshot.id && r.decision==='APPROVE');
    if(!resolved) return { ok:false, reason:'PRE_CONFIRMATION returned HUMAN_REVIEW — awaiting authorised final-gate review', gate };
  }

  const request = workforceRequests.find(r=>r.id===assignment.requestId);
  if(assignment.role === 'PRIMARY' && request){
    const limit = effectiveQuantityLimit(request);
    const currentCount = countConfirmedPrimaryAssignments(request.id);
    if(currentCount >= limit) return { ok:false, reason:`Quantity limit reached (${currentCount}/${limit}) — requires an authorised override`, gate };
  }

  transitionAssignmentStatus(assignment, 'CONFIRMED', 'PRE_CONFIRMATION gate passed', actor||'system');
  return { ok:true, noop:false, gate };
}
function activateAssignment(assignment, operationId, actor){
  if(assignment.status === 'ACTIVE') return { ok:true, noop:true };
  if(assignment.status !== 'CONFIRMED') return { ok:false, reason:`Cannot activate from status ${assignment.status}` };

  const gate = evaluateFinalGate(assignment, 'PRE_DEPLOYMENT', operationId, actor);

  if(gate.status === 'BLOCKED' || gate.status === 'HOLD'){
    return { ok:false, reason:`PRE_DEPLOYMENT gate: ${gate.status} — cannot activate`, gate };
  }
  if(gate.status === 'HUMAN_REVIEW'){
    const resolved = assignment.finalGateReviews.find(r=>r.snapshotId===gate.snapshot.id && r.decision==='APPROVE');
    if(!resolved) return { ok:false, reason:'PRE_DEPLOYMENT returned HUMAN_REVIEW — awaiting authorised final-gate review', gate };
  }

  transitionAssignmentStatus(assignment, 'ACTIVE', 'PRE_DEPLOYMENT gate passed', actor||'system');
  return { ok:true, noop:false, gate };
}

/* =========================================================
   COMPLIANCE ACTION CENTRE — shared builder used by both the
   Dashboard preview and the full Compliance screen, so the
   two can never disagree about what's on the list.
   ========================================================= */
function buildActionCentre(){
  const critical = [], dueSoon = [], missingEv = [], devGaps = [];
  workers.forEach(w=>{
    const r = evaluateWorkerReadiness(w);
    r.blockers.forEach(b=>{
      critical.push({worker:w, issue:b, severity:'CRITICAL', action: actionForBlocker(b)});
    });
    r.expiringItems.forEach(e=>{
      dueSoon.push({worker:w, issue:`${e.item} — due ${fmtDate(e.expiryDate)}`, severity: expiryBand(e.expiryDate)==='warn'?'DUE SOON':'WATCH', action:`Renew ${e.item.toLowerCase()}`});
    });
    if(r.missingEvidence.length){
      missingEv.push({worker:w, issue: r.missingEvidence.join(', '), severity:'MISSING EVIDENCE', action:'Complete evidence pack'});
    }
    if(w.tradeProfile.competenceScore===null){
      devGaps.push({worker:w, issue:'Competence assessment needed', severity:'DEVELOPMENT', action:'Assess and record competence'});
    }
    if((w.proofOfWork||[]).length===0){
      devGaps.push({worker:w, issue:'No proof-of-work record yet', severity:'DEVELOPMENT', action:'Log first verified job'});
    }
  });
  return {critical, dueSoon, missingEv, devGaps};
}
function actionForBlocker(b){
  if(b.includes('Right to Work')) return 'Verify via share code, manual check or Employer Checking Service';
  if(b.includes('CSCS')) return 'Verify via CSCS Smart Check';
  if(b.includes('No training certificates')) return 'Add training certificates';
  if(b.includes('not verified')) return 'Mark verified once evidence is checked, not before';
  if(b.includes('available')) return 'Confirm availability';
  if(b.includes('expired')) return 'Renew and re-verify';
  return 'Review and resolve';
}

                ${badge(expiryBadgeStatus(w.cscs.status!=='valid'?'expired':expiryBand(w.cscs.expiryDate)), 'CSCS')}
                ${badge(statusTone, r.deploymentStatus)}
              </div>
              <div class="row-score">${sc.score===null?'<span style="color:var(--slate);font-weight:400;">—</span>':sc.score+'%'}<span class="u">performance evidence</span></div>
              <button class="btn small" data-edit="${w.id}">Edit</button>
            </div>`;
          }).join('')}
    </div>`;
}

/* =========================================================
   WORKER FORM — the Worker Passport
   ========================================================= */

  const w = editingId ? workerById(editingId) : blankWorker();

  const sc = performanceEvidence(w);
  const ev = evidenceCompleteness(w);

        <div><div class="kicker">Main blocker</div>${esc(r.mainBlocker)}</div>

    <div class="panel">
      <h3 style="margin-top:0;">Performance Evidence</h3>
      <p class="hint">Supporting information only — competence, reliability, and verified history. Can prompt human review; can never create or override a compliance block.</p>

        <div><div class="kicker">Performance Evidence</div>${sc.score===null?'Insufficient verified history':sc.score+'% · '+sc.band}</div>
        <div><div class="kicker">Evidence completeness</div>${ev.percent}%</div>
