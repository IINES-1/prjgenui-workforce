          <div class="field"><label>Nationality (optional)</label><input type="text" id="f_nationality" value="${esc(w.identity.nationality)}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Primary trade</label><input type="text" id="f_trade" value="${esc(w.tradeProfile.primaryTrade)}" placeholder="e.g. Painter and decorator" required></div>
          <div class="field"><label>Years experience</label><input type="text" id="f_yearsExp" value="${esc(w.tradeProfile.yearsExperience)}"></div>
        </div>

        <h2 style="margin-top:6px;">Right to work</h2>

          <div class="field"><label>Status</label>

        <div class="subsection">

            <div class="field"><label>Card type / occupation</label><input type="text" id="f_cscsType" value="${esc(w.cscs.cardType)}"></div>
            <div class="field"><label>Scheme</label><input type="text" id="f_cscsScheme" value="${esc(w.cscs.scheme)}"></div>

          </div>
          <div class="field"><label>Evidence reference (required to mark valid)</label><input type="text" id="f_cscsEvidence" value="${esc(w.cscs.evidenceReference)}" placeholder="e.g. checked via CSCS Smart Check 04/09/2026"></div>
          <p class="hint">Confirm via CSCS Smart Check or cscssmartcheck.co.uk — never rely on the card alone.</p>
        </div>

        <div class="subsection">
          <h2>Training certificates</h2>
          <div id="certRows">${(w.trainingCertificates||[]).map(c=>certRowHtml(c)).join('')}</div>

        ${w.auditLog && w.auditLog.length ? `
        <div class="subsection">
          <h2>Verification history</h2>
          <div>${w.auditLog.map(a=>`<div class="audit-item"><b>${esc(formatAuditTimestamp(a.timestamp))}</b> — ${esc(a.category)}${a.field?' ('+esc(a.field)+')':''}: ${esc(a.newValue===null?'—':a.newValue)}${a.oldValue?' (was '+esc(a.oldValue)+')':''}${a.note?' — '+esc(a.note):''}</div>`).join('')}</div>
        </div>` : ''}
      </div>

      <div class="panel">
        <div class="kicker">Availability &amp; commercial</div>
        <div class="field-row three" style="margin-top:10px;">
          <div class="field"><label>Postcode</label><input type="text" id="f_postcode" value="${esc(w.commercial.postcode)}" placeholder="e.g. GU1 3AA"></div>
          <div class="field"><label>Travel radius (miles)</label><input type="number" id="f_radius" value="${esc(w.commercial.travelRadius)}" min="0"></div>
          <div class="field"><label>Day rate (£)</label><input type="number" id="f_rate" value="${esc(w.commercial.dayRate)}" min="0"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Availability</label>
            <select id="f_availability">${AVAILABILITY_OPTIONS.map(o=>`<option ${w.commercial.availability===o?'selected':''}>${o}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Available from</label><input type="date" id="f_availableFrom" value="${w.commercial.availableFrom||''}"></div>
        </div>
        <div class="field">
          <label>Sector experience</label>
          <div class="checkgrid">${SECTOR_OPTIONS.map(s=>`<label><input type="checkbox" class="sectorCheck" value="${s}" ${(w.commercial.sectorExperience||[]).includes(s)?'checked':''}> ${s}</label>`).join('')}</div>
        </div>
        <div class="field"><label>Own tools / transport</label><input type="text" id="f_transport" value="${esc(w.commercial.transport)}" placeholder="e.g. own van, own tools"></div>
        <div class="field"><label>Notes</label><input type="text" id="f_commercialNotes" value="${esc(w.commercial.notes)}"></div>
      </div>

      <div class="panel">
        <div class="kicker">Performance history — what Performance Evidence is built from</div>
        <h2 style="margin-top:6px;">Competence</h2>
        <p class="hint" style="margin-top:-4px;margin-bottom:10px;">The one score component that's a judgment call — base it on specific evidence, not a default number.</p>
        <div class="field-row">
          <div class="field"><label>Competence score (0-20)</label><input type="number" id="f_competence" min="0" max="20" value="${w.tradeProfile.competenceScore===null||w.tradeProfile.competenceScore===undefined?'':w.tradeProfile.competenceScore}"></div>
          <div class="field"><label>Assessed by</label><input type="text" id="f_competenceBy" value="${esc(w.tradeProfile.competenceAssessedBy)}"></div>
        </div>
        <div class="field"><label>Evidence / basis for assessment</label><input type="text" id="f_competenceEvidence" value="${esc(w.tradeProfile.competenceEvidence)}" placeholder="e.g. site walk, specific job observed"></div>

        <div class="subsection">
          <h2>Proof of work</h2>
          <div id="proofRows">${(w.proofOfWork||[]).map(p=>proofRowHtml(p)).join('')}</div>
          <button type="button" class="btn small" id="addProofBtn">+ Add proof of work</button>
        </div>

        <div class="subsection">
          <h2>Assignment history</h2>
          <p class="hint" style="margin-top:-4px;margin-bottom:10px;">Log every assignment, not just the good ones.</p>
          <div id="assignRows">${(w.assignments||[]).map(a=>assignRowHtml(a)).join('')}</div>
          <button type="button" class="btn small" id="addAssignBtn">+ Add assignment</button>
        </div>

        <div class="subsection">
          <h2>Performance Evidence — how it's calculated</h2>
          ${scoreBreakdownHtml(sc)}
          <p class="hint" style="margin-top:10px;">Shown openly to keep this defensible and appealable — not a hidden number.</p>
        </div>
      </div>

      <div class="form-actions">
        <div>${editingId ? '<button type="button" class="btn danger" id="deleteWorkerBtn">Delete worker</button>' : ''}</div>
        <div style="display:flex;gap:10px;">
          <button type="button" class="btn" id="cancelFormBtn">Cancel</button>
          <button type="submit" class="btn primary">Save passport</button>
        </div>
      </div>
    </form>`;
}

/* =========================================================
   CREWS
   ========================================================= */
function renderCrewsList(){
  return `
    <h1>Crews</h1>
    <p class="lead">${crews.length} crew${crews.length===1?'':'s'} with a working history together.</p>
    <div class="toolbar"><button class="btn primary" id="addCrewBtn">Add crew</button></div>
    <div class="panel">
      ${crews.length===0
        ? `<div class="empty"><h3>No crews yet</h3><p>A crew is a group of workers with a track record of working well together — add one once you've seen it happen.</p></div>`
        : crews.map(c=>{
            const rebook = c.deployments.length ? Math.round(c.deployments.filter(d=>d.workedWell).length / c.deployments.length * 100) : null;
            const confStatus = c.deployments.length===0 ? 'NEW CREW' : c.deployments.length<3 ? 'LIMITED EVIDENCE' : 'PROVEN CREW';
            return `<div class="row">
              <div class="row-main"><div class="name">${esc(c.name)}</div><div class="sub">${c.memberIds.length} members${c.specialism?' · '+esc(c.specialism):''}</div></div>
              <div class="row-badges">${badge(confStatus==='PROVEN CREW'?'ok':confStatus==='LIMITED EVIDENCE'?'watch':'none', confStatus)}</div>
              <div class="row-score">${rebook===null?'<span style="color:var(--slate);font-weight:400;">New</span>':rebook+'%'}<span class="u">worked well</span></div>
              <button class="btn small" data-view-crew-passport="${c.id}">View Passport</button>
              <button class="btn small" data-edit-crew="${c.id}">Edit</button>
            </div>`;
          }).join('')}
    </div>`;
}
function renderCrewDetail(){
  const c = crews.find(x=>x.id===selectedCrewId);
  if(!c) return `<p>Crew not found.</p><button class="btn" id="backToCrewsBtn">Back to Crews</button>`;
  const supervisor = workers.find(w=>w.id===c.supervisorId);
  const members = c.memberIds.map(id=>workers.find(w=>w.id===id)).filter(Boolean);
  const history = deriveCrewAssignmentHistory(c);
  const incidents = evidenceRecords.filter(e=>e.subjectType==='CREW' && e.subjectId===c.id && e.category==='HS_INCIDENT');

  const availStates = members.map(m=>m.commercial.availability);
  const allAvailable = members.length>0 && availStates.every(a=>a==='Available');
  const anyUnavailable = availStates.some(a=>a==='Unavailable');

  return `
    <div class="breadcrumb"><a data-crumb="crews">Crews</a> / ${esc(c.name)}</div>
    <h1>${esc(c.name)} <span class="hint" style="font-weight:400;">Crew Passport</span></h1>
    <p class="lead">${esc(c.trade||'Trade not set')} ${c.region?'· '+esc(c.region):''} ${c.specialism?'· '+esc(c.specialism):''}</p>

    <div class="panel">
      <h3 style="margin-top:0;">Crew identity</h3>
      <div style="display:flex;flex-wrap:wrap;gap:18px;">
        <div><div class="kicker">Supervisor / crew lead</div>${supervisor?esc(supervisor.identity.fullName):'<span class="hint">Not set</span>'}</div>
        <div><div class="kicker">Members</div>${members.length}</div>
        <div><div class="kicker">Evidence level</div>${badge(history.evidenceLevel==='ESTABLISHED'?'ok':history.evidenceLevel==='LIMITED'?'watch':'none', history.evidenceLevel.replace(/_/g,' '))}</div>
      </div>
    </div>

    <div class="panel">
      <h3 style="margin-top:0;">Verified joint-deployment history</h3>
      <p class="hint">A deployment counts only when at least two people who have ever held a membership record for this crew were explicitly tagged to the same Workforce Request with genuinely overlapping assignment periods — never inferred from a shared date or site alone, and never lost just because a member has since left. ${history.jointDeploymentCount===0?'No verified joint deployment yet — tag at least two members\' overlapping Assignments against the same Request to begin building verified history.':''}</p>
      ${history.jointDeploymentCount>0 ? `
      <div style="display:flex;flex-wrap:wrap;gap:18px;margin-top:10px;">
        <div><div class="kicker">Joint deployments</div>${history.jointDeploymentCount}</div>
        <div><div class="kicker">Attendance outcomes recorded</div>${history.outcomesRecordedNumerator} of ${history.outcomesRecordedDenominator}</div>
        <div><div class="kicker">Attended assignments</div>${history.attendedCount}</div>
        <div><div class="kicker">No-shows</div>${history.noShowCount}</div>
        <div><div class="kicker">Punctuality among recorded attendances</div>${history.punctualityDenominator===0?'<span class="hint">Not yet recorded</span>':history.punctualityNumerator+' of '+history.punctualityDenominator}</div>
        <div><div class="kicker">Replacements required</div>${history.replacementsRequired}</div>
        <div><div class="kicker">Repeat requests / rehires</div>${history.rehires}</div>
      </div>
      <p class="hint" style="margin-top:10px;"><strong>Proven project types:</strong> ${history.provenProjectTypes.length?history.provenProjectTypes.map(esc).join(', '):'None recorded yet'}</p>
      ` : ''}
    </div>

    <div class="panel">
      <h3 style="margin-top:0;">Members — current availability and compliance</h3>
      <p class="hint">Compliance Eligibility shown here is the same hard-gate check used everywhere else — never influenced by Performance Evidence.</p>
      ${members.length===0 ? '<p class="hint">No members yet.</p>' : members.map(m=>{
        const g = evaluateGeneralReadiness(m);
        return `<div class="row">
          <div class="row-main"><div class="name">${esc(m.identity.fullName)}</div><div class="sub">${esc(m.tradeProfile.primaryTrade)}</div></div>
          <div class="row-badges">${badge(g.status==='GENERAL_READY'?'ok':g.status==='BLOCKED'?'danger':g.status==='EXPIRING_SOON'?'watch':'none', g.status)} ${badge(m.commercial.availability==='Available'?'ok':m.commercial.availability==='Unavailable'?'danger':'watch', m.commercial.availability||'Not set')}</div>
          <button class="btn small" data-find-substitute="${m.id}">Find substitute</button>
        </div>`;
      }).join('')}
      <p class="hint" style="margin-top:10px;"><strong>Current availability overlap:</strong> ${allAvailable?'All members currently available':anyUnavailable?'At least one member is currently unavailable':'Mixed / not fully confirmed'}</p>
    </div>

    ${expandedSubstituteFor ? (function(){
      const departing = workers.find(w=>w.id===expandedSubstituteFor);
      const ranked = rankCrewSubstitutes(c, expandedSubstituteFor);
      return `<div class="panel">
        <h3 style="margin-top:0;">Substitute recommendations for ${departing?esc(departing.identity.fullName):'this member'}</h3>
        <p class="hint">Evidence-based recommendations only — not guarantees. A recommendation here never creates an Assignment and never bypasses Match, approval, Offer, or the final-gate lifecycle — the normal process still applies in full before anyone is deployed.</p>
        ${ranked.length===0 ? '<p class="hint">No eligible candidates found.</p>' : ranked.map(r=>`<div class="row">
          <div class="row-main"><div class="name">${esc(r.workerName)} ${r.notCurrentlyDeployable?badge('warn','Not currently deployable'):''}</div><div class="sub">${r.reasons.map(esc).join(' · ')}</div></div>
          <div class="row-score">${r.score}<span class="u">score</span></div>
        </div>`).join('')}
      </div>`;
    })() : ''}

    <div class="panel">
      <h3 style="margin-top:0;">H&amp;S removals / incidents</h3>
      ${incidents.length===0 ? '<p class="hint">None recorded.</p>' : incidents.map(i=>`<div class="row">
        <div class="row-main"><div class="name">${esc(i.note||'Incident')}</div><div class="sub">${formatAuditTimestamp(i.eventDate||i.createdAt)} — reported by ${esc(i.verifierName||'—')}</div></div>
        <div class="row-badges">${badge(i.status==='disputed'?'watch':'danger', i.status)}</div>
      </div>`).join('')}
      <div class="field-row" style="margin-top:10px;">
        <div class="field"><label>Incident note</label><input type="text" id="hs_incident_note"></div>
        <div class="field"><label>Reported by</label><input type="text" id="hs_incident_verifier"></div>
      </div>
      <button class="btn" id="addHsIncidentBtn" data-crew="${c.id}">Record incident</button>
    </div>

    <div class="panel">
      <h3 style="margin-top:0;">Assignments tagged to this crew</h3>
      ${(function(){
        const tagged = assignmentEntities.filter(a=>!a.legacyRecord && a.crewId===c.id);

   a real deployment requirement object, not just RTW/CSCS.
   ========================================================= */
function renderDeploy(){
  const certChecks = CERT_OPTIONS.map(c=>`<label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;margin-bottom:6px;"><input type="checkbox" class="deployCert" value="${c}"> ${c}</label>`).join('');
  const sectorOpts = ['Any'].concat(SECTOR_OPTIONS).map(s=>`<option>${s}</option>`).join('');
  return `
    <h1>Deploy search</h1>
    <p class="lead">Every hard gate runs through the same readiness engine as the Dashboard and Compliance Centre.</p>
    <div class="panel">
      <div class="field-row">
        <div class="field"><label>Trade needed</label><input type="text" id="d_trade" placeholder="e.g. Painter"></div>
        <div class="field"><label>Quantity needed</label><input type="text" id="d_qty" placeholder="e.g. 6"></div>
      </div>
      <div class="field"><label>Sector / environment</label><select id="d_sector">${sectorOpts}</select></div>
      <div class="field"><label>Required certifications</label>${certChecks}</div>
      <button class="btn primary" id="runDeployBtn">Find crew</button>
    </div>
    <div id="deployResults">${deployResult ? renderDeployResults() : ''}</div>`;
}
function renderDeployResults(){
  const {trade, qty, sector, results} = deployResult;
  const eligible = results.filter(r=>r.readiness.eligible);
  const avgScore = eligible.length ? Math.round(eligible.reduce((s,r)=>s+(r.readiness.score||0),0)/eligible.length) : null;
  return `
    <div class="panel">
      <div class="search-summary">
        <span class="big">${eligible.length}</span>
        <span class="small">eligible match${eligible.length===1?'':'es'}${qty?' of '+qty+' needed':''}${trade?' — '+esc(trade):''}</span>
      </div>
      ${avgScore!==null ? `<p class="hint" style="margin-bottom:14px;">Average Performance Evidence across eligible matches: ${avgScore}%</p>` : ''}
      ${qty && eligible.length < Number(qty) ? `<div class="badge warn" style="margin-bottom:14px;">Short by ${Number(qty)-eligible.length} — check the reserve or widen the search</div>` : ''}
      ${results.length===0
        ? `<div class="empty"><h3>No matches</h3><p>Nobody in the register matches this trade.</p></div>`
        : results.map(({worker:w, readiness:r})=>{
            const crew = crews.find(c=>c.memberIds.includes(w.id));
            const sectorMatch = sector && sector!=='Any' && (w.commercial.sectorExperience||[]).includes(sector);
            const tone = r.eligible ? 'ok' : 'none';
            return `<div class="row">
              <div class="row-main">
                <div class="name">${esc(w.identity.fullName)}</div>
                <div class="sub">${esc(w.tradeProfile.primaryTrade)}${w.commercial.postcode?' · '+esc(w.commercial.postcode):''}${!r.eligible?' · '+esc(r.mainBlocker):''}</div>
              </div>
              <div class="row-badges">
                ${badge(tone, r.eligible?'Eligible':'Not eligible')}
                ${sectorMatch ? badge('gold', sector+' experience') : ''}
                ${crew ? badge('none', 'Part of '+esc(crew.name)) : ''}
              </div>
              <div class="row-score">${r.score===null?'—':r.score+'%'}<span class="u">performance evidence</span></div>
            </div>`;
          }).join('')}
    </div>`;
}

        </div>

        <div class="row-main"><div class="name">${esc(d.phaseName||'(unnamed phase)')}</div><div class="sub">${d.tradesNeeded.map(t=>esc(t.trade)+' x'+t.quantity).join(', ')}</div></div>

        <div class="field"><label>Phase name</label><input type="text" id="phase_name"></div>

    <div class="panel">
      <h3 style="margin-top:0;">Weekly demand</h3>
      <p class="hint">Calculation basis: labour-days = quantity × calendar days of that phase falling within each calendar week (Monday start). No working-day, weekday-only, or public-holiday adjustment is applied — every day counts the same. A phase spanning a week boundary contributes only its actual days in each week, never a full week.</p>
      ${weeklyDemand.length===0 ? '<p class="hint">Add a phase with start and end dates to see weekly demand.</p>' : weeklyDemand.map(w=>`<div class="row">

      </div>`).join('')}
    </div>

    <div class="panel">
      <h3 style="margin-top:0;">Forecast gaps and risk</h3>
      <p class="hint">"Verified available" counts only workers who are both compliant (not BLOCKED, not NOT_VERIFIED) and explicitly available (Available or Within 24h) — trade match alone is never enough. "Provisional candidates" counts only distinct workers at provisionally_accepted or activated status; draft and invited never contribute.</p>
      ${gaps.length===0 ? '<p class="hint">Add a phase to see forecast gaps.</p>' : gaps.map(g=>`<div class="row">

    <div class="panel">
      <h3 style="margin-top:0;">Crew matches</h3>
      <p class="hint">A crew is only shown as "Proven" with actual verified joint-deployment history behind it — trade match alone is shown separately as a possible match, never as proven.</p>

          <p class="hint">Proven: ${proven.length===0?'None.':proven.map(m=>esc(m.crewName)+' ('+m.jointDeploymentCount+' verified joint deployment'+(m.jointDeploymentCount===1?'':'s')+')').join(', ')}</p>

    <div class="panel">

        <li><strong>Availability basis:</strong> Counted as available only when a worker's current availability is explicitly "Available" or "Within 24h" — "To confirm" and "Unavailable" are never counted, and availability is shown separately from compliance so the actual blocking reason is always visible.</li>
        <li><strong>Location limitation:</strong> No travel-time, distance, or mobilisation-radius evidence exists in this data. Every match is labelled "Location: Not evaluated" — never described as local — until real location data exists.</li>
        <li><strong>Crew-history evidence:</strong> A crew match is "Proven" only with at least one verified joint deployment (two or more members with overlapping, request-linked Assignments). Trade-only matches are shown separately and never called proven.</li>
        <li><strong>Provisional-status limitation:</strong> Draft and invited candidates represent interest only, not commitment, and never reduce a reported forecast gap. Only provisionally_accepted and activated candidates contribute, counted once per distinct worker even if added to multiple holds.</li>
      </ul>
    </div>

    <div class="panel">
      <h3 style="margin-top:0;">Provisional capacity holds</h3>

              <div class="row-badges">${badge(c.status==='activated'?'watch':'none', capacityHoldCandidateStatusLabel(c.status))}</div>
              <select data-candidate-status-select="${c.id}">${CAPACITY_HOLD_CANDIDATE_STATUSES.map(s=>`<option value="${s}" ${c.status===s?'selected':''}>${capacityHoldCandidateStatusLabel(s)}</option>`).join('')}</select>
              <button class="btn small" data-update-candidate-status="${c.id}">Update</button>

          <div class="field-row">

          </div>
          <button class="btn small" data-add-candidate="${h.id}">Add as potential capacity</button>
        </div>`;

        <div class="field"><label>Quantity needed</label><input type="number" id="hold_quantity" min="1" value="1"></div>
        <div class="field"><label>Phase</label><select id="hold_phase"><option value="">(no specific phase)</option>${p.phases.map(ph=>`<option value="${ph.id}">${esc(ph.phaseName)}</option>`).join('')}</select></div>
      </div>
      <button class="btn" id="addCapacityHoldBtn" data-plan="${p.id}">Add capacity hold</button>
    </div>`;
}

}

/* =========================================================
   MATCHING WORKSPACE — shared eligibility styling, used by
   both the Match row and the readiness-gate snapshot card, so
   the same status always looks the same everywhere.
   ========================================================= */
function eligibilityBadgeTone(e){
  if(e==='BLOCKED') return 'danger';
  if(e==='HOLD') return 'warn';
  if(e==='HUMAN_REVIEW') return 'review';
  if(e==='EXPIRING_SOON') return 'watch';
  return 'ok';
}
function eligibilityLabel(e){
  if(e==='BLOCKED') return 'Blocked — mandatory failure';
  if(e==='HOLD') return 'Hold — operational condition';
  if(e==='HUMAN_REVIEW') return 'Human review required';
  if(e==='EXPIRING_SOON') return 'Ready — expiring soon';
  if(e==='ASSIGNMENT_READY') return 'Ready';
  return e || '—';
}
function renderMatchRow(m){
  const w = workers.find(x=>x.id===m.workerId);
  const expanded = expandedMatchId===m.id;
  const existingAssignment = assignmentEntities.find(a=>a.matchId===m.id);
  const eligibility = validateReplacementEligibility(m);
  const isIneligible = !eligibility.ok;
  return `<div class="row" style="flex-direction:column;align-items:stretch;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <div class="row-main"><div class="name">${esc(w?w.identity.fullName:'(removed worker)')}</div><div class="sub">${esc(w?w.tradeProfile.primaryTrade:'')}</div></div>
      <div class="row-badges">${isIneligible ? badge('danger','Ineligible for this replacement') : badge(eligibilityBadgeTone(m.eligibility), eligibilityLabel(m.eligibility))}</div>
      <button class="btn small" data-toggle-match="${m.id}">${expanded?'Hide':'Details'}</button>
    </div>
    ${expanded ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">
      ${m.matchFactors.map(f=>{
        const tone = f.result==='PASS'?'ok':f.result==='FAIL'?'danger':f.result==='REVIEW_REQUIRED'?'review':'none';
        return `<div class="hint" style="margin-bottom:4px;">${badge(tone, f.result)} <strong>${esc(f.factorType)}</strong> — ${esc(f.reason)}</div>`;
      }).join('')}
      ${isIneligible ? `<p class="hint" style="color:var(--danger);margin-top:10px;">Structurally excluded from this replacement — ${w && m.workerId ? 'this worker either holds the Assignment being replaced, or already holds a live Assignment against this Request' : 'ineligible'}. No approval or assignment-creation control is available here, regardless of the Match result above.</p>` :
      m.eligibility==='BLOCKED' ? `<p class="hint" style="color:var(--danger);margin-top:10px;">Mandatory requirement failed. No approval or override control is available for a BLOCKED match.</p>` :
        m.eligibility==='HOLD' ? `<p class="hint" style="margin-top:10px;">Operational condition unresolved (e.g. availability not confirmed). This cannot be approved past — it requires the underlying fact to change and matching to be rerun.</p>` :
        !m.decision ? `<div style="margin-top:10px;">
          <div class="field"><label>Reviewer</label><input type="text" id="matchReviewer_${m.id}" placeholder="Your name"></div>
          <div class="field"><label>Reason / notes</label><textarea id="matchReason_${m.id}"></textarea></div>
          <button class="btn primary small" data-approve-match="${m.id}">Approve</button>
          <button class="btn small" data-reject-match="${m.id}">Reject</button>
        </div>` :
        `<p class="hint">Reviewed by ${esc(m.reviewedBy)} on ${fmtDate(m.reviewedAt)} — decision: <strong>${esc(m.decision)}</strong></p>
         ${m.decision==='APPROVE' && !existingAssignment ? `<p class="hint">Match approved — Assignment not yet created.</p><button class="btn primary" data-create-assignment="${m.id}">Create assignment</button>` : ''}
         ${existingAssignment ? `<p class="hint">Assignment ${esc(existingAssignment.publicReference||'')} created — <a data-open-assignment="${existingAssignment.id}" style="color:var(--watch);cursor:pointer;">view (${esc(existingAssignment.status)})</a>. Match approval alone does not mean confirmed or deployed.</p>` : ''}`
      }
    </div>` : ''}
  </div>`;
}

  const match = matches.find(m=>m.id===a.matchId);
  const offer = assignmentOffers.find(o=>o.assignmentId===a.id && (o.status==='PENDING'||o.status==='ACCEPTED'));

  const STEPS = ['PROPOSED','OFFERED','ACCEPTED','CONFIRMED','ACTIVE','COMPLETED','REVIEWED'];
  const stepIdx = STEPS.indexOf(a.status);
  const isException = ['CANCELLED','NO_SHOW','REPLACED'].includes(a.status);

  return `

    ${w ? (function(){

        ${dc.freshGateRequired ? `<p class="hint" style="color:var(--warn);margin-top:8px;"><strong>Fresh final-gate evaluation required</strong> — this live view is informational only; progressing this Assignment still requires running the actual ${a.status==='ACCEPTED'?'pre-confirmation':'pre-deployment'} gate below, which performs its own evaluation and records its own evidence.</p>` : ''}
        ${dc.historicalSnapshot ? `<div class="snapshot-card" style="margin-top:12px;">

      </div>`;
    })() : ''}

    ${isException ? `<div class="badge danger" style="margin-bottom:14px;">${esc(a.status)}</div>` :
      `<div class="stepper">${STEPS.map((s,i)=>`<span class="step ${i===stepIdx?'current':i<stepIdx?'done':''}">${s}</span>${i<STEPS.length-1?'<span class="sep">→</span>':''}`).join('')}</div>`}

    ${renderOfferPanel(a, offer)}
    ${(a.status==='ACCEPTED' || a.status==='CONFIRMED') ? renderPreStartAndGatePanel(a) : ''}
    ${a.role==='RESERVE' ? renderReservePromotionPanel(a) : ''}

    ${(a.status==='ACTIVE' || a.status==='COMPLETED') ? (function(){
      const attendanceRecords = evidenceRecords.filter(e=>e.sourceType==='ASSIGNMENT' && e.sourceRecordId===a.id && e.category==='ATTENDANCE');
      const summary = computeAttendanceSummary(a.id);
      return `<div class="panel">
        <h3 style="margin-top:0;">Attendance evidence</h3>
        ${attendanceRecords.length===0 ? '<p class="hint">None recorded yet.</p>' : attendanceRecords.map(r=>`<div class="row" style="flex-direction:column;align-items:stretch;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
            <div class="row-main"><div class="name">${esc(r.outcomeValue||'—')}${r.status==='disputed'?' '+badge('watch','Disputed'):r.status==='pending'?' '+badge('warn','Pending / manual review'):' '+badge('ok','Verified')}</div>
            <div class="sub">${formatAuditTimestamp(r.eventDate||r.createdAt)} — verified by ${esc(r.verifierName||'(none given)')}${r.verifierRole?' ('+esc(r.verifierRole)+')':''}${r.verificationMethod?' via '+esc(r.verificationMethod):''}${r.fileReference?' — evidence: '+esc(r.fileReference):''}${r.note?' — '+esc(r.note):''}${r.provenanceFlag?' — '+esc(selfAttestationLabel(r.provenanceFlag)):''}</div></div>
            ${r.status!=='disputed' ? `<button class="btn small" data-dispute-attendance="${r.id}">Dispute</button>` : ''}

          ${r.correctionHistory && r.correctionHistory.length>0 ? `<div class="hint" style="margin-top:6px;"><strong>Correction history:</strong> ${r.correctionHistory.map(c=>`${esc(c.previousStatus)}→${esc(c.newStatus)} by ${esc(c.actor)} (${formatAuditTimestamp(c.timestamp)})${c.reason?': '+esc(c.reason):''}`).join('; ')}</div>` : ''}
        </div>`).join('')}

        <div class="subsection" style="margin-top:12px;">
          <h2>Attendance summary</h2>
          <p class="hint">Percentage is calculated ONLY from independently verified records (a genuine, non-self verifier plus a named verification method) whose outcome is attended, late, or no_show. Excused, not_recorded, disputed, pending, and any provenance-flagged record never affect this percentage, whatever their outcome value — they are excluded from both numerator and denominator, not merely down-weighted. "Late" counts toward the numerator alongside "attended" — documented here explicitly, not left implicit. The raw recorded-event count below covers every record of any status, shown separately so it is never mistaken for the reconciled figure.</p>
          <div style="display:flex;flex-wrap:wrap;gap:18px;">
            <div><div class="kicker">Numerator / Denominator (verified, eligible)</div>${summary.numerator} / ${summary.denominator}</div>
            <div><div class="kicker">Percentage</div>${summary.percentage===null?'—':summary.percentage+'%'}</div>

        <div class="field-row three" style="margin-top:12px;">
          <div class="field"><label>Outcome</label><select id="attendance_outcome"><option value="attended">Attended</option><option value="late">Late</option><option value="no_show">No-show</option><option value="excused">Excused</option><option value="not_recorded">Not recorded</option></select></div>

        <div class="field-row three">

          <div class="field"><label>Verifier role</label><input type="text" id="attendance_verifier_role"></div>
          <div class="field"><label>Verification method / evidence source <span class="hint">(required for independently verified status)</span></label><input type="text" id="attendance_method"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Supporting evidence reference</label><input type="text" id="attendance_file_reference"></div>
          <div class="field"><label>Note</label><input type="text" id="attendance_note"></div>
        </div>
        <button class="btn" id="recordAttendanceBtn" data-assignment="${a.id}">Record attendance evidence</button>
      </div>`;
    })() : ''}

    ${(function(){
      const incident = replacementIncidents.find(ri=>ri.assignmentId===a.id);
      if(!incident){
        if(isException || !['OFFERED','ACCEPTED','CONFIRMED','ACTIVE'].includes(a.status)) return '';
        return `<div class="panel">
          <h3 style="margin-top:0;">Replacement incident</h3>
          <p class="hint">Records a documented operational incident only — never an automatic deployment or a bypass of Match, approval, Offer, or final-gate controls. Every step from here is a separate, explicit action.</p>
          <div class="field"><label>Notes</label><input type="text" id="incident_notes"></div>
          <div class="field"><label>Recorded by</label><input type="text" id="incident_recorded_by"></div>
          <div class="toolbar">
            ${['OFFERED','ACCEPTED','CONFIRMED'].includes(a.status) ? `<button class="btn small" data-record-incident="${a.id}" data-incident-type="CANCELLATION">Record cancellation</button>` : ''}
            ${a.status==='CONFIRMED' ? `<button class="btn small" data-record-incident="${a.id}" data-incident-type="NO_SHOW">Record no-show</button>` : ''}
            <button class="btn small" data-record-incident="${a.id}" data-incident-type="REPLACEMENT_REQUIRED">Flag replacement required</button>
          </div>
        </div>`;
      }
      const elapsed = computeReplacementElapsedTime(incident);
      const replacement = incident.replacementAssignmentId ? assignmentEntities.find(x=>x.id===incident.replacementAssignmentId) : null;
      const generationMatches = incident.replacementMatchGenerationId ? matches.filter(m=>m.generationId===incident.replacementMatchGenerationId) : [];
      const originalStillActive = a.status === 'ACTIVE';
      const requestForOverride = workforceRequests.find(r=>r.id===incident.requestId);
      const auditTrail = buildReplacementIncidentAuditTrail(incident);
      const overrideAvailable = replacementQuantityOverrideAvailable(incident, replacement);
      const controllingDecision = controllingContractorDecision(incident);
      return `<div class="panel">
        <h3 style="margin-top:0;">Replacement incident</h3>
        <p class="hint">${esc(incident.incidentType)} recorded ${formatAuditTimestamp(incident.recordedAt)}${incident.recordedBy?' by '+esc(incident.recordedBy):''}${incident.notes?' — '+esc(incident.notes):''}</p>
        <p class="hint"><strong>Elapsed time (measured, not a guaranteed SLA):</strong> ${formatElapsedDuration(elapsed.elapsedMs)}${elapsed.resolved?' (replacement confirmed)':' and counting'}</p>
        <p class="hint">No step below is automatic — matching, approval, Offer, and every final-gate remain exactly as they are everywhere else in this tool. Nothing here bypasses Match, approval, Offer, or final-gate controls.</p>
        ${!incident.replacementMatchGenerationId ? `<button class="btn primary" data-rerun-replacement-matching="${incident.id}">Re-run matching for a replacement</button>` : ''}
        ${generationMatches.length>0 && !replacement ? `<div style="margin-top:10px;">${generationMatches.map(m=>renderMatchRow(m)).join('')}</div>` : ''}
        ${replacement ? `<p class="hint" style="margin-top:10px;">Replacement Assignment ${esc(replacement.publicReference||'')} — <a data-open-assignment="${replacement.id}" style="color:var(--watch);cursor:pointer;">view (${esc(replacement.status)})</a></p>` : ''}
        ${replacement && replacement.status==='CONFIRMED' && a.status==='ACTIVE' ? `<button class="btn" data-mark-original-replaced="${incident.id}">Mark this assignment as Replaced</button>` : ''}

        <div class="subsection" style="margin-top:14px;">
          <h2>Active-replacement quantity override</h2>
          <p class="hint">Available once the replacement Assignment exists and only before it is confirmed — the deadlock is at confirmation, so the override serves no purpose before the Assignment exists or after it is already past that point. Restored automatically, fully audited, once the original is marked Replaced.</p>
          ${incident.quantityOverrideOperationId ? `<p class="hint">Applied — temporary limit ${incident.quantityOverridePreviousLimit+1} (previous limit ${incident.quantityOverridePreviousLimit}).${incident.quantityOverrideRestoredOperationId ? ' Restored.' : ' Not yet restored — will restore automatically when the original is marked Replaced.'}</p>` :
          overrideAvailable ? `<div class="field-row">
            <div class="field"><label>Approved by</label><input type="text" id="qty_override_approver_${incident.id}"></div>
            <div class="field"><label>Reason</label><input type="text" id="qty_override_reason_${incident.id}" value="Temporary +1 to allow in-flight replacement handoff for incident ${incident.id}"></div>
          </div>
          <button class="btn small" data-apply-replacement-quantity-override="${incident.id}">Apply temporary +1 quantity override</button>` :
          `<p class="hint">Not currently available${!replacement?' — the replacement Assignment does not exist yet':' — the replacement has already passed confirmation'}.</p>`}
        </div>

        <div class="subsection" style="margin-top:14px;">
          <h2>Contractor approval</h2>
          <p class="hint">Explicit and separate from the internal Match review above — a Match approval alone is never presented as contractor approval. Decisions are append-only: a new decision never erases a prior one, and the controlling decision is always the most recent entry.</p>
          ${(incident.contractorApprovalHistory||[]).map(d=>`<p class="hint">${esc(d.decision)} by ${esc(d.approverName)} — ${formatAuditTimestamp(d.timestamp)}${d.notes?' — '+esc(d.notes):''}</p>`).join('')}
          ${controllingDecision ? `<p class="hint"><strong>Controlling decision: ${esc(controllingDecision.decision)}</strong> (most recent, above)${controllingDecision.decision==='REJECTED'?' — this replacement cannot proceed to Assignment creation or Offer until superseded by a later APPROVED decision.':''}</p>` : '<p class="hint">No contractor decision recorded yet — required before Assignment creation or Offer.</p>'}
          <div class="field-row">
            <div class="field"><label>Approver name</label><input type="text" id="contractor_approver_${incident.id}"></div>
            <div class="field"><label>Notes</label><input type="text" id="contractor_approval_notes_${incident.id}"></div>
          </div>
          <button class="btn small primary" data-contractor-approval="${incident.id}" data-decision="APPROVED">Record contractor approval</button>
          <button class="btn small" data-contractor-approval="${incident.id}" data-decision="REJECTED">Record contractor rejection</button>
        </div>

        <div class="subsection" style="margin-top:14px;">
          <h2>Site-pack / RAMS acknowledgement</h2>
          <p class="hint">Required before this replacement can be activated, where applicable.</p>
          ${incident.sitePackAcknowledgement ? `<p class="hint">Acknowledged by ${esc(incident.sitePackAcknowledgement.actor)} — ${formatAuditTimestamp(incident.sitePackAcknowledgement.timestamp)}</p>` : `<div class="field"><label>Actor</label><input type="text" id="sitepack_actor_${incident.id}"></div>
          <button class="btn small" data-sitepack-ack="${incident.id}">Record acknowledgement</button>`}
        </div>

        <div class="subsection" style="margin-top:14px;">
          <h2>Incident audit trail</h2>
          <ul class="timeline">${auditTrail.map(s=>`<li><span class="t-who">${s.done?'✓':'—'}</span> ${esc(s.stage)}<br><span class="t-when">${esc(s.detail)}</span></li>`).join('')}</ul>
        </div>
      </div>`;
    })()}

    <div class="panel">
      <h3 style="margin-top:0;">Timeline</h3>
      <ul class="timeline">${buildAssignmentTimeline(a, match).map(e=>`<li><span class="t-who">${esc(e.who||'system')}</span> — ${esc(e.what)}<br><span class="t-when">${fmtDate(e.when)}${e.reason?' — '+esc(e.reason):''}</span></li>`).join('')}</ul>
    </div>

    ${['PROPOSED','OFFERED','ACCEPTED','CONFIRMED'].includes(a.status) ? `<div class="toolbar"><button class="btn danger small" data-cancel-assignment="${a.id}">Cancel assignment</button></div>` : ''}`;
}
function renderOfferPanel(a, offer){
  if(a.status==='PROPOSED'){
    return `<div class="panel"><h3 style="margin-top:0;">Offer</h3>
      <p class="hint">Not yet sent. An offer relays: trade, contractor's public name, site location, dates, hours, rate, and requirements.</p>
      <button class="btn primary" data-send-offer="${a.id}">Send offer</button>
    </div>`;
  }
  if(!offer) return '';
  if(offer.status==='PENDING'){
    return `<div class="panel"><h3 style="margin-top:0;">Offer — Pending</h3>
      <p class="hint">Awaiting the worker's response.</p>
      <button class="btn primary small" data-offer-response="${offer.id}" data-response="ACCEPTED">Record acceptance</button>
      <button class="btn small" data-offer-response="${offer.id}" data-response="DECLINED">Record decline</button>
    </div>`;
  }
  if(offer.status==='ACCEPTED'){
    return `<div class="panel"><h3 style="margin-top:0;">Offer accepted — awaiting PRJGENUI confirmation</h3>
      <p class="hint">The worker agreed to the offer. This is not Confirmed, Assignment Ready, or Deployed.</p>
    </div>`;
  }
  return `<div class="panel"><h3 style="margin-top:0;">Offer ${esc(offer.status)}</h3><p class="hint">No adverse Performance Evidence was recorded for this outcome.</p></div>`;
}
function renderPreStartAndGatePanel(a){
  const isPreConfirm = a.status === 'ACCEPTED';
  const gateType = isPreConfirm ? 'PRE_CONFIRMATION' : 'PRE_DEPLOYMENT';
  const snapsOfType = readinessSnapshots.filter(s=>s.assignmentId===a.id && s.snapshotType===gateType);
  const latestSnap = snapsOfType.length ? snapsOfType.reduce((best,s)=>new Date(s.createdAt)>new Date(best.createdAt)?s:best, snapsOfType[0]) : null;
  const pendingReview = latestSnap && latestSnap.assignmentReadinessStatus==='HUMAN_REVIEW' && !(a.finalGateReviews||[]).some(r=>r.snapshotId===latestSnap.id);

  return `<div class="panel">
    <h3 style="margin-top:0;">${isPreConfirm?'Pre-start confirmation':'Pre-deployment check'}</h3>
    ${isPreConfirm ? `<p>Worker reconfirmation: ${badge(a.workerReconfirmationStatus==='NO_SHOW'?'danger':'none', a.workerReconfirmationStatus||'AWAITING_RESPONSE')}</p>` : ''}
    ${latestSnap ? renderSnapshotCard(latestSnap) : '<p class="hint">No readiness check run yet for this gate.</p>'}
    ${pendingReview ? renderReviewControls(a, latestSnap) : ''}
    <button class="btn primary" data-run-gate="${a.id}" data-gate-mode="${isPreConfirm?'confirm':'activate'}">${isPreConfirm?'Run readiness check and confirm':'Run readiness check and activate'}</button>
  </div>`;
}
function renderSnapshotCard(s){
  return `<div class="snapshot-card">
    <div class="locked">🔒 Immutable evidence — ${esc(s.snapshotType)} — evaluated ${fmtDate(s.evaluatedAt)}${s.createdBy?' by '+esc(s.createdBy):''}</div>
    <p style="margin:8px 0;">${badge(eligibilityBadgeTone(s.assignmentReadinessStatus), eligibilityLabel(s.assignmentReadinessStatus))} <span class="hint">General Readiness: ${esc(s.generalReadinessStatus)}</span></p>
    ${s.requirementsChangedSinceMatch ? `<div class="conflict-note">⚠ Requirements changed since matching — see below for what changed.</div>` : ''}
    ${(s.failedChecks||[]).length ? `<p class="hint">Failed checks: ${s.failedChecks.map(esc).join('; ')}</p>` : ''}
    ${(s.warnings||[]).length ? `<p class="hint">Warnings: ${s.warnings.map(esc).join('; ')}</p>` : ''}
    ${(s.reviewItems||[]).length ? `<p class="hint">Review items: ${s.reviewItems.map(r=>esc((r.type||'')+': '+r.message)).join('; ')}</p>` : ''}
    <p class="hint">Performance Evidence (supporting information only, not a compliance gate): ${s.performanceEvidenceScore===null||s.performanceEvidenceScore===undefined?'—':s.performanceEvidenceScore+'% · '+esc(s.performanceEvidenceBand||'')}</p>
    <p class="hint">Rules version ${esc(s.rulesVersion)}</p>
  </div>`;
}
function renderReviewControls(a, snap){
  return `<div style="margin:10px 0;">
    <p><strong>Human review required.</strong> ${(snap.reviewItems||[]).length ? 'Reasons: '+snap.reviewItems.map(r=>esc(r.message)).join('; ') : 'See failed/review items above.'}</p>
    <div class="field"><label>Reviewer</label><input type="text" id="gateReviewer_${snap.id}"></div>
    <div class="field"><label>Reason / notes</label><textarea id="gateReason_${snap.id}"></textarea></div>
    <button class="btn primary small" data-resolve-gate="${a.id}" data-snapshot="${snap.id}" data-decision="APPROVE">Approve</button>
    <button class="btn small" data-resolve-gate="${a.id}" data-snapshot="${snap.id}" data-decision="REJECT">Reject</button>
  </div>`;
}
function renderReservePromotionPanel(a){
  return `<div class="panel"><h3 style="margin-top:0;">Reserve</h3>
    <p class="hint">Reserve status carries no payment implication on its own. Promotion runs a fresh readiness check before anything changes.</p>
    <button class="btn primary" data-promote-reserve="${a.id}">Promote to primary</button>
  </div>`;
}
function buildAssignmentTimeline(a, match){
  const events = [];
  (a.statusHistory||[]).forEach(h=>events.push({when:h.timestamp, who:h.actor, what:`${h.previousStatus||'—'} → ${h.newStatus}`, reason:h.reason}));
  if(match && match.reviewedAt) events.push({when:match.reviewedAt, who:match.reviewedBy, what:`Match ${match.decision}`, reason:match.notes});
  (a.finalGateReviews||[]).forEach(r=>events.push({when:r.resolvedAt, who:r.resolvedBy, what:`Final-gate review: ${r.decision} (${r.gate})`, reason:r.reason}));
  assignmentOffers.filter(o=>o.assignmentId===a.id).forEach(o=>{
    events.push({when:o.offeredAt, who:'system', what:'Offer sent', reason:''});
    if(o.workerResponseAt) events.push({when:o.workerResponseAt, who:'worker', what:`Offer ${o.status}`, reason:o.declineReason||''});
  });
  readinessSnapshots.filter(s=>s.assignmentId===a.id).forEach(s=>events.push({when:s.createdAt, who:s.createdBy||'system', what:`${s.snapshotType} readiness check: ${s.assignmentReadinessStatus}`, reason:''}));
  return events.filter(e=>!!e.when).sort((x,y)=>new Date(x.when)-new Date(y.when));
}

/* =========================================================
   EVENT HANDLERS
   ========================================================= */
function wireRemoveButtons(){
  document.querySelectorAll('.remove-row').forEach(btn=>{ btn.onclick = ()=> btn.closest('.sub-row').remove(); });
}

function wireViewEvents(){
  if(view==='dashboard'){
    const b = document.getElementById('emptyAddBtn');
    if(b) b.onclick = ()=>{ editingId=null; view='workerForm'; render(); };
    const gc = document.getElementById('goComplianceBtn');
    if(gc) gc.onclick = ()=>{ view='compliance'; render(); };
  }

  if(view==='workers'){
    document.getElementById('searchInput').oninput = (e)=>{
      searchQuery = e.target.value; render();
      const el = document.getElementById('searchInput'); el.focus(); el.setSelectionRange(el.value.length, el.value.length);
    };
    document.querySelectorAll('[data-filter]').forEach(c=> c.onclick = ()=>{ filterStatus = c.dataset.filter; render(); });
    document.getElementById('addWorkerBtn').onclick = ()=>{ editingId=null; view='workerForm'; render(); };
    document.querySelectorAll('[data-edit]').forEach(btn=> btn.onclick = ()=>{ editingId = btn.dataset.edit; view='workerForm'; render(); });
  }

  if(view==='workerForm'){
    document.getElementById('addCertBtn').onclick = ()=>{ document.getElementById('certRows').insertAdjacentHTML('beforeend', certRowHtml(null)); wireRemoveButtons(); };
    document.getElementById('addProofBtn').onclick = ()=>{ document.getElementById('proofRows').insertAdjacentHTML('beforeend', proofRowHtml(null)); wireRemoveButtons(); };
    document.getElementById('addAssignBtn').onclick = ()=>{ document.getElementById('assignRows').insertAdjacentHTML('beforeend', assignRowHtml(null)); wireRemoveButtons(); };
    wireRemoveButtons();
    document.getElementById('cancelFormBtn').onclick = ()=>{ view='workers'; render(); };
    const delBtn = document.getElementById('deleteWorkerBtn');
    if(delBtn) delBtn.onclick = async ()=>{
      if(confirm('Delete this worker? This cannot be undone.')){
        workers = workers.filter(w=>w.id!==editingId);
        await persistWorkers(); editingId=null; view='workers'; render();
        showToast('Worker deleted.');
      }
    };
    document.getElementById('workerForm').onsubmit = async (e)=>{
      e.preventDefault();
      const fullName = document.getElementById('f_fullName').value.trim();
      const trade = document.getElementById('f_trade').value.trim();
      if(!fullName || !trade){ showToast('Full name and primary trade are required.', true); return; }

      const rtwStatusVal = document.getElementById('f_rtwStatus').value;
      const rtwEvidence = document.getElementById('f_rtwEvidence').value.trim();
      if(rtwStatusVal==='verified' && !rtwEvidence){ showToast('Add evidence before marking Right to Work as verified.', true); return; }
      const cscsStatusVal = document.getElementById('f_cscsStatus').value;
      const cscsEvidence = document.getElementById('f_cscsEvidence').value.trim();
      if(cscsStatusVal==='valid' && !cscsEvidence){ showToast('Add evidence before marking CSCS as valid.', true); return; }

      const certs = Array.from(document.querySelectorAll('#certRows .cert-row')).map(row=>({
        id: row.dataset.id || uid(), name: row.querySelector('.cert-name').value, category:'core', issuer:'', certificateNumber:'',
        issueDate:'', expiryDate: row.querySelector('.cert-expiry').value, status: row.querySelector('.cert-status').value,
        requirementType: row.querySelector('.cert-requirement').value,
        verificationMethod:'', verifier:'', verificationDate:'', evidenceReference: row.querySelector('.cert-evidence').value.trim(), notes:''
      }));
      const proofOfWork = Array.from(document.querySelectorAll('#proofRows .proof-row')).map(row=>({
        id: row.dataset.id || uid(), project: row.querySelector('.proof-project').value.trim(), client:'', site:'', trade:'',
        description: row.querySelector('.proof-desc').value.trim(), dateFrom: row.querySelector('.proof-date').value, dateTo:'',
        supervisor: row.querySelector('.proof-verifiedby').value.trim(), verified: !!row.querySelector('.proof-verifiedby').value.trim(),
        verifiedBy: row.querySelector('.proof-verifiedby').value.trim(), evidenceReferences:[], imagesReferences:[], notes:''
      })).filter(p=>p.project || p.description);
      const assignments = Array.from(document.querySelectorAll('#assignRows .assign-row')).map(row=>({
        id: row.dataset.id || uid(), deploymentId:'', client:'', project: row.querySelector('.assign-project').value.trim(), date: row.querySelector('.assign-date').value,
        attended: row.querySelector('.assign-attended').value === 'yes', late:false, noShow: row.querySelector('.assign-attended').value==='no',
        rating: row.querySelector('.assign-rating').value ? Number(row.querySelector('.assign-rating').value) : null,
        rehireDecision: row.querySelector('.assign-rehire').value,
        disputeNote: row.querySelector('.assign-dispute').value.trim(),
        clientFeedback:'', supervisorFeedback:'', issueRecorded:false, outcome:''
      })).filter(a=>a.date || a.project);
      const sectorExperience = Array.from(document.querySelectorAll('.sectorCheck:checked')).map(c=>c.value);
      const competenceRaw = document.getElementById('f_competence').value;
      const competenceScoreVal = competenceRaw==='' ? null : Math.max(0,Math.min(20,Number(competenceRaw)));
      const competenceAssessedByVal = document.getElementById('f_competenceBy').value.trim();
      const competenceEvidenceVal = document.getElementById('f_competenceEvidence').value.trim();
      const availabilityVal = document.getElementById('f_availability').value;

      const prev = editingId ? workerById(editingId) : null;

      // ---- Change detection (v3.1, narrowed in v3.2 per item 6): two levels.
      // "AnyChanged" gates whether we bother checking for audit-worthy detail.
      // "VerificationEventChanged" is narrower and is what's allowed to touch
      // lastReviewed/verificationDate — editing a card number or share-code
      // typo is not a re-verification event, even though something changed.
      const rtwAnyChanged = !prev || prev.rightToWork.status!==rtwStatusVal ||
        prev.rightToWork.expiryDate!==document.getElementById('f_rtwExpiry').value ||
        prev.rightToWork.evidenceNote!==rtwEvidence ||
        prev.rightToWork.method!==document.getElementById('f_rtwMethod').value ||
        prev.rightToWork.checkedDate!==document.getElementById('f_rtwChecked').value ||
        prev.rightToWork.verifier!==document.getElementById('f_rtwVerifier').value.trim() ||
        prev.rightToWork.reference!==document.getElementById('f_rtwReference').value.trim();
      const rtwVerificationEventChanged = !prev || prev.rightToWork.status!==rtwStatusVal ||
        prev.rightToWork.expiryDate!==document.getElementById('f_rtwExpiry').value ||
        prev.rightToWork.evidenceNote!==rtwEvidence ||
        prev.rightToWork.method!==document.getElementById('f_rtwMethod').value ||
        prev.rightToWork.checkedDate!==document.getElementById('f_rtwChecked').value ||
        prev.rightToWork.verifier!==document.getElementById('f_rtwVerifier').value.trim();
      const cscsAnyChanged = !prev || prev.cscs.status!==cscsStatusVal ||
        prev.cscs.expiryDate!==document.getElementById('f_cscsExpiry').value ||
        prev.cscs.evidenceReference!==cscsEvidence ||
        prev.cscs.registrationNumber!==document.getElementById('f_cscsReg').value.trim() ||
        prev.cscs.cardType!==document.getElementById('f_cscsType').value.trim() ||
        prev.cscs.scheme!==document.getElementById('f_cscsScheme').value.trim();
      const cscsVerificationEventChanged = !prev || prev.cscs.status!==cscsStatusVal ||
        prev.cscs.expiryDate!==document.getElementById('f_cscsExpiry').value ||
        prev.cscs.evidenceReference!==cscsEvidence;
      const competenceChanged = prev
        ? (prev.tradeProfile.competenceScore!==competenceScoreVal || prev.tradeProfile.competenceAssessedBy!==competenceAssessedByVal || prev.tradeProfile.competenceEvidence!==competenceEvidenceVal)
        : (competenceScoreVal!==null || competenceEvidenceVal!=='');
      const availabilityChanged = prev ? prev.commercial.availability!==availabilityVal : false;

      const prevCerts = prev ? (prev.trainingCertificates||[]) : [];
      const prevCertsById = new Map(prevCerts.map(c=>[c.id,c]));
      const newCertIds = new Set(certs.map(c=>c.id));
      const certsAdded = certs.filter(c=>!prevCertsById.has(c.id));
      const certsRemoved = prevCerts.filter(c=>!newCertIds.has(c.id));
      const certsNewlyVerified = certs.filter(c=>{ const old = prevCertsById.get(c.id); return old && old.status!=='verified' && c.status==='verified'; });
      const certsExpiryChanged = certs.filter(c=>{ const old = prevCertsById.get(c.id); return old && old.expiryDate!==c.expiryDate; });

      const prevProof = prev ? (prev.proofOfWork||[]) : [];
      const prevProofById = new Map(prevProof.map(p=>[p.id,p]));
      const proofAdded = proofOfWork.filter(p=>!prevProofById.has(p.id));
      const proofNewlyVerified = proofOfWork.filter(p=>{ const old = prevProofById.get(p.id); return old && !old.verified && p.verified; });

      const prevAssign = prev ? (prev.assignments||[]) : [];
      const prevAssignById = new Map(prevAssign.map(a=>[a.id,a]));
      const assignAdded = assignments.filter(a=>!prevAssignById.has(a.id));
      const assignRatingChanged = assignments.filter(a=>{ const old = prevAssignById.get(a.id); return old && old.rating!==a.rating; });
      const assignOutcomeChanged = assignments.filter(a=>{ const old = prevAssignById.get(a.id); return old && old.rehireDecision!==a.rehireDecision; });
      const assignDisputeChanged = assignments.filter(a=>{ const old = prevAssignById.get(a.id); return old && (old.disputeNote||'')!==(a.disputeNote||''); });

      // One internal UUID for this save: editing preserves the existing one exactly;
      // a genuinely new worker gets exactly one fresh uid(), used for both id and
      // identity.workerUUID — never two independent calls that could diverge.
      const internalUUID = prev ? prev.id : uid();

      const worker = {
        schemaVersion: SCHEMA_VERSION,
        id: internalUUID,
        identity: {
          fullName, preferredName: document.getElementById('f_preferredName').value.trim(),
          phone: document.getElementById('f_phone').value.trim(), email: document.getElementById('f_email').value.trim(),
          postcode: document.getElementById('f_postcode').value.trim(), nationality: document.getElementById('f_nationality').value.trim(),
          workerUUID: internalUUID, passportId: prev ? prev.identity.passportId : nextPassportId(), status:'active'
        },
        rightToWork: {
          status:rtwStatusVal, method:document.getElementById('f_rtwMethod').value, checkedDate:document.getElementById('f_rtwChecked').value,
          expiryDate:document.getElementById('f_rtwExpiry').value, verifier:document.getElementById('f_rtwVerifier').value.trim(),
          reference:document.getElementById('f_rtwReference').value.trim(), evidenceNote:rtwEvidence, evidenceFileReference: prev ? prev.rightToWork.evidenceFileReference : '',
          lastReviewed: rtwVerificationEventChanged ? todayStr() : (prev ? prev.rightToWork.lastReviewed : '')
        },
        cscs: {
          status:cscsStatusVal, registrationNumber:document.getElementById('f_cscsReg').value.trim(), cardType:document.getElementById('f_cscsType').value.trim(),
          occupation: prev ? prev.cscs.occupation : '', scheme:document.getElementById('f_cscsScheme').value.trim(), issueDate: prev ? prev.cscs.issueDate : '',
          expiryDate:document.getElementById('f_cscsExpiry').value,
          verificationMethod: prev ? prev.cscs.verificationMethod : '', verifier: prev ? prev.cscs.verifier : '',
          verificationDate: cscsVerificationEventChanged ? todayStr() : (prev ? prev.cscs.verificationDate : ''),
          evidenceReference:cscsEvidence
        },
        trainingCertificates: certs,
        tradeProfile: {
          primaryTrade: trade, secondaryTrades: prev ? prev.tradeProfile.secondaryTrades : [], yearsExperience: document.getElementById('f_yearsExp').value.trim(),
          competenceScore: competenceScoreVal,
          competenceAssessedBy: competenceAssessedByVal,
          competenceAssessmentDate: competenceChanged ? ((competenceScoreVal!==null || competenceEvidenceVal) ? todayStr() : '') : (prev ? prev.tradeProfile.competenceAssessmentDate : ''),
          competenceEvidence: competenceEvidenceVal,
          notes: prev ? prev.tradeProfile.notes : ''
        },
        proofOfWork, assignments,
        commercial: {
          postcode: document.getElementById('f_postcode').value.trim(), travelRadius: document.getElementById('f_radius').value,
          dayRate: document.getElementById('f_rate').value, availability: availabilityVal,
          availableFrom: document.getElementById('f_availableFrom').value, sectorExperience,
          preferredLocations: prev ? prev.commercial.preferredLocations : [], transport: document.getElementById('f_transport').value.trim(),
          ownTools: prev ? prev.commercial.ownTools : '', notes: document.getElementById('f_commercialNotes').value.trim()
        },
        auditLog: prev ? (prev.auditLog||[]) : []
      };

      if(prev){
        if(rtwAnyChanged){
          if(prev.rightToWork.status!==rtwStatusVal) addAudit(worker,'Right to work','status', prev.rightToWork.status, rtwStatusVal);
          if(prev.rightToWork.expiryDate!==worker.rightToWork.expiryDate) addAudit(worker,'Right to work','expiry', prev.rightToWork.expiryDate, worker.rightToWork.expiryDate);
          if(prev.rightToWork.evidenceNote!==rtwEvidence) addAudit(worker,'Right to work','evidence', prev.rightToWork.evidenceNote, rtwEvidence, {evidenceReference: rtwEvidence});
        }
        if(cscsAnyChanged){
          if(prev.cscs.status!==cscsStatusVal) addAudit(worker,'CSCS','status', prev.cscs.status, cscsStatusVal);
          if(prev.cscs.expiryDate!==worker.cscs.expiryDate) addAudit(worker,'CSCS','expiry', prev.cscs.expiryDate, worker.cscs.expiryDate);
          if(prev.cscs.evidenceReference!==cscsEvidence) addAudit(worker,'CSCS','evidence', prev.cscs.evidenceReference, cscsEvidence, {evidenceReference: cscsEvidence});
        }
        certsAdded.forEach(c=>addAudit(worker,'Certificate','added', null, c.name));
        certsRemoved.forEach(c=>addAudit(worker,'Certificate','removed', c.name, null));
        certsNewlyVerified.forEach(c=>addAudit(worker,'Certificate','verified', null, c.name, {evidenceReference: c.evidenceReference}));
        certsExpiryChanged.forEach(c=>{ const old = prevCertsById.get(c.id); addAudit(worker,'Certificate','expiry changed', old?old.expiryDate:null, c.expiryDate, {note: c.name}); });
        if(competenceChanged) addAudit(worker,'Competence','assessment', prev.tradeProfile.competenceScore, competenceScoreVal, {verifier: competenceAssessedByVal});
        if(availabilityChanged) addAudit(worker,'Availability','availability', prev.commercial.availability, availabilityVal);
        proofAdded.forEach(p=>addAudit(worker,'Proof of work','added', null, p.project||p.description||'(untitled)'));
        proofNewlyVerified.forEach(p=>addAudit(worker,'Proof of work','verified', null, p.project||p.description||'(untitled)', {verifier: p.verifiedBy}));
        assignAdded.forEach(a=>addAudit(worker,'Assignment','added', null, a.project||a.date||'(untitled)'));
        assignRatingChanged.forEach(a=>{ const old = prevAssignById.get(a.id); addAudit(worker,'Assignment','rating', old?old.rating:null, a.rating, {note: a.project||a.date}); });
        assignOutcomeChanged.forEach(a=>{ const old = prevAssignById.get(a.id); addAudit(worker,'Assignment','rehire decision', old?old.rehireDecision:null, a.rehireDecision, {note: a.project||a.date}); });
        assignDisputeChanged.forEach(a=>addAudit(worker,'Assignment','worker response', null, a.disputeNote, {note: a.project||a.date}));
      } else {
        if(rtwStatusVal==='verified') addAudit(worker,'Right to work','status', null, 'verified', {evidenceReference: rtwEvidence});
        if(cscsStatusVal==='valid') addAudit(worker,'CSCS','status', null, 'valid', {evidenceReference: cscsEvidence});
        certs.filter(c=>c.status==='verified').forEach(c=>addAudit(worker,'Certificate','verified', null, c.name, {evidenceReference: c.evidenceReference}));
        if(competenceScoreVal!==null || competenceEvidenceVal) addAudit(worker,'Competence','assessment', null, competenceScoreVal, {verifier: competenceAssessedByVal});
      }

      if(editingId){ workers = workers.map(w=>w.id===editingId?worker:w); }
      else { workers.push(worker); await persistMeta(); }
      await persistWorkers();
      editingId=null; view='workers'; render();
      showToast('Passport saved.');
    };
  }

        cscs: worker ? [worker.cscs.status, worker.cscs.expiryDate, !!worker.cscs.evidenceReference] : null,
        avail: worker ? worker.commercial.availability : null,
        certs: worker ? (worker.trainingCertificates||[]).map(c=>[c.name,c.status,c.expiryDate,!!c.evidenceReference]) : null,
        assignmentCount: worker ? (worker.assignments||[]).length : null,
        requirements: request ? request.requirements.map(r=>[r.requirementType,r.value,r.mandatory,r.source]) : null
      });
      const opId = 'promote-'+assignment.id+'-'+fingerprint;
      const result = promoteReserveToPrimary(assignment, 'operator', 'Promoted via UI', opId);
      await persistAssignmentEntities(); await persistReadinessSnapshots();
      render();
      if(!result.ok) showToast(result.reason, true); else showToast('Promoted to primary.');
    });
    document.querySelectorAll('[data-cancel-assignment]').forEach(btn=>btn.onclick=async ()=>{
      if(!confirm('Cancel this assignment?')) return;
      const assignment = assignmentEntities.find(x=>x.id===btn.dataset.cancelAssignment);
      transitionAssignmentStatus(assignment, 'CANCELLED', 'Cancelled by operator', 'operator');
      await persistAssignmentEntities();
      render();
      showToast('Assignment cancelled.');
    });
  }
}

/* =========================================================
   PERSISTENCE — thin wrappers over the Storage abstraction.
   Nothing else in the app calls Storage.* directly.
   ========================================================= */
async function persistWorkers(){ await Storage.set(W_KEY, {schemaVersion:SCHEMA_VERSION, data:workers}); }
async function persistCrews(){ await Storage.set(C_KEY, {schemaVersion:SCHEMA_VERSION, data:crews}); }
async function persistClients(){ await Storage.set(CL_KEY, {schemaVersion:SCHEMA_VERSION, data:clients}); }
async function persistMeta(){ await Storage.set(META_KEY, {schemaVersion:SCHEMA_VERSION, passportCounter, referenceCounters}); }
// One coherent snapshot of every dataset, in a fixed order, used whenever we
// need all four keys to land in the same backend together — most importantly
// right after a mid-session fallback, so the fallback never ends up holding
// only whichever single key happened to be mid-write when IndexedDB failed.
async function persistAll(){
  await persistWorkers();
  await persistCrews();
  await persistClients();
  await persistMeta();
}

    showToast('Storage switched to local storage fallback after an IndexedDB error — re-saving everything now.', true);
    // Guarded against recursion/repeat triggers: once we're mid-snapshot, or
    // already on localstorage, further onChange firings are no-ops here —
    // Storage itself already avoids re-entering indexeddb once switched.
    if(fallbackSnapshotInProgress) return;
    fallbackSnapshotInProgress = true;
    persistAll().catch(()=>{}).finally(()=>{ fallbackSnapshotInProgress = false; });
  });
  const backend = await Storage.init();

  assignmentOffers = migrateCollection(offerRaw ? offerRaw.data : [], normaliseAssignmentOffer);
  readinessSnapshots = migrateCollection(snapRaw ? snapRaw.data : [], normaliseReadinessSnapshot);
  evidenceRecords = migrateCollection(evRaw ? evRaw.data : [], normaliseEvidenceRecord);
