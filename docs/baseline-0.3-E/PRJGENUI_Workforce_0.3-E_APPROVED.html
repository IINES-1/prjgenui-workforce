// Non-blocking integrity surface: never stops the app, but a false "all
// clear" is worse than no message at all, so this only ever reports what
// runIntegrityCheck() actually finds — it can't under-report.
function runSilentIntegrityWarning(){
  const issues = runIntegrityCheck();
  if(issues.length){
    console.log(`PRJGENUI integrity check: ${issues.length} issue(s) found.`);
    console.table(issues);
    showToast(`${issues.length} integrity issue(s) detected — see browser console.`, true);
  }
  return issues;
}

function showToast(msg, isDanger){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isDanger ? ' danger' : '');
  setTimeout(()=>{ t.className = 'toast'; }, 2800);
}

/* =========================================================
   EASBERG PILOT INITIALISATION — optional, duplicate-safe.
   Creates shells only. No compliance data is invented: every
   worker starts Not Verified / To Confirm across the board,
   exactly like adding them by hand would.
   ========================================================= */
const EASBERG_PILOT_NAMES = ['Christian','Marisa','Bene','Jepherson','Henry','Lucas'];
async function initialiseEasbergPilot(){
  const existingClient = clients.find(c=>c.name==='Easberg Ltd');
  const existingNames = new Set(workers.map(w=>w.identity.fullName));
  const namesToAdd = EASBERG_PILOT_NAMES.filter(n=>!existingNames.has(n));

  if(existingClient && namesToAdd.length===0){
    showToast('Easberg pilot already initialised — nothing to add.');
    return;
  }
  const parts = [];
  if(!existingClient) parts.push('add Easberg Ltd as a client');
  if(namesToAdd.length) parts.push(`add ${namesToAdd.length} worker shell${namesToAdd.length===1?'':'s'} (${namesToAdd.join(', ')})`);
  if(!confirm(`This will ${parts.join(' and ')}, all marked Not Verified / To Confirm. No compliance data will be invented — you'll fill each in as it's confirmed. Continue?`)) return;

  if(!existingClient){
    const c = blankClient();
    c.name = 'Easberg Ltd';
    clients.push(c);
    await persistClients();
  }
  namesToAdd.forEach(name=>{
    const w = blankWorker();
    w.identity.fullName = name;
    w.identity.passportId = nextPassportId();
    w.commercial.availability = 'To confirm'; // never assume a real availability for an unconfirmed shell
    workers.push(w);
  });
  if(namesToAdd.length){ await persistWorkers(); await persistMeta(); }
  view = 'workers'; render();
  showToast(`Easberg pilot ready — ${namesToAdd.length} shell${namesToAdd.length===1?'':'s'} added. Primary trade left blank on purpose — fill it in when confirmed.`);
  runSilentIntegrityWarning();
}

/* =========================================================
   INTERNAL INTEGRITY CHECK — developer/self-test function.
   Callable from the UI (button, shows a toast summary) and
   from the console (window.PRJGENUI_integrityCheck()) so the
   data can be sanity-checked before real records go in.
   ========================================================= */
function runIntegrityCheck(){
  const issues = [];
  const seenPassportIds = new Map();
  const seenIds = new Map();
  const seenWorkerUUIDs = new Map();

  workers.forEach(w=>{
    const name = w.identity.fullName || '(unnamed)';
    const r = evaluateWorkerReadiness(w);

    if(r.eligible && r.deploymentStatus==='HOLD') issues.push(`${name}: marked eligible while deploymentStatus is HOLD`);
    if(r.eligible && r.deploymentStatus==='BLOCKED') issues.push(`${name}: marked eligible while deploymentStatus is BLOCKED`);
    if(r.deploymentStatus==='READY' && r.blockers.length>0) issues.push(`${name}: marked READY but has compliance blockers (${r.blockers.join('; ')})`);

    if(w.rightToWork.status==='verified' && !w.rightToWork.evidenceNote) issues.push(`${name}: Right to Work verified with no evidence recorded`);
    if(w.cscs.status==='valid' && !w.cscs.evidenceReference) issues.push(`${name}: CSCS valid with no evidence reference`);
    (w.trainingCertificates||[]).forEach(c=>{
      if(c.status==='verified' && !c.evidenceReference) issues.push(`${name}: certificate "${c.name}" verified with no evidence reference`);
    });

    const certIds = (w.trainingCertificates||[]).map(c=>c.id);
    if(new Set(certIds).size !== certIds.length) issues.push(`${name}: duplicate certificate IDs on this worker`);
    const proofIds = (w.proofOfWork||[]).map(p=>p.id);
    if(new Set(proofIds).size !== proofIds.length) issues.push(`${name}: duplicate proof-of-work IDs on this worker`);
    const assignIds = (w.assignments||[]).map(a=>a.id);
    if(new Set(assignIds).size !== assignIds.length) issues.push(`${name}: duplicate assignment IDs on this worker`);

    if(!w.id) issues.push(`${name}: missing internal worker UUID (w.id)`);
    else if(seenIds.has(w.id)) issues.push(`Duplicate worker UUID "${w.id}" (w.id) shared by ${name} and ${seenIds.get(w.id)}`);
    else seenIds.set(w.id, name);

    if(!w.identity.workerUUID) issues.push(`${name}: missing identity.workerUUID`);
    else if(seenWorkerUUIDs.has(w.identity.workerUUID)) issues.push(`Duplicate identity.workerUUID "${w.identity.workerUUID}" shared by ${name} and ${seenWorkerUUIDs.get(w.identity.workerUUID)}`);
    else seenWorkerUUIDs.set(w.identity.workerUUID, name);

    if(w.id && w.identity.workerUUID && w.id !== w.identity.workerUUID) issues.push(`${name}: w.id and identity.workerUUID do not match — should always be the same internal UUID`);

    const pid = w.identity.passportId;
    if(!pid || !/^PW-UK-\d{6}$/.test(pid)) issues.push(`${name}: missing or malformed Passport ID ("${pid}")`);
    else if(seenPassportIds.has(pid)) issues.push(`Duplicate Passport ID "${pid}" shared by ${name} and ${seenPassportIds.get(pid)}`);
    else seenPassportIds.set(pid, name);
  });

  const workerIds = new Set(workers.map(w=>w.id));
  crews.forEach(c=>{
    (c.memberIds||[]).forEach(id=>{ if(!workerIds.has(id)) issues.push(`Crew "${c.name}": member reference "${id}" does not match any existing worker`); });
    if(c.supervisorId && !workerIds.has(c.supervisorId)) issues.push(`Crew "${c.name}": supervisor reference "${c.supervisorId}" does not match any existing worker`);
  });
  clients.forEach(cl=>{
    (cl.preferredWorkerIds||[]).forEach(id=>{ if(!workerIds.has(id)) issues.push(`Client "${cl.name}": preferred-worker reference "${id}" does not match any existing worker`); });
    (cl.excludedWorkerIds||[]).forEach(id=>{ if(!workerIds.has(id)) issues.push(`Client "${cl.name}": excluded-worker reference "${id}" does not match any existing worker`); });
  });

  let maxAssignedPassportNumber = 0;
  workers.forEach(w=>{
    const m = /PW-UK-(\d+)/.exec(w.identity.passportId||'');
    if(m) maxAssignedPassportNumber = Math.max(maxAssignedPassportNumber, parseInt(m[1],10));
  });
  if(passportCounter < maxAssignedPassportNumber) issues.push(`Passport counter (${passportCounter}) is behind the highest assigned Passport ID (${maxAssignedPassportNumber}) — future IDs could collide`);

  // ---- Release 0.2A checks — structural issues are a dedicated function so
  // migration validation never has to string-match against unrelated
  // worker-level text. The review-count note is informational only — every
  // successful migration with legacy data is EXPECTED to produce these, so
  // it must never be treated as a reason to fail the migration.
  issues.push(...runDeploymentDomainIntegrityCheck());
  const legacyReviewCount = assignmentEntities.filter(a=>a.migrationReviewRequired).length;
  if(legacyReviewCount>0) issues.push(`${legacyReviewCount} migrated Assignment record(s) missing contractor/project/site relationships — flagged for review, not inferred`);

  return issues;
}
// Structural checks only — malformed/duplicate references and broken parent
// links. Deliberately excludes the review-count note above: that note is
// EXPECTED on every successful migration and must never fail one.
function runDeploymentDomainIntegrityCheck(){
  const issues = [];
  const seenContractorRefs = new Map(), seenProjectRefs = new Map(), seenSiteRefs = new Map(), seenAssignmentRefs = new Map();
  function checkReference(item, label, pattern, seenMap){
    const ref = item.publicReference;
    if(!ref || !pattern.test(ref)) issues.push(`${label} "${item.id}": missing or malformed public reference ("${ref}")`);
    else if(seenMap.has(ref)) issues.push(`Duplicate ${label} reference "${ref}"`);
    else seenMap.set(ref, item.id);
  }
  contractors.forEach(c=>checkReference(c, 'Contractor', REFERENCE_PATTERNS.contractor, seenContractorRefs));
  projects.forEach(p=>{
    checkReference(p, 'Project', REFERENCE_PATTERNS.project, seenProjectRefs);
    if(p.contractorId && !contractors.some(c=>c.id===p.contractorId)) issues.push(`Project "${p.publicReference||p.id}": contractorId does not match any existing Contractor`);
  });
  sites.forEach(s=>{
    checkReference(s, 'Site', REFERENCE_PATTERNS.site, seenSiteRefs);
    if(s.projectId && !projects.some(p=>p.id===s.projectId)) issues.push(`Site "${s.publicReference||s.id}": projectId does not match any existing Project`);
  });
  assignmentEntities.forEach(a=>{
    checkReference(a, 'Assignment', REFERENCE_PATTERNS.assignment, seenAssignmentRefs);
    const v = validateAssignment(a);
    if(!v.valid){
      const label = a.legacyRecord ? 'legacy Assignment' : 'Production Assignment';
      issues.push(`${label} "${a.publicReference||a.id}": ${v.reason}`);
    }
  });

  const seenRequestRefs = new Map();
  workforceRequests.forEach(r=>{
    checkReference(r, 'WorkforceRequest', REFERENCE_PATTERNS.request, seenRequestRefs);
    const v = validateWorkforceRequest(r);
    if(!v.valid) issues.push(`WorkforceRequest "${r.publicReference||r.id}": ${v.reason}`);
    (r.requirements||[]).forEach(rr=>{ if(rr.requestId !== r.id) issues.push(`RequestRequirement "${rr.id}": requestId does not match its parent WorkforceRequest`); });
  });
  matches.forEach(m=>{
    const v = validateMatch(m);
    if(!v.valid) issues.push(`Match "${m.id}": ${v.reason}`);
    if(m.generationId && !matchGenerations.some(g=>g.id===m.generationId)) issues.push(`Match "${m.id}": generationId does not match any existing MatchGeneration`);
  });
  matchGenerations.forEach(g=>{
    if(g.requestId && !workforceRequests.some(r=>r.id===g.requestId)) issues.push(`MatchGeneration "${g.id}": requestId does not match any existing WorkforceRequest`);
  });

  // 0.3-D additions — pure addition, nothing above this line touched.
  workforcePlans.forEach(wp=>{
    if(!wp.contractorId) issues.push(`WorkforcePlan "${wp.id}": missing contractorId`);
    else if(!contractors.some(c=>c.id===wp.contractorId)) issues.push(`WorkforcePlan "${wp.id}": contractorId does not match any existing Contractor`);
  });
  capacityHolds.forEach(h=>{
    if(!workforcePlans.some(wp=>wp.id===h.workforcePlanId)) issues.push(`CapacityHold "${h.id}": workforcePlanId does not match any existing WorkforcePlan`);
    else if(h.phaseId){
      const plan = workforcePlans.find(wp=>wp.id===h.workforcePlanId);
      if(plan && !plan.phases.some(ph=>ph.id===h.phaseId)) issues.push(`CapacityHold "${h.id}": phaseId does not match any phase on its own WorkforcePlan`);
    }
  });
  const seenCandidatePairs = new Set();
  capacityHoldCandidates.forEach(c=>{
    if(!capacityHolds.some(h=>h.id===c.capacityHoldId)) issues.push(`CapacityHoldCandidate "${c.id}": capacityHoldId does not match any existing CapacityHold`);
    if(!workers.some(w=>w.id===c.workerId)) issues.push(`CapacityHoldCandidate "${c.id}": workerId does not match any existing Worker`);
    if(!CAPACITY_HOLD_CANDIDATE_STATUSES.includes(c.status)) issues.push(`CapacityHoldCandidate "${c.id}": invalid status "${c.status}"`);
    const pairKey = c.capacityHoldId+'::'+c.workerId;
    if(seenCandidatePairs.has(pairKey)) issues.push(`Duplicate CapacityHoldCandidate for hold "${c.capacityHoldId}" and worker "${c.workerId}"`);
    else seenCandidatePairs.add(pairKey);
  });

  // 0.3-E addition — pure addition, nothing above this line touched.
  replacementIncidents.forEach(ri=>{
    if(!assignmentEntities.some(a=>a.id===ri.assignmentId)) issues.push(`ReplacementIncident "${ri.id}": assignmentId does not match any existing Assignment`);
    if(ri.requestId && !workforceRequests.some(r=>r.id===ri.requestId)) issues.push(`ReplacementIncident "${ri.id}": requestId does not match any existing WorkforceRequest`);
    if(!REPLACEMENT_INCIDENT_TYPES.includes(ri.incidentType)) issues.push(`ReplacementIncident "${ri.id}": invalid incidentType "${ri.incidentType}"`);
    if(ri.replacementAssignmentId && !assignmentEntities.some(a=>a.id===ri.replacementAssignmentId)) issues.push(`ReplacementIncident "${ri.id}": replacementAssignmentId does not match any existing Assignment`);
  });

  return issues;
}
function showIntegrityCheckResult(){
  const issues = runIntegrityCheck();
  console.log(`PRJGENUI integrity check: ${issues.length} issue(s) found.`);
  if(issues.length){ console.table(issues); showToast(`${issues.length} integrity issue(s) found — see browser console.`, true); }
  else showToast('Integrity check passed — no issues found.');
  return issues;
}
window.PRJGENUI_integrityCheck = runIntegrityCheck;

/* =========================================================
   EXPORT / IMPORT — preserved and versioned.
   Expanded to cover every current collection (previously only
   workers/crews/clients were included — a pre-existing gap dating to
   Release 0.1, never extended through 0.2A-0.2C-UI, closed here).
   Legacy v7-and-earlier backups (workers/crews/clients only) must still
   import cleanly: every newer collection is optional on read, defaulting
   to empty rather than erroring or touching unrelated data.
   ========================================================= */
function normaliseCrew(c){
  const b = blankCrew();
  c = c || {};
  return Object.assign({}, b, c, { id: c.id || b.id,
    trade: c.trade || '', region: c.region || '',
    memberships: (c.memberships || []).map(m => ({ workerId: m.workerId||'', role: m.role||'', joinedAt: m.joinedAt||'', leftAt: m.leftAt||'' }))
  });
}
function normaliseClient(c){
  const b = blankClient();
  c = c || {};
  return Object.assign({}, b, c, { id: c.id || b.id });
}
function exportData(){
  const payload = {
    exportedAt: new Date().toISOString(), schemaVersion: SCHEMA_VERSION,
    workers, crews, clients,
    contractors, projects, sites,
    workforceRequests, matchGenerations, matches,
    assignmentEntities, assignmentOffers, readinessSnapshots,
    evidenceRecords,
    workforcePlans, capacityHolds, capacityHoldCandidates, replacementIncidents,
    migrationLog,
    passportCounter, referenceCounters
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `prjgenui-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup downloaded.');
}
async function handleImportFile(file){
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.workers) || !Array.isArray(data.crews) || !Array.isArray(data.clients)){
      showToast("That file doesn't look like a PRJGENUI backup.", true); return;
    }
    // Newer collections are optional — an older backup simply won't have them.
    // Missing means empty, never an error, and never touches an unrelated collection.
    const asArray = (v)=> Array.isArray(v) ? v : [];
    const inContractors = asArray(data.contractors), inProjects = asArray(data.projects), inSites = asArray(data.sites);
    const inRequests = asArray(data.workforceRequests), inGenerations = asArray(data.matchGenerations), inMatches = asArray(data.matches);
    const inAssignments = asArray(data.assignmentEntities), inOffers = asArray(data.assignmentOffers), inSnapshots = asArray(data.readinessSnapshots);
    const inEvidence = asArray(data.evidenceRecords), inMigrationLog = asArray(data.migrationLog);
    const inWorkforcePlans = asArray(data.workforcePlans), inCapacityHolds = asArray(data.capacityHolds), inCapacityHoldCandidates = asArray(data.capacityHoldCandidates);
    const inReplacementIncidents = asArray(data.replacementIncidents);

    const summary = `${data.workers.length} workers, ${data.crews.length} crews, ${data.clients.length} clients, `
      + `${inContractors.length} contractors, ${inProjects.length} projects, ${inSites.length} sites, `
      + `${inRequests.length} requests, ${inGenerations.length} match generations, ${inMatches.length} matches, `
      + `${inAssignments.length} assignments, ${inOffers.length} offers, ${inSnapshots.length} readiness snapshots, `
      + `${inEvidence.length} evidence records, ${inWorkforcePlans.length} workforce plans, ${inCapacityHolds.length} capacity holds, ${inCapacityHoldCandidates.length} capacity hold candidates, ${inReplacementIncidents.length} replacement incidents`;
    if(!confirm(`Import this backup (${summary})? This replaces all current data and cannot be undone.`)) return;

    // Every collection passes through its own normaliser — old-shape records
    // filled to current shape, nothing silently accepted as-is.
    workers = migrateCollection(data.workers, normaliseWorker);
    crews = migrateCollection(data.crews, normaliseCrew);
    clients = migrateCollection(data.clients, normaliseClient);
    contractors = migrateCollection(inContractors, normaliseContractor);
    projects = migrateCollection(inProjects, normaliseProject);
    sites = migrateCollection(inSites, normaliseSite);
    workforceRequests = migrateCollection(inRequests, normaliseWorkforceRequest);
    matchGenerations = migrateCollection(inGenerations, normaliseMatchGeneration);
    matches = migrateCollection(inMatches, normaliseMatch);
    assignmentEntities = migrateCollection(inAssignments, normaliseAssignmentEntity);
    assignmentOffers = migrateCollection(inOffers, normaliseAssignmentOffer);
    readinessSnapshots = migrateCollection(inSnapshots, normaliseReadinessSnapshot);
    evidenceRecords = migrateCollection(inEvidence, normaliseEvidenceRecord);
    workforcePlans = migrateCollection(inWorkforcePlans, normaliseWorkforcePlan);
    capacityHolds = migrateCollection(inCapacityHolds, normaliseCapacityHold);
    capacityHoldCandidates = migrateCollection(inCapacityHoldCandidates, normaliseCapacityHoldCandidate);
    replacementIncidents = migrateCollection(inReplacementIncidents, normaliseReplacementIncident);
    migrationLog = inMigrationLog; // a plain log, not a normalised entity type — restored as-is

    passportCounter = data.passportCounter || 0;
    referenceCounters = data.referenceCounters || { contractor:0, project:0, site:0, assignment:0, request:0 };
    assignPassportIdsIfMissing();

    await persistWorkers(); await persistCrews(); await persistClients();
    await persistContractors(); await persistProjects(); await persistSites();
    await persistWorkforceRequests(); await persistMatchGenerations(); await persistMatches();
    await persistAssignmentEntities(); await persistAssignmentOffers(); await persistReadinessSnapshots();
    await persistEvidenceRecords(); await persistWorkforcePlans(); await persistCapacityHolds(); await persistCapacityHoldCandidates(); await persistReplacementIncidents();
    await persistMigrationLog(); await persistMeta();

    editingId = null; view = 'dashboard'; render();
    showToast('Backup imported (migrated to current schema if needed).');
    runSilentIntegrityWarning();
  }catch(e){
    showToast('Could not read that file — is it a valid backup?', true);
  }
}


/* =========================================================
   NAV + RESET + INIT
   ========================================================= */
document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-view]');
  if(!btn) return;
  view = btn.dataset.view; editingId = null; render();
});
document.getElementById('initEasbergBtn').onclick = initialiseEasbergPilot;
document.getElementById('integrityCheckBtn').onclick = showIntegrityCheckResult;
document.getElementById('exportBtn').onclick = exportData;
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0]; handleImportFile(file); e.target.value = '';
};
document.getElementById('resetBtn').onclick = async ()=>{
  if(confirm('Clear all workforce, crew and client data from this tool? This cannot be undone — export a backup first if you want to keep a copy.')){
    workers = []; crews = []; clients = []; passportCounter = 0;
    await persistWorkers(); await persistCrews(); await persistClients(); await persistMeta();
    view='dashboard'; render(); showToast('All data cleared.');
  }
};

(async function init(){
  await loadAll();
  render();
})();
</script>
</body>
</html>
