<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRJGENUI Workforce — Verified Workforce Operating System</title>
<style>
  :root{
    --navy:#1B2A4A; --navy-dark:#121E36; --gold:#9C7A2E; --gold-light:#F3ECDA;
    --paper:#FAF9F6; --panel:#FFFFFF; --ink:#22262E; --slate:#6B7280;
    --line:#E3E1D9; --ok:#2F7A4F; --ok-bg:#E7F3EC; --warn:#B8790A; --warn-bg:#FBF0DD;
    --watch:#3B6FA0; --watch-bg:#E8F0F8;
    --danger:#B23A2F; --danger-bg:#FBEAE8; --none-bg:#EFEEEA;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);}
  a{color:inherit;}
  button{font-family:var(--font);cursor:pointer;}
  input,select,textarea{font-family:var(--font);}
  input:focus,select:focus,textarea:focus,button:focus{outline:2px solid var(--gold);outline-offset:1px;}

  .prototype-notice{background:var(--navy-dark);color:#D8DEEA;font-size:11.5px;text-align:center;padding:7px 14px;}

  header.topbar{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;}
  .brand .mark{width:26px;height:26px;border-radius:6px;background:var(--gold);color:var(--navy-dark);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
  .brand .sub{font-size:10.5px;color:#B9C2D6;font-weight:500;display:block;margin-top:1px;}
  nav.tabs{display:flex;gap:2px;flex-wrap:wrap;}
  nav.tabs button{background:transparent;border:none;color:#CBD3E1;padding:8px 11px;border-radius:8px;font-size:13px;font-weight:500;}
  nav.tabs button.active{background:rgba(255,255,255,0.12);color:#fff;}
  nav.tabs button:hover{color:#fff;}

  main{max-width:960px;margin:0 auto;padding:24px 20px 60px;}
  h1{font-size:22px;font-weight:600;margin:0 0 4px;}
  h2{font-size:17px;font-weight:600;margin:0 0 10px;}
  h3{font-size:14px;font-weight:600;margin:0 0 8px;}
  p.lead{color:var(--slate);font-size:14px;margin:0 0 20px;}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px;}
  .stat .n{font-size:21px;font-weight:600;line-height:1.1;}
  .stat .l{font-size:11.5px;color:var(--slate);margin-top:4px;}
  @media(max-width:640px){.stat-row{grid-template-columns:repeat(2,1fr);}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:20px;}
  .panel.dim{background:var(--paper);}
  .empty{text-align:center;padding:36px 20px;color:var(--slate);}
  .empty h3{color:var(--ink);margin-bottom:6px;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .badge.ok{background:var(--ok-bg);color:var(--ok);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.watch{background:var(--watch-bg);color:var(--watch);}
  .badge.danger{background:var(--danger-bg);color:var(--danger);}
  .badge.none{background:var(--none-bg);color:var(--slate);}
  .badge.gold{background:var(--gold-light);color:#7C6224;}
  .badge.review{background:#EFE7F6;color:#5B3A8E;}
  .stepper{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:12px 0 18px;}
  .stepper .step{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:14px;background:var(--none-bg);color:var(--slate);}
  .stepper .step.current{background:var(--navy);color:#fff;}
  .stepper .step.done{background:var(--ok-bg);color:var(--ok);}
  .stepper .sep{color:var(--line);font-size:12px;}
  .timeline{list-style:none;padding:0;margin:0;}
  .timeline li{border-left:2px solid var(--line);padding:4px 0 14px 14px;margin-left:4px;position:relative;font-size:12.5px;}
  .timeline li::before{content:'';position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--slate);}
  .timeline .t-who{font-weight:600;}
  .timeline .t-when{color:var(--slate);font-size:11px;}
  .breadcrumb{font-size:12.5px;color:var(--slate);margin-bottom:10px;}
  .breadcrumb a{color:var(--watch);cursor:pointer;text-decoration:none;}
  .breadcrumb a:hover{text-decoration:underline;}
  .snapshot-card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#FCFCFB;}
  .snapshot-card .locked{font-size:10.5px;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;}
  .conflict-note{border:1px solid var(--gold);background:var(--gold-light);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#5C4A1E;margin-bottom:12px;}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .toolbar input[type=text]{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:13px;color:var(--slate);}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .btn{border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);}
  .btn:hover{border-color:var(--slate);}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn.primary:hover{background:var(--navy-dark);}
  .btn.danger{color:var(--danger);}
  .btn.small{padding:5px 11px;font-size:12px;}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--slate);}

  .row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .row:last-child{border-bottom:none;}
  .row-main{flex:1;min-width:160px;}
  .row-main .name{font-weight:600;font-size:14px;}
  .row-main .sub{font-size:12px;color:var(--slate);}
  .row-badges{display:flex;gap:6px;flex-wrap:wrap;}
  .row-score{font-size:13px;font-weight:600;min-width:44px;text-align:right;}
  .row-score .u{display:block;font-size:10px;font-weight:400;color:var(--slate);}
  .passport-tag{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--slate);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:1px 6px;}

  .alert-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .alert-row:last-child{border-bottom:none;}
  .alert-row .who{font-weight:600;}
  .alert-row .what{color:var(--slate);}
  .alert-row .action{font-size:11.5px;color:var(--slate);display:block;margin-top:1px;}

  form .field{margin-bottom:14px;}
  form label{display:block;font-size:12px;color:var(--slate);margin-bottom:5px;font-weight:600;}
  form .hint{font-size:11px;color:var(--slate);margin-top:4px;font-weight:400;}
  form input[type=text],form input[type=tel],form input[type=email],form input[type=date],form input[type=number],form select,form textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink);
  }
  form textarea{min-height:56px;resize:vertical;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row.three{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:560px){.field-row,.field-row.three{grid-template-columns:1fr;}}

  .subsection{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;}
  .kicker{font-size:11px;color:#7C6224;font-weight:700;margin-bottom:4px;}
  .sub-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px;padding:10px;background:var(--paper);border-radius:8px;}
  @media(max-width:640px){.sub-row{grid-template-columns:1fr;}}
  .sub-row label{margin-bottom:3px;}
  .sub-row .btn{align-self:center;}

  .checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  @media(max-width:560px){.checkgrid{grid-template-columns:1fr;}}
  .checkgrid label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;color:var(--ink);}

  .form-actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);}

  .audit-item{font-size:12.5px;color:var(--slate);padding:6px 0;border-bottom:1px dashed var(--line);}
  .audit-item:last-child{border-bottom:none;}
  .audit-item b{color:var(--ink);}

  .score-breakdown{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
  .score-breakdown .part{display:flex;justify-content:space-between;font-size:12.5px;color:var(--slate);}
  .score-bar{background:var(--none-bg);border-radius:4px;height:6px;overflow:hidden;margin-top:2px;}
  .score-bar div{background:var(--navy);height:100%;}

  .search-summary{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
  .search-summary .big{font-size:28px;font-weight:600;}
  .search-summary .small{font-size:13px;color:var(--slate);}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,0.2);z-index:999;opacity:0;transition:opacity 0.2s;pointer-events:none;}
  .toast.show{opacity:1;}
  .toast.danger{background:var(--danger);}

  footer.foot{max-width:960px;margin:0 auto;padding:0 20px 40px;text-align:center;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;}
  footer.foot button{font-size:11.5px;color:var(--slate);background:none;border:none;text-decoration:underline;}
  .callout{border:1px solid var(--line);background:var(--gold-light);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#5C4A1E;margin-bottom:16px;}
  .storage-tag{font-size:10.5px;color:var(--slate);}
  .action-group{margin-bottom:18px;}
  .action-group h3{font-size:12.5px;text-transform:none;color:var(--slate);letter-spacing:.02em;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line);}
</style>
</head>
<body>

<div class="prototype-notice">Prototype environment — local browser storage only. Do not use as the sole legal compliance record.</div>

<header class="topbar">
  <div class="brand"><span class="mark">P</span><span>PRJGENUI Workforce<span class="sub" id="storageTag">Verified Workforce Operating System</span></span></div>
  <nav class="tabs" id="tabs">
    <button data-view="dashboard">Dashboard</button>
    <button data-view="workers">Workers</button>
    <button data-view="compliance">Compliance</button>
    <button data-view="crews">Crews</button>
    <button data-view="contractors">Contractors</button>
    <button data-view="requests">Requests</button>
  </nav>
</header>

<main id="app"></main>

<footer class="foot">
  <button id="initEasbergBtn">Initialise Easberg pilot</button>
  <button id="integrityCheckBtn">Run integrity check</button>
  <button id="exportBtn">Export data</button>
  <button id="importBtn">Import data</button>
  <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
  <button id="resetBtn">Clear all data</button>
</footer>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const SCHEMA_VERSION = 10;
const DB_NAME = 'prjgenui-workforce';
const DB_VERSION = 1;
const STORE_NAME = 'kv';
const W_KEY = 'workers';
const C_KEY = 'crews';
const CL_KEY = 'clients';
const META_KEY = 'meta';
const CTR_KEY = 'contractors';
const PRJ_KEY = 'projects';
const STE_KEY = 'sites';
const ASN_KEY = 'assignmentEntities';
const MIGRATIONS_KEY = 'migrations';
const WFR_KEY = 'workforceRequests';
const MG_KEY = 'matchGenerations';
const MATCH_KEY = 'matches';
const OFFER_KEY = 'assignmentOffers';
const SNAPSHOT_KEY = 'readinessSnapshots';
const EVIDENCE_KEY = 'evidenceRecords';
const WORKFORCE_PLAN_KEY = 'workforcePlans';
const CAPACITY_HOLD_KEY = 'capacityHolds';
const CAPACITY_HOLD_CANDIDATE_KEY = 'capacityHoldCandidates';
const REPLACEMENT_INCIDENT_KEY = 'replacementIncidents';

const CERT_OPTIONS = ['H&S Awareness','Working at height','Asbestos awareness','Manual handling','COSHH','PPE','RAMS Awareness','Fire Safety','First aid','Fire marshal'];
// The single authoritative source for universally-mandatory training and the
// deployment score threshold. Nothing else in the app should hardcode either
// of these — see coreTrainingCurrent() and evaluateWorkerReadiness().
// coreTrainingRequirements is empty by default: no certificate is assumed
// universally mandatory just by existing. Add certificate names here only
// when there's a genuine company-wide requirement.
const WORKFORCE_POLICY = {
  // Performance Evidence Review Threshold is a human-review trigger only.
  // It does not establish, remove or override compliance eligibility.
  performanceEvidenceReviewThreshold: 70,
  coreTrainingRequirements: []
};
const SECTOR_OPTIONS = ['Education','Housing / residential','Commercial','Healthcare','Industrial','Occupied buildings'];
const AVAILABILITY_OPTIONS = ['To confirm','Available','Within 24h','Unavailable','Booked'];

/* =========================================================
   STORAGE — IndexedDB primary, localStorage fallback.
   One abstraction used everywhere; nothing else touches
   indexedDB/localStorage directly. Swappable for a real
   backend (Supabase/Postgres) later without touching the
   rest of the app — every caller only ever sees get/set/remove.
   ========================================================= */
const Storage = (function(){
  let backend = null; // 'indexeddb' | 'localstorage'
  let dbPromise = null;
  let changeHandler = function(){};
  function onBackendChange(){ try{ changeHandler(backend); }catch(e){} }

  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject)=>{
      if(!window.indexedDB){ reject(new Error('IndexedDB unavailable')); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
      req.onblocked = ()=> reject(new Error('IndexedDB blocked'));
    });
    return dbPromise;
  }

  async function idbGet(key){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = ()=> resolve(req.result === undefined ? null : req.result);
      req.onerror = ()=> reject(req.error);
    });
  }
  async function idbSet(key, value){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(value, key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
  }
  async function idbRemove(key){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
  }
  function lsGet(key){
    try{ const raw = localStorage.getItem('prjgenui:'+key); return raw===null ? null : JSON.parse(raw); }
    catch(e){ return null; }
  }
  function lsSet(key, value){
    try{ localStorage.setItem('prjgenui:'+key, JSON.stringify(value)); return true; }
    catch(e){ return false; }
  }
  function lsRemove(key){
    try{ localStorage.removeItem('prjgenui:'+key); return true; }
    catch(e){ return false; }
  }

  return {
    async init(){
      try{
        await openDB();
        // sanity round-trip so a silently-broken IndexedDB (private
        // browsing quota issues etc.) falls back cleanly rather than
        // failing later on every read/write.
        await idbSet('__healthcheck', true);
        await idbGet('__healthcheck');
        backend = 'indexeddb';
      }catch(e){
        backend = 'localstorage';
      }
      return backend;
    },
    backend(){ return backend; },
    onChange(fn){ changeHandler = fn; },
    async get(key){
      if(backend==='indexeddb'){
        try{ return await idbGet(key); }
        catch(e){ backend = 'localstorage'; onBackendChange(); return lsGet(key); }
      }
      return lsGet(key);
    },
    async set(key, value){
      if(backend==='indexeddb'){
        try{ return await idbSet(key, value); }
        catch(e){ backend = 'localstorage'; onBackendChange(); return lsSet(key, value); }
      }
      return lsSet(key, value);
    },
    async remove(key){
      if(backend==='indexeddb'){
        try{ return await idbRemove(key); }
        catch(e){ backend = 'localstorage'; onBackendChange(); return lsRemove(key); }
      }
      return lsRemove(key);
    }
  };
})();

/* =========================================================
   MIGRATIONS — upgrade older saved shapes to the current
   schema. Never destructive: unknown/old fields are mapped
   forward, nothing is silently dropped without a reason.
   ========================================================= */
// Internal helper: maps a pre-v3 flat shape into the target shape. Also
// tolerates being handed an already-current-shape object (falls through
// almost unchanged) — normaliseWorker() below is what actually guarantees
// completeness either way.
function legacyMap(w){
  const legacyIdentity = (w && w.identity) || {};
  const legacyPerf = (w && w.performance) || {};
  const legacyComm = (w && w.commercial) || {};
  const legacyRtw = legacyIdentity.rtw || {};
  const legacyCscs = legacyIdentity.cscs || {};

  const existingUUID = (w && w.id) || (w && w.identity && w.identity.workerUUID) || null;
  const internalUUID = existingUUID || uid();

  return {
    schemaVersion: SCHEMA_VERSION,
    id: internalUUID,
    identity: {
      fullName: (w && w.name) || (w && w.identity && w.identity.fullName) || '',
      preferredName: (w && w.identity && w.identity.preferredName) || '',
      phone: (w && w.phone) || (w && w.identity && w.identity.phone) || '',
      email: (w && w.identity && w.identity.email) || '',
      postcode: legacyComm.postcode || (w && w.identity && w.identity.postcode) || '',
      nationality: (w && w.identity && w.identity.nationality) || '',
      workerUUID: internalUUID,
      passportId: (w && w.identity && w.identity.passportId) || null,
      status: (w && w.identity && w.identity.status) || 'active'
    },
    rightToWork: (w && w.rightToWork) || {
      status: legacyRtw.status || 'not_verified', method: legacyRtw.method || '',
      checkedDate: legacyRtw.checkedDate || '', expiryDate: legacyRtw.expiryDate || '',
      verifier: '', reference: '', evidenceNote: legacyRtw.evidence || '',
      evidenceFileReference: '', lastReviewed: ''
    },
    cscs: (w && w.cscs) || {
      status: legacyCscs.status || 'not_checked', registrationNumber: legacyCscs.regNumber || '',
      cardType: legacyCscs.cardType || '', occupation:'', scheme:'', issueDate:'',
      expiryDate: legacyCscs.expiryDate || '', verificationMethod:'', verifier:'', verificationDate:'',
      evidenceReference: legacyCscs.evidence || ''
    },
    trainingCertificates: (w && w.trainingCertificates) || (legacyIdentity.certs||[]).map(c=>({
      id: uid(), name: c.name, category:'core', issuer:'', certificateNumber:'',
      issueDate:'', expiryDate: c.expiryDate||'', status:'to_confirm', requirementType:'deployment_specific',
      verificationMethod:'', verifier:'', verificationDate:'', evidenceReference:'', notes:''
    })),
    tradeProfile: (w && w.tradeProfile) || {
      primaryTrade: (w && w.trade) || '', secondaryTrades: [],
      yearsExperience: '', competenceScore: (legacyPerf.competenceScore ?? null),
      competenceAssessedBy: legacyPerf.competenceNotes || '', competenceAssessmentDate: '',
      competenceEvidence: '', notes: (w && w.notes) || ''
    },
    proofOfWork: (w && w.proofOfWork) || (legacyPerf.proofOfSkill||[]).map(s=>({
      id: uid(), project:'', client:'', site:'', trade:'', description: s.competency||'',
      dateFrom: s.date||'', dateTo:'', supervisor: s.confirmedBy||'',
      verified: !!s.confirmedBy, verifiedBy: s.confirmedBy||'',
      evidenceReferences: [], imagesReferences: [], notes:''
    })),
    assignments: (w && w.assignments) || (legacyPerf.assignments||[]).map(a=>({
      id: uid(), deploymentId:'', client:'', project: a.project||'', date: a.date||'',
      attended: a.attended!==false, late:false, noShow: a.attended===false,
      rating: a.rating||null, rehireDecision: a.rehire||'to_confirm',
      clientFeedback:'', supervisorFeedback:'', issueRecorded:false, outcome:''
    })),
    commercial: (w && w.commercial && w.commercial.availableFrom!==undefined) ? w.commercial : {
      postcode: legacyComm.postcode||'', travelRadius: legacyComm.travelRadius||'', dayRate: legacyComm.dayRate||'',
      availability: legacyComm.availability||'To confirm', availableFrom:'',
      sectorExperience: legacyComm.sectorExperience||[], preferredLocations:[], transport:'', ownTools:'', notes:''
    },
    auditLog: (w && w.auditLog) || []
  };
}

// The one function every loaded/imported worker passes through. Runs
// unconditionally — no version-number shortcut — so a record that's
// "already current" but has a gap (missing child ID, missing requirementType,
// an old-shape audit entry) still gets fixed. Never overwrites a value that's
// already validly present; only ever fills genuine gaps.
function normaliseWorker(raw){
  const w = legacyMap(raw);

  w.schemaVersion = SCHEMA_VERSION;

  const uuid = w.id || w.identity.workerUUID || uid();
  w.id = uuid;
  w.identity.workerUUID = uuid;
  w.identity.fullName = w.identity.fullName || '';
  w.identity.status = w.identity.status || 'active';

  w.trainingCertificates = (w.trainingCertificates || []).map(c => ({
    id: c.id || uid(),
    name: c.name || '',
    category: c.category || 'core',
    issuer: c.issuer || '',
    certificateNumber: c.certificateNumber || '',
    issueDate: c.issueDate || '',
    expiryDate: c.expiryDate || '',
    status: c.status || 'to_confirm',
    // Conservative default: an existing certificate with no recorded
    // requirementType is treated as deployment-specific, never as
    // universally mandatory "core" — see item 4.
    requirementType: c.requirementType || 'deployment_specific',
    verificationMethod: c.verificationMethod || '',
    verifier: c.verifier || '',
    verificationDate: c.verificationDate || '',
    evidenceReference: c.evidenceReference || '',
    notes: c.notes || ''
  }));

  w.proofOfWork = (w.proofOfWork || []).map(p => ({
    id: p.id || uid(), project: p.project || '', client: p.client || '', site: p.site || '', trade: p.trade || '',
    description: p.description || '', dateFrom: p.dateFrom || '', dateTo: p.dateTo || '',
    supervisor: p.supervisor || '', verified: !!p.verified, verifiedBy: p.verifiedBy || '',
    evidenceReferences: p.evidenceReferences || [], imagesReferences: p.imagesReferences || [], notes: p.notes || ''
  }));

  w.assignments = (w.assignments || []).map(a => ({
    id: a.id || uid(), deploymentId: a.deploymentId || '', client: a.client || '', project: a.project || '', date: a.date || '',
    attended: a.attended !== false, late: !!a.late, noShow: !!a.noShow,
    rating: (a.rating === undefined) ? null : a.rating,
    rehireDecision: a.rehireDecision || 'to_confirm',
    disputeNote: a.disputeNote || '',
    clientFeedback: a.clientFeedback || '', supervisorFeedback: a.supervisorFeedback || '',
    issueRecorded: !!a.issueRecorded, outcome: a.outcome || ''
  }));

  w.auditLog = (w.auditLog || []).map(migrateAuditEntry);

  // Defensive consistency fix: an existing/current-schema worker whose
  // commercial object is missing individual fields (rather than the whole
  // object) previously passed through legacyMap() unfilled. This guarantees
  // every field exists without ever overwriting a value that's already there.
  w.commercial = w.commercial || {};
  w.commercial.postcode = w.commercial.postcode || '';
  w.commercial.travelRadius = w.commercial.travelRadius || '';
  w.commercial.dayRate = w.commercial.dayRate || '';
  w.commercial.availability = w.commercial.availability || 'To confirm';
  w.commercial.availableFrom = w.commercial.availableFrom || '';
  w.commercial.sectorExperience = w.commercial.sectorExperience || [];
  w.commercial.preferredLocations = w.commercial.preferredLocations || [];
  w.commercial.transport = w.commercial.transport || '';
  w.commercial.ownTools = w.commercial.ownTools || '';
  w.commercial.notes = w.commercial.notes || '';

  return w;
}
function migrateCollection(list, normaliseFn){
  return (list||[]).map(normaliseFn);
}

/* =========================================================
   UTILITIES
   ========================================================= */
function uid(){
  if(typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7) + Math.random().toString(36).slice(2,7);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowLabel(){ return new Date().toLocaleString('en-GB', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date(todayStr() + 'T00:00:00');
  return Math.round((d - now) / 86400000);
}
function fmtDate(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function badge(status, label){ return `<span class="badge ${status}">${esc(label)}</span>`; }
function workerById(id){ return workers.find(w=>w.id===id); }
function workerName(w){ return w ? w.identity.fullName : '(removed worker)'; }

/* =========================================================
   PASSPORT ID — permanent, sequential, human-facing.
   Never Date.now(); the internal id/UUID stays separate and
   is never shown as the passport identifier.
   ========================================================= */
let passportCounter = 0;
function nextPassportId(){
  passportCounter += 1;
  return 'PW-UK-' + String(passportCounter).padStart(6,'0');
}
function assignPassportIdsIfMissing(){
  // Deterministic: highest existing numeric suffix first, so re-runs never collide.
  let maxSeen = 0;
  workers.forEach(w=>{
    const m = /PW-UK-(\d+)/.exec(w.identity.passportId||'');
    if(m) maxSeen = Math.max(maxSeen, parseInt(m[1],10));
  });
  passportCounter = Math.max(passportCounter, maxSeen);
  workers.forEach(w=>{
    if(!w.identity.passportId) w.identity.passportId = nextPassportId();
  });
}

/* =========================================================
   EXPIRY ENGINE — one set of rules, applied everywhere
   (RTW, CSCS, training, any other dated evidence).
   expired -> danger | 0-30 -> warn (amber) | 31-60 -> watch | 60+ -> current
   ========================================================= */
function expiryBand(dateStr){
  if(!dateStr) return 'none';
  const d = daysUntil(dateStr);
  if(d < 0) return 'expired';
  if(d <= 30) return 'warn';
  if(d <= 60) return 'watch';
  return 'current';
}
function expiryBadgeStatus(band){
  // maps an expiry band to a CSS badge class
  if(band==='expired') return 'danger';
  if(band==='warn') return 'warn';
  if(band==='watch') return 'watch';
  if(band==='current') return 'ok';
  return 'none';
}

    trainingCertificates: [],

function blankCrew(){ return {id:uid(), name:'', supervisorId:'', memberIds:[], specialism:'', notes:'', deployments:[],

function blankClient(){ return {id:uid(), name:'', notes:'', preferredWorkerIds:[], excludedWorkerIds:[], standardTrainingRequirements:[], standardCSCSRequired:false, sector:''}; }

function addAudit(w, category, field, oldValue, newValue, opts){
  opts = opts || {};
  w.auditLog = w.auditLog || [];
  w.auditLog.unshift({
    id: uid(),
    timestamp: new Date().toISOString(),
    category: category,
    field: field || '',
    oldValue: (oldValue===undefined || oldValue===null || oldValue==='') ? null : oldValue,
    newValue: (newValue===undefined || newValue===null || newValue==='') ? null : newValue,
    verifier: opts.verifier || '',
    evidenceReference: opts.evidenceReference || '',
    note: opts.note || ''
  });
}
// Display-only formatting — the stored value stays ISO 8601 so it's sortable
// and backend-ready; this just renders it for a human reader. Old (pre-v3.2)
// entries already stored an en-GB string rather than ISO — those simply
// don't parse as a date here, so they're shown exactly as they were saved.
function formatAuditTimestamp(ts){
  const d = new Date(ts);
  if(isNaN(d.getTime())) return ts;
  return d.toLocaleString('en-GB', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
}
// Upgrades a v3.1-and-earlier flat {date,field,action,note} entry to the
// structured shape, so old saved data keeps displaying correctly without
// ever needing two different rendering paths.
function migrateAuditEntry(a){
  if(a && a.timestamp !== undefined) return a; // already structured
  return {
    id: uid(),
    timestamp: (a && a.date) || nowLabel(),
    category: (a && a.field) || 'General',
    field: '',
    oldValue: null,
    newValue: (a && a.action) || null,
    verifier: '',
    evidenceReference: '',
    note: (a && a.note) || ''
  };
}

/* =========================================================
   EVIDENCE ENGINE — weighted completeness, not a flat count.
   Right to Work and CSCS are hard-gated elsewhere (READINESS
   ENGINE); this score is about the supporting evidence pack,
   and only counts categories that actually apply.
   ========================================================= */
function evidenceCompleteness(w){
  const items = [];
  items.push({label:'Right to Work evidence', weight:25, met: !!w.rightToWork.evidenceNote});
  items.push({label:'CSCS Smart Check reference', weight:20, met: !!w.cscs.evidenceReference});

  const certs = w.trainingCertificates || [];
  if(certs.length){
    const withEvidence = certs.filter(c=>c.evidenceReference).length;
    items.push({label:'Training certificate evidence', weight:20, met:false, partial: withEvidence/certs.length});
  } else {
    items.push({label:'At least one training certificate on file', weight:20, met:false, partial:0});
  }

  items.push({label:'Competence assessment', weight:15, met: !!(w.tradeProfile.competenceEvidence || w.tradeProfile.competenceScore!==null)});
  items.push({label:'Recent proof-of-work record', weight:10, met: (w.proofOfWork||[]).some(p=>p.verified)});
  items.push({label:'Assignment history', weight:10, met: (w.assignments||[]).length>0});

  const totalWeight = items.reduce((s,i)=>s+i.weight,0);
  const earned = items.reduce((s,i)=> s + (i.met ? i.weight : (i.partial ? i.weight*i.partial : 0)), 0);
  const percent = Math.round(earned/totalWeight*100);
  const missing = items.filter(i=>!i.met && !(i.partial>=0.999)).map(i=>i.label);
  return {percent, missing};
}
function coreTrainingCurrent(w){
  const required = WORKFORCE_POLICY.coreTrainingRequirements || [];
  if(required.length===0) return true; // no universal policy set — nothing to fail on this dimension
  return required.every(name=>{
    const cert = (w.trainingCertificates||[]).find(c=>c.name===name);
    return !!cert && certificateIsCurrentlyValid(cert);
  });
}

/* =========================================================
   PERFORMANCE EVIDENCE ENGINE — five explainable components.
   Never a hidden number: every part shown here is the same
   part shown to the user. Missing data is never rewarded —
   a component with nothing behind it is left out of the
   total rather than defaulted to a good score.
   ========================================================= */
const SCORE_WEIGHTS = { competence:0.20, reliability:0.20, performance:0.15 };
const READINESS_RULES_VERSION = '0.1';

// Performance Evidence — Release 0.1: Verification and Compliance no longer
// contribute to this score at all. They are pure Compliance Eligibility gates
// now (see evaluateGeneralReadiness), never points. Only genuinely
// evidence-based, history-driven signals remain here.
function performanceEvidence(w){
  const parts = [];

  if(w.tradeProfile.competenceScore !== null && w.tradeProfile.competenceScore !== undefined && w.tradeProfile.competenceScore !== ''){
    parts.push({key:'competence', label:'Competence', weight:SCORE_WEIGHTS.competence, value: Math.max(0,Math.min(20,Number(w.tradeProfile.competenceScore)))/20});
  }

  // Reliability and Client feedback are the only two components genuinely
  // built from a count of real events, so they're the only two where a
  // confidence label is honest — a 5.0 from one assignment isn't the same
  // claim as a 4.7 from eighty, and the number should say so.
  const assignments = w.assignments || [];
  if(assignments.length){
    const attendedRate = assignments.filter(a=>a.attended && !a.noShow).length / assignments.length;
    const decided = assignments.filter(a=>a.rehireDecision==='yes'||a.rehireDecision==='no');
    const rehireRate = decided.length ? decided.filter(a=>a.rehireDecision==='yes').length/decided.length : null;
    parts.push({key:'reliability', label:'Reliability', weight:SCORE_WEIGHTS.reliability, value: rehireRate===null ? attendedRate : (attendedRate+rehireRate)/2, evidenceCount: assignments.length, confidence: evidenceConfidenceLabel(assignments.length)});
  }

  const rated = assignments.filter(a=>a.rating);
  if(rated.length){
    const avg = rated.reduce((s,a)=>s+Number(a.rating),0)/rated.length;
    parts.push({key:'performance', label:'Client feedback', weight:SCORE_WEIGHTS.performance, value: avg/5, evidenceCount: rated.length, confidence: evidenceConfidenceLabel(rated.length)});
  }

  const totalWeight = parts.reduce((s,p)=>s+p.weight,0);
  const score = totalWeight>0 ? Math.round(parts.reduce((s,p)=>s+p.value*p.weight,0)/totalWeight*100) : null;
  const missingComponents = Object.keys(SCORE_WEIGHTS).filter(k=>!parts.some(p=>p.key===k));
  return {
    score,
    band: score===null ? 'Insufficient data' : scoreBand(score),
    parts: parts.map(p=>({label:p.label, pct:Math.round(p.value*100), confidence:p.confidence||null, evidenceCount:(p.evidenceCount!==undefined?p.evidenceCount:null)})),
    missingComponents
  };
}
function evidenceConfidenceLabel(n){
  if(n>=10) return 'High confidence';
  if(n>=3) return 'Building evidence';
  return 'Limited evidence';
}
function scoreBand(score){
  if(score>=90) return 'Exceptional';
  if(score>=80) return 'Strong';
  if(score>=70) return 'Good Evidence';
  if(score>=60) return 'Developing';
  return 'Early Evidence';
}
function scoreBreakdownHtml(sc){
  if(sc.score===null) return '<p class="hint">Insufficient data — no verification, compliance or history recorded yet.</p>';
  return `<div class="score-breakdown">${sc.parts.map(p=>`
    <div>
      <div class="part"><span>${esc(p.label)}${p.confidence ? ' <span style="color:var(--slate);font-weight:400;">— '+esc(p.confidence)+(p.evidenceCount?' ('+p.evidenceCount+')':'')+'</span>' : ''}</span><span>${p.pct}%</span></div>
      <div class="score-bar"><div style="width:${p.pct}%;"></div></div>
    </div>`).join('')}
    ${sc.missingComponents.length ? `<p class="hint" style="margin-top:6px;">Not yet scored: ${sc.missingComponents.join(', ')} — no data recorded.</p>` : ''}
  </div>`;
}

// One reusable certificate-validity rule, used everywhere a certificate's
// validity matters, so no two screens can ever disagree about it.
function certificateIsCurrentlyValid(c){
  return c.status === 'verified' && !!c.evidenceReference && expiryBand(c.expiryDate) !== 'expired';
}

/* =========================================================
   COMPLIANCE ELIGIBILITY — Release 0.1.
   Pure pass/blocked. No score, no availability. A worker can be
   GENERAL_READY and still be unavailable right now — availability is an
   Assignment Readiness concern, not a general compliance fact.
   ========================================================= */
function evaluateGeneralReadiness(worker){
  const blockers = [];
  const warnings = [];
  const expiringItems = [];
  const reviewItems = [];

  const rtwBand = expiryBand(worker.rightToWork.expiryDate);
  if(worker.rightToWork.status !== 'verified'){
    blockers.push('Confirm Right to Work');
  } else if(!worker.rightToWork.evidenceNote){
    blockers.push('Right to Work verified but missing evidence');
  } else if(rtwBand==='expired'){
    blockers.push('Right to Work expired');
  } else if(rtwBand==='warn'){
    warnings.push('Right to Work expires within 30 days');
    expiringItems.push({item:'Right to Work', expiryDate:worker.rightToWork.expiryDate});
  } else if(rtwBand==='watch'){
    expiringItems.push({item:'Right to Work', expiryDate:worker.rightToWork.expiryDate});
  }

  const cscsBand = expiryBand(worker.cscs.expiryDate);
  if(worker.cscs.status !== 'valid'){
    blockers.push('Confirm CSCS');
  } else if(!worker.cscs.evidenceReference){
    blockers.push('CSCS valid but missing evidence');
  } else if(cscsBand==='expired'){
    blockers.push('CSCS expired');
  } else if(cscsBand==='warn'){
    warnings.push('CSCS expires within 30 days');
    expiringItems.push({item:'CSCS', expiryDate:worker.cscs.expiryDate});
  } else if(cscsBand==='watch'){
    expiringItems.push({item:'CSCS', expiryDate:worker.cscs.expiryDate});
  }

  (worker.trainingCertificates||[]).forEach(c=>{
    if(!certificateIsCurrentlyValid(c)) return; // policy check below decides if a missing/invalid cert matters
    const band = expiryBand(c.expiryDate);
    if(band==='warn'){
      warnings.push(`${c.name} expires within 30 days`);
      expiringItems.push({item:c.name, expiryDate:c.expiryDate});
    } else if(band==='watch'){
      expiringItems.push({item:c.name, expiryDate:c.expiryDate});
    }
  });
  // Universal mandatory training is driven entirely by the configurable
  // policy list, never by a certificate's own requirementType tag — tagging
  // something "core" in the passport is administrative labelling only. An
  // empty policy means nothing here can create a blocker.
  (WORKFORCE_POLICY.coreTrainingRequirements||[]).forEach(name=>{
    const cert = (worker.trainingCertificates||[]).find(c=>c.name===name);
    if(!cert){
      blockers.push(`${name} required by workforce policy — not held`);
    } else if(!certificateIsCurrentlyValid(cert)){
      const reason = cert.status!=='verified' ? 'not verified' : (!cert.evidenceReference ? 'missing evidence' : 'expired');
      blockers.push(`${name} required by workforce policy — ${reason}`);
    }
  });

  // Evidence-pack completeness is a data-quality signal, not a legal or
  // contractual requirement — it can no longer block or hold a worker on
  // its own. It surfaces here as a review item only.
  const ev = evidenceCompleteness(worker);
  if(ev.percent < 80) reviewItems.push({type:'EVIDENCE_INCOMPLETE', message:`Evidence pack below 80% complete (${ev.percent}%)`});

  const neverStarted = worker.rightToWork.status==='not_verified' && worker.cscs.status==='not_checked' && (worker.trainingCertificates||[]).length===0;

  let status;
  if(neverStarted) status = 'NOT_VERIFIED';
  else if(blockers.length>0) status = 'BLOCKED';
  else if(warnings.length>0) status = 'EXPIRING_SOON';
  else status = 'GENERAL_READY';

  return {
    status, blockers, warnings, expiringItems, reviewItems,
    evidenceCompleteness: ev.percent, missingEvidence: ev.missing,
    evaluatedAt: new Date().toISOString(), rulesVersion: READINESS_RULES_VERSION
  };
}

/* =========================================================
   ASSIGNMENT SUITABILITY / ASSIGNMENT READY — Release 0.1.
   Always calls General Readiness first. Layers on trade, required
   training/sector, availability, and Performance Evidence — the last of
   which can only ever produce HUMAN_REVIEW, never BLOCKED.
   assignmentRequirements: { tradeRequired, requiredTraining:[], requiredSectorExperience:[] }
   — same shape Deploy search already builds; pass {} for a general check.
   ========================================================= */
function evaluateAssignmentReadiness(worker, assignmentRequirements){
  assignmentRequirements = assignmentRequirements || {};
  const general = evaluateGeneralReadiness(worker);
  const reviewItems = general.reviewItems.slice();
  const stamp = { evaluatedAt: new Date().toISOString(), rulesVersion: READINESS_RULES_VERSION };

  if(general.status === 'BLOCKED' || general.status === 'NOT_VERIFIED'){
    return Object.assign({
      status: 'BLOCKED', eligible:false, candidate:false, requiresHumanReview:false,
      mandatoryChecks: [], passedChecks: [], failedChecks: general.blockers.slice(),
      warnings: general.warnings, reviewItems, generalReadiness: general
    }, stamp);
  }

  const passedChecks = ['Compliance gates cleared'];
  const failedChecks = [];

  const tradeOk = !assignmentRequirements.tradeRequired || worker.tradeProfile.primaryTrade.toLowerCase().includes(assignmentRequirements.tradeRequired.toLowerCase());
  tradeOk ? passedChecks.push('Trade match') : failedChecks.push('Trade does not match');

  const sectorOk = !assignmentRequirements.requiredSectorExperience || !assignmentRequirements.requiredSectorExperience.length ||
    assignmentRequirements.requiredSectorExperience.some(s => (worker.commercial.sectorExperience||[]).includes(s));
  if(assignmentRequirements.requiredSectorExperience && assignmentRequirements.requiredSectorExperience.length){
    sectorOk ? passedChecks.push('Sector experience match') : failedChecks.push('No matching sector experience');
  }

  const trainingOk = !assignmentRequirements.requiredTraining || !assignmentRequirements.requiredTraining.length ||
    assignmentRequirements.requiredTraining.every(t=>{
      const cert = (worker.trainingCertificates||[]).find(c=>c.name===t);
      return !!cert && certificateIsCurrentlyValid(cert);
    });
  if(assignmentRequirements.requiredTraining && assignmentRequirements.requiredTraining.length){
    trainingOk ? passedChecks.push('Required training current') : failedChecks.push('Missing or expired required training');
  }

  if(!tradeOk || !sectorOk || !trainingOk){
    return Object.assign({
      status:'BLOCKED', eligible:false, candidate:false, requiresHumanReview:false,
      mandatoryChecks:['trade','sector','training'], passedChecks, failedChecks,
      warnings: general.warnings, reviewItems, generalReadiness: general
    }, stamp);
  }

  const avail = worker.commercial.availability;
  const availabilityOk = (avail==='Available' || avail==='Within 24h');
  if(!availabilityOk){
    return Object.assign({
      status:'HOLD', eligible:false, candidate:true, requiresHumanReview:false,
      mandatoryChecks:['trade','sector','training','availability'], passedChecks,
      failedChecks:[`Availability not confirmed as workable (${avail||'not set'})`],
      warnings: general.warnings, reviewItems, generalReadiness: general
    }, stamp);
  }
  passedChecks.push('Available');

  // Performance Evidence informs human review — it can never block a
  // compliant, available worker. "No history yet" and "poor recorded
  // history" are kept explicitly distinct: a new worker is not the same
  // claim as a worker with an adverse record, and must never be
  // represented as if it were.
  const assignmentCount = (worker.assignments||[]).length;
  const perf = performanceEvidence(worker);
  let requiresHumanReview = false;
  if(assignmentCount === 0){
    requiresHumanReview = true;
    reviewItems.push({type:'LIMITED_PERFORMANCE_EVIDENCE', message:'New to PRJGENUI — insufficient verified assignment evidence yet.'});
  } else if(perf.score !== null && perf.score < WORKFORCE_POLICY.performanceEvidenceReviewThreshold){
    requiresHumanReview = true;
    reviewItems.push({type:'PERFORMANCE_REVIEW', message:`Recorded performance evidence (${perf.score}%) is below the review threshold (${WORKFORCE_POLICY.performanceEvidenceReviewThreshold}%).`});
  }

  const status = requiresHumanReview ? 'HUMAN_REVIEW' : (general.status==='EXPIRING_SOON' ? 'EXPIRING_SOON' : 'ASSIGNMENT_READY');

  return Object.assign({
    status, eligible:true, candidate:true, requiresHumanReview,
    mandatoryChecks:['trade','sector','training','availability'], passedChecks, failedChecks,
    warnings: general.warnings, reviewItems, generalReadiness: general
  }, stamp);
}

/* =========================================================
   BACKWARD-COMPATIBLE WRAPPER — Release 0.1.
   Every existing screen (Dashboard, Workers, Compliance Centre, Deploy
   search, integrity checker) keeps calling this exact function with the
   exact same signature and reading the exact same field names. Internally
   it now composes evaluateGeneralReadiness + evaluateAssignmentReadiness +
   performanceEvidence rather than computing anything itself.
   ========================================================= */
function evaluateWorkerReadiness(worker, deploymentRequirement){
  const assignment = evaluateAssignmentReadiness(worker, deploymentRequirement || {});
  const general = assignment.generalReadiness;
  const perf = performanceEvidence(worker);

  const passportStatus = general.status === 'NOT_VERIFIED' ? 'NOT VERIFIED'
    : general.status === 'BLOCKED' ? 'BLOCKED'
    : general.status === 'EXPIRING_SOON' ? 'EXPIRING SOON'
    : 'VERIFIED';

  const complianceStatus = general.status === 'BLOCKED' ? 'BLOCKED'
    : general.status === 'EXPIRING_SOON' ? 'EXPIRING SOON'
    : 'VERIFIED';

  // Maps the richer Assignment Readiness vocabulary back onto the four
  // strings every existing screen already renders and filters on, so no UI
  // call site needs to change this release. requiresHumanReview carries the
  // extra nuance for anything that wants to check it.
  let deploymentStatus;
  if(assignment.status === 'BLOCKED') deploymentStatus = 'BLOCKED';
  else if(assignment.status === 'HOLD') deploymentStatus = 'HOLD';
  else if(assignment.status === 'EXPIRING_SOON') deploymentStatus = 'EXPIRING SOON';
  else deploymentStatus = 'READY'; // ASSIGNMENT_READY or HUMAN_REVIEW

  const mainBlocker = general.blockers[0] || assignment.failedChecks[0]
    || (assignment.reviewItems[0] && assignment.reviewItems[0].message) || general.warnings[0] || 'None';

  const warningsForDisplay = [...general.warnings, ...assignment.reviewItems.map(r=>r.message)];

  return {
    complianceStatus, passportStatus, deploymentStatus,
    score: perf.score, scoreBand: perf.band, scoreParts: perf.parts,
    blockers: general.blockers, warnings: warningsForDisplay,
    missingEvidence: general.missingEvidence, expiringItems: general.expiringItems,
    evidenceCompleteness: general.evidenceCompleteness,
    eligible: assignment.eligible, candidate: assignment.candidate, requiresHumanReview: assignment.requiresHumanReview,
    reviewItems: assignment.reviewItems,
    mainBlocker,
    requestChecks: deploymentRequirement ? { eligible: assignment.eligible, pass: assignment.passedChecks, fail: assignment.failedChecks } : null,
    generalReadiness: general, assignmentReadiness: assignment
  };
}

/* =========================================================
   RELEASE 0.2A — CORE DEPLOYMENT DOMAIN MODEL
   Contractor / Project / Site as first-class entities, plus the conservative
   migration of Client -> Contractor and worker.assignments[] -> legacy

/* ---- Public reference generation — same recovery-from-max pattern as
   Passport IDs, so a reload can never produce a colliding reference. ---- */
function nextPublicReference(type){
  referenceCounters[type] = (referenceCounters[type]||0) + 1;
  const n = String(referenceCounters[type]).padStart(6,'0');
  if(type==='contractor') return 'CTR-' + n;
  if(type==='project') return 'PRJ-' + n;
  if(type==='site') return 'STE-' + n;
  if(type==='assignment') return 'ASN-' + new Date().getFullYear() + '-' + n;
  if(type==='request') return 'REQ-' + new Date().getFullYear() + '-' + n;
  return n;
}
const REFERENCE_PATTERNS = {
  contractor: /^CTR-(\d+)$/, project: /^PRJ-(\d+)$/, site: /^STE-(\d+)$/, assignment: /^ASN-\d+-(\d+)$/, request: /^REQ-\d+-(\d+)$/
};
function assignReferencesIfMissing(list, type){
  let maxSeen = 0;
  list.forEach(item=>{
    const m = REFERENCE_PATTERNS[type].exec(item.publicReference||'');
    if(m) maxSeen = Math.max(maxSeen, parseInt(m[1],10));
  });
  referenceCounters[type] = Math.max(referenceCounters[type]||0, maxSeen);
  list.forEach(item=>{
    if(!item.publicReference) item.publicReference = nextPublicReference(type);
  });
}

/* ---- Legacy vs production Assignment invariant (Amendment 1) ----
   legacyRecord:true can ONLY be set by migrateEmbeddedAssignments() below —
   no create-path anywhere in this file, this release or any future one,
   may set it. This function is the single place that rule is enforced. */
function validateAssignment(a){
  if(a.legacyRecord === true){
    if(!a.workerId) return {valid:false, reason:'Legacy Assignment requires a workerId'};
    return {valid:true};
  }
  if(!a.workerId || !a.requestId || !a.contractorId || !a.projectId || !a.siteId){
    return {valid:false, reason:'Production Assignment requires workerId, requestId, contractorId, projectId and siteId'};
  }
  return {valid:true};
}

/* ---- Migration: Client -> Contractor (Amendment, Client->Contractor rule) ----
   Idempotent via a marker written onto the source Client record itself. */
function migrateClientsToContractors(){
  const created = [];
  clients.forEach(cl=>{
    if(cl._migratedToContractorId) return;
    const c = blankContractor();
    c.legalName = cl.name || '';
    c.sector = cl.sector || '';
    c.notes = cl.notes || '';
    c.preferredWorkerIds = (cl.preferredWorkerIds||[]).slice();
    c.excludedWorkerIds = (cl.excludedWorkerIds||[]).slice();
    c.standardTrainingRequirements = (cl.standardTrainingRequirements||[]).slice();
    c.standardCSCSRequired = !!cl.standardCSCSRequired;
    c.status = 'PROSPECT'; // conservative — never auto-approved/active from a bare Client record
    created.push(c);
    cl._migratedToContractorId = c.id;
  });
  contractors = contractors.concat(created);
  return created.length;
}

/* ---- Migration: worker.assignments[] -> legacy Assignment (Amendment 2) ----
   Preserves every listed field verbatim. Never infers COMPLETED or any other
   lifecycle conclusion from attendance — status is uniformly LEGACY_RECORDED,
   a value that sits outside the production Assignment lifecycle entirely. */
function migrateEmbeddedAssignments(){
  const created = [];
  const existingIds = new Set(assignmentEntities.map(ae=>ae.id));
  workers.forEach(w=>{
    (w.assignments||[]).forEach(a=>{
      if(existingIds.has(a.id)) return; // idempotent — already migrated
      const ae = blankAssignmentEntity();
      ae.id = a.id; // preserve the original id exactly
      ae.legacyRecord = true;
      ae.migrationReviewRequired = true;
      ae.status = 'LEGACY_RECORDED';
      ae.workerId = w.id;
      ae.requestId = null; ae.contractorId = null; ae.projectId = null; ae.siteId = null;
      ae.legacyProjectLabel = a.project || '';
      ae.legacyClientText = a.client || '';
      ae.legacyDeploymentId = a.deploymentId || '';
      ae.date = a.date || '';
      ae.attended = (a.attended===undefined ? null : a.attended);
      ae.late = !!a.late;
      ae.noShow = !!a.noShow;
      ae.rating = (a.rating===undefined ? null : a.rating);
      ae.rehireDecision = a.rehireDecision || '';
      ae.disputeNote = a.disputeNote || '';
      ae.clientFeedback = a.clientFeedback || '';
      ae.supervisorFeedback = a.supervisorFeedback || '';
      ae.issueRecorded = !!a.issueRecorded;
      ae.outcome = a.outcome || '';
      created.push(ae);
      existingIds.add(ae.id);
    });
  });
  assignmentEntities = assignmentEntities.concat(created);
  return created.length;
}

/* ---- Migration safety wrapper (Amendment 4) ----
   ID + version stamp, pre-migration backup, IN_PROGRESS -> COMPLETED/FAILED,
   validation gate before anything is persisted. Idempotent: a second call
   after a COMPLETED run is a no-op. */
async function runRelease02aMigration(){
  const migrationId = 'release-0.2a';
  const already = migrationLog.find(m=>m.migrationId===migrationId && m.status==='COMPLETED');
  if(already) return { skipped:true, entry: already };

  const startedAt = new Date().toISOString();
  await Storage.set('migrationBackups:'+migrationId, {
    schemaVersion: SCHEMA_VERSION,
    capturedAt: startedAt,
    clients: JSON.parse(JSON.stringify(clients)),
    workers: JSON.parse(JSON.stringify(workers))
  });

  let entry = { migrationId, version: SCHEMA_VERSION, startedAt, status:'IN_PROGRESS' };
  migrationLog = migrationLog.filter(m=>m.migrationId!==migrationId).concat([entry]);
  await persistMigrationLog();

  let contractorsCreated = 0, assignmentsCreated = 0, failureReason = null;
  try{
    contractorsCreated = migrateClientsToContractors();
    assignmentsCreated = migrateEmbeddedAssignments();

    // References must exist before validation checks for them — assigning
    // them is part of making a migrated record complete, not a separate
    // later step. (Existing/pre-migration contractors, projects, sites and
    // assignments already have theirs from a prior run.)
    assignReferencesIfMissing(contractors, 'contractor');
    assignReferencesIfMissing(projects, 'project');
    assignReferencesIfMissing(sites, 'site');
    assignReferencesIfMissing(assignmentEntities, 'assignment');

    const migrationIssues = runDeploymentDomainIntegrityCheck();
    if(migrationIssues.length) failureReason = 'Integrity validation found issues: ' + migrationIssues.join('; ');
  } catch(e){
    failureReason = 'Migration threw an error: ' + e.message;
  }

  if(failureReason){
    entry = Object.assign({}, entry, {status:'FAILED', result:failureReason, completedAt:new Date().toISOString()});
    migrationLog = migrationLog.filter(m=>m.migrationId!==migrationId).concat([entry]);
    await persistMigrationLog();
    // Nothing new was persisted yet — reset in-memory state to pre-attempt so
    // a failed run is fully inert, not half-adopted.
    contractors = [];
    assignmentEntities = assignmentEntities.filter(a=>!a.legacyRecord);
    clients.forEach(cl=>{ delete cl._migratedToContractorId; });
    return { skipped:false, failed:true, reason:failureReason };
  }

  entry = Object.assign({}, entry, {status:'COMPLETED', result:'success', completedAt:new Date().toISOString(), contractorsCreated, assignmentsCreated});
  migrationLog = migrationLog.filter(m=>m.migrationId!==migrationId).concat([entry]);

  await persistContractors();
  await persistProjects();
  await persistSites();
  await persistAssignmentEntities();
  await persistClients();
  await persistMeta();
  await persistMigrationLog();

  return { skipped:false, failed:false, contractorsCreated, assignmentsCreated };
}

/* ---- Relationship invariants (Section N) — same validator-function
   pattern as validateAssignment() in 0.2A. ---- */
function validateWorkforceRequest(req){
  if(!req.contractorId || !contractors.some(c=>c.id===req.contractorId)) return {valid:false, reason:'WorkforceRequest requires a valid contractorId'};
  const project = projects.find(p=>p.id===req.projectId);
  if(!project) return {valid:false, reason:'WorkforceRequest requires a valid projectId'};
  if(project.contractorId !== req.contractorId) return {valid:false, reason:'Project does not belong to the same Contractor as this Request'};
  const site = sites.find(s=>s.id===req.siteId);
  if(!site) return {valid:false, reason:'WorkforceRequest requires a valid siteId'};
  if(site.projectId !== req.projectId || site.contractorId !== req.contractorId) return {valid:false, reason:'Site does not belong to the selected Project and Contractor'};
  return {valid:true};
}
function validateMatch(m){
  if(!m.requestId || !workforceRequests.some(r=>r.id===m.requestId)) return {valid:false, reason:'Match requires a valid requestId'};
  if(!m.workerId || !workers.some(w=>w.id===m.workerId)) return {valid:false, reason:'Match requires a valid workerId'};
  return {valid:true};
}

/* ---- Site + Request requirement composition (Section E) ----
   Copies, never links — a later Site edit never retroactively changes a
   Request that already inherited from it. Conflicts are surfaced, never
   silently resolved. */
function inheritSiteRequirements(site, request){
  (site.requirements||[]).forEach(sr=>{
    const rr = blankRequestRequirement();
    rr.requestId = request.id;
    rr.requirementType = sr.requirementType;
    rr.value = sr.requirementValue;
    rr.mandatory = sr.mandatory;
    rr.source = 'SITE';
    rr.notes = sr.notes;
    rr.effectiveFrom = sr.effectiveFrom;
    rr.effectiveTo = sr.effectiveTo;
    request.requirements.push(rr);
  });
}
// Single source of truth for conflict detection. Returns full detail;
// detectRequirementConflicts() below is a thin boolean wrapper kept for the
// existing 0.2B call/test pattern that only checks truthiness.
function detectRequirementConflictDetails(requirements){
  const conflicts = [];
  const byType = {};
  requirements.forEach(r=>{
    if(!byType[r.requirementType]) byType[r.requirementType] = [];
    byType[r.requirementType].push(r);
  });
  Object.keys(byType).forEach(type=>{
    const group = byType[type];
    const siteRows = group.filter(r=>r.source==='SITE');
    const requestRows = group.filter(r=>r.source==='REQUEST');
    siteRows.forEach(sr=>{
      requestRows.forEach(rr=>{
        if(sr.mandatory !== rr.mandatory || sr.value !== rr.value){
          conflicts.push({ requirementType:type, siteRequirementId:sr.id, requestRequirementId:rr.id,
            reason:`${type} requirement conflicts between Site ("${sr.value}", mandatory:${sr.mandatory}) and Request ("${rr.value}", mandatory:${rr.mandatory}) sources` });
        }
      });
    });
  });
  return conflicts; // both rows are always kept regardless — this only reports what's conflicting
}
function detectRequirementConflicts(requirements){
  return detectRequirementConflictDetails(requirements).length > 0;
}

/* ---- Deterministic requirement evaluation (Locked Decisions 1 & 2) ----
   TRADE and SECTOR_EXPERIENCE are handled by requirementsFromRequest() below,
   via the frozen evaluateAssignmentReadiness(). Everything else is evaluated
   here, with its own explicit, non-interchangeable rule per type. */
function evaluateRequirement(worker, req){
  if(req.requirementType === 'CARD'){
    // RC3 corrective patch: the previous version evaluated every CARD
    // requirement against worker.cscs regardless of req.value, meaning a
    // valid CSCS could incorrectly satisfy an IPAF/PASMA/other card
    // requirement. Only a requirement that clearly names CSCS is
    // authoritatively evaluable against worker.cscs — no other card type
    // has a structured evidence source in the current worker schema, so
    // those return REVIEW_REQUIRED rather than a fabricated PASS or FAIL.
    const isCSCS = /cscs/i.test(req.value||'');
    if(isCSCS){
      const cscsOk = worker.cscs.status==='valid' && !!worker.cscs.evidenceReference && expiryBand(worker.cscs.expiryDate)!=='expired';
      return cscsOk
        ? {result:'PASS', reason:'CSCS is valid and evidenced'}
        : {result:'FAIL', reason:`CSCS requirement not met (status: ${worker.cscs.status})`};
    }
    return {result:'REVIEW_REQUIRED', reason:`CARD requirement "${req.value}" has no authoritative evidence source in the current worker schema — cannot be confirmed or ruled out automatically`};
  }
  if(req.requirementType === 'TRAINING'){
    const cert = (worker.trainingCertificates||[]).find(c=>c.name===req.value);
    const ok = cert && certificateIsCurrentlyValid(cert);
    return ok
      ? {result:'PASS', reason:`${req.value} is verified and current`}
      : {result:'FAIL', reason:`${req.value} is missing, unverified, or expired`};
  }
  if(req.requirementType === 'QUALIFICATION'){
    const cert = (worker.trainingCertificates||[]).find(c=>c.name===req.value);
    if(cert && certificateIsCurrentlyValid(cert)) return {result:'PASS', reason:`${req.value} found and current`};
    return {result:'REVIEW_REQUIRED', reason:`${req.value} not found under this name — absence does not confirm the qualification is not held`};
  }
  if(req.requirementType==='CAPABILITY' || req.requirementType==='TOOLS' || req.requirementType==='TRANSPORT' || req.requirementType==='OTHER'){
    return {result:'REVIEW_REQUIRED', reason:`${req.requirementType} requirement "${req.value}" cannot be automatically verified against current worker evidence`};
  }
  return {result:'REVIEW_REQUIRED', reason:'Unrecognised requirement type'};
}

/* ---- Adapter into the frozen Release 0.1 engine (Section I) ----
   Only TRADE, SECTOR_EXPERIENCE and mandatory TRAINING map cleanly onto
   evaluateAssignmentReadiness()'s existing shape — nothing about that
   function changes; this only translates its input. */
function requirementsFromRequest(requirements){
  const trade = requirements.find(r=>r.requirementType==='TRADE');
  const trainingReqs = requirements.filter(r=>r.requirementType==='TRAINING' && r.mandatory);
  const sectorReqs = requirements.filter(r=>r.requirementType==='SECTOR_EXPERIENCE' && r.mandatory);
  return {
    tradeRequired: trade ? trade.value : '',
    requiredTraining: trainingReqs.map(r=>r.value),
    requiredSectorExperience: sectorReqs.map(r=>r.value)
  };
}

/* ---- The matching engine (Section H, Q) ----
   Deterministic. Stage 1 (mandatory eligibility) -> Stage 2 (preferred,
   never blocking) -> Stage 3 (human review flags). Every generation is
   immutable once created; a rerun adds a new one, never edits the old. */
function generateMatchesForRequest(request){
  const requirements = request.requirements || [];
  const adapterReqs = requirementsFromRequest(requirements.filter(r=>r.mandatory));
  const customTypes = ['CARD','QUALIFICATION','CAPABILITY','TOOLS','TRANSPORT','OTHER'];

  // RC3 corrective patch: an unresolved Site/Request conflict must
  // propagate into matching, not sit as an informational dead end.
  // Neither source is silently preferred — both rows stay exactly as
  // given; this only decides whether the request and every Match against
  // it are flagged for review.
  const requirementConflicts = detectRequirementConflictDetails(requirements);
  request.reviewRequired = requirementConflicts.length > 0;

  const priorGenerations = matchGenerations.filter(g=>g.requestId===request.id);
  const generationNumber = 1 + priorGenerations.reduce((max,g)=>Math.max(max,g.generationNumber),0);
  const generation = blankMatchGeneration();
  generation.requestId = request.id;
  generation.generationNumber = generationNumber;
  generation.requirementsSnapshot = JSON.parse(JSON.stringify(requirements));
  matchGenerations.push(generation);

  const newMatches = [];
  workers.forEach(w=>{
    const readiness = evaluateAssignmentReadiness(w, adapterReqs);
    const factors = [];
    let hasCustomMandatoryFail = false;
    let hasReviewRequired = false;

    // General Readiness — one factor per blocker, or one PASS summary if clean.
    if(readiness.generalReadiness.blockers.length){
      readiness.generalReadiness.blockers.forEach(b=>factors.push({factorType:'GENERAL_READINESS', mandatory:true, result:'FAIL', reason:b, source:'GENERAL', value:null}));
    } else {
      factors.push({factorType:'GENERAL_READINESS', mandatory:true, result:'PASS', reason:'Compliance gates cleared', source:'GENERAL', value:null});
    }
    // Trade/sector/training/availability, as already explained by the frozen engine.
    readiness.failedChecks.forEach(f=>factors.push({factorType:'ASSIGNMENT_REQUIREMENT', mandatory:true, result:'FAIL', reason:f, source:'REQUEST', value:null}));
    readiness.passedChecks.forEach(p=>factors.push({factorType:'ASSIGNMENT_REQUIREMENT', mandatory:true, result:'PASS', reason:p, source:'REQUEST', value:null}));
    // Performance Evidence review flags (Release 0.1's own HUMAN_REVIEW reasons).
    // --- Release 0.2B corrective patch (RC1 review) ---
    // The frozen Release 0.1 contract treats evidence-pack completeness as
    // informational only — readiness.requiresHumanReview is the authoritative
    // signal, driven solely by LIMITED_PERFORMANCE_EVIDENCE/PERFORMANCE_REVIEW.
    // This loop previously promoted EVERY reviewItems entry (including a bare
    // EVIDENCE_INCOMPLETE note) into a REVIEW_REQUIRED factor and set
    // hasReviewRequired, silently widening Release 0.1's own rule. Patched to
    // only do that for the two genuine review-triggering types; anything else
    // (EVIDENCE_INCOMPLETE) stays visible as an INFORMATIONAL factor and never
    // contributes to eligibility.
    readiness.reviewItems.forEach(ri=>{
      if(ri.type==='LIMITED_PERFORMANCE_EVIDENCE' || ri.type==='PERFORMANCE_REVIEW'){
        factors.push({factorType:'PERFORMANCE_EVIDENCE', mandatory:false, result:'REVIEW_REQUIRED', reason:ri.message, source:'GENERAL', value:null});
        hasReviewRequired = true;
      } else {
        factors.push({factorType:'PERFORMANCE_EVIDENCE', mandatory:false, result:'INFORMATIONAL', reason:ri.message, source:'GENERAL', value:null});
      }
    });

    // Custom-evaluated requirement types — never touch evaluateAssignmentReadiness().
    requirements.filter(r=>customTypes.includes(r.requirementType)).forEach(r=>{
      const ev = evaluateRequirement(w, r);
      factors.push({factorType:r.requirementType, mandatory:r.mandatory, result:ev.result, reason:ev.reason, source:r.source||'REQUEST', value:r.value});
      if(ev.result==='REVIEW_REQUIRED') hasReviewRequired = true;
      if(ev.result==='FAIL' && r.mandatory) hasCustomMandatoryFail = true;
    });
    // Preferred TRAINING — evaluated for explanation, never blocking.
    requirements.filter(r=>r.requirementType==='TRAINING' && !r.mandatory).forEach(r=>{
      const ev = evaluateRequirement(w, r);
      factors.push({factorType:'TRAINING', mandatory:false, result:ev.result, reason:ev.reason, source:r.source||'REQUEST', value:r.value});
    });

    // RC3: an unresolved Site/Request conflict is never blocking on its own
    // — it flags for review, same as any other genuine uncertainty. Both
    // requirement rows are already preserved untouched (Section E); this
    // only adds the explainable factor and the review trigger.
    requirementConflicts.forEach(c=>{
      factors.push({factorType:'REQUIREMENT_CONFLICT', mandatory:false, result:'REVIEW_REQUIRED', reason:c.reason, source:'CONFLICT', value:c.requirementType});
      hasReviewRequired = true;
    });

    // Final eligibility: a custom mandatory FAIL behaves exactly like the
    // frozen engine's own BLOCKED — never overridden by anything else.
    const finalBlocked = (readiness.status==='BLOCKED') || hasCustomMandatoryFail;
    const finalHold = !finalBlocked && (readiness.status==='HOLD');
    const finalReview = !finalBlocked && !finalHold && (readiness.requiresHumanReview || hasReviewRequired);

    let eligibility;
    if(finalBlocked) eligibility='BLOCKED';
    else if(finalHold) eligibility='HOLD';
    else if(finalReview) eligibility='HUMAN_REVIEW';
    else eligibility=readiness.status;

    const match = blankMatch();
    match.requestId = request.id; match.workerId = w.id; match.generationId = generation.id;
    match.eligibility = eligibility; match.rulesVersion = MATCHING_RULES_VERSION;
    match.generatedAt = generation.generatedAt;
    match.matchFactors = factors.map(f=>Object.assign(blankMatchFactor(), f));
    newMatches.push(match);
  });

  matches = matches.concat(newMatches);
  request.status = 'MATCHING';
  return { generation, matches: newMatches };
}
// Derives eligible/candidate/requiresHumanReview from the single stored
// eligibility field — kept out of the Match schema itself, which stays
// exactly as locked in Section F, rather than adding fields beyond what
// was approved.
function matchEligibilityFlags(eligibility){
  if(eligibility==='BLOCKED') return {eligible:false, candidate:false, requiresHumanReview:false};
  if(eligibility==='HOLD') return {eligible:false, candidate:true, requiresHumanReview:false};
  if(eligibility==='HUMAN_REVIEW') return {eligible:true, candidate:true, requiresHumanReview:true};
  return {eligible:true, candidate:true, requiresHumanReview:false}; // ASSIGNMENT_READY or EXPIRING_SOON
}

/* =========================================================
   RELEASE 0.3-A — EVIDENCE PROVENANCE LAYER
   A single generic evidence record, reused across every category the
   brief named (identity, RTW, CSCS, training, skill, compliance, project
   history) AND attendance (Decision 2 — folded in here, never a separate
   attendanceEvents store) and performance validation (Decision 7 — feeds
   the SAME facts performanceEvidence() already reads, never a second,
   divergent score input). Nothing here touches the frozen readiness
   engine — this is a record of evidence, not a compliance decision.
   ========================================================= */
function blankEvidenceRecord(){
  return {
    id: uid(), subjectType:'', subjectId:'', category:'',
    sourceType:'', sourceRecordId:'',
    verifierName:'', verifierRole:'', verificationMethod:'',
    eventDate:'', verifiedDate:'', expiryDate:'',
    status:'pending', // verified | pending | disputed | expired | revoked
    outcomeValue:'', // attendance category only: attended | late | no_show | excused | not_recorded
    note:'', fileReference:'', confidenceLevel:'',
    provenanceFlag:'', // '' | 'SELF_ATTESTED_REVIEW_REQUIRED' | 'INSUFFICIENT'
    disputeNote:'', disputeStatus:'',
    correctionHistory:[], // corrections are appended, never overwrite the original
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };
}
function normaliseEvidenceRecord(e){
  e = e || {};
  return {
    id: e.id || uid(), subjectType: e.subjectType||'', subjectId: e.subjectId||'', category: e.category||'',
    sourceType: e.sourceType||'', sourceRecordId: e.sourceRecordId||'',
    verifierName: e.verifierName||'', verifierRole: e.verifierRole||'', verificationMethod: e.verificationMethod||'',
    eventDate: e.eventDate||'', verifiedDate: e.verifiedDate||'', expiryDate: e.expiryDate||'',
    status: e.status||'pending', outcomeValue: e.outcomeValue||'',
    note: e.note||'', fileReference: e.fileReference||'', confidenceLevel: e.confidenceLevel||'',
    provenanceFlag: e.provenanceFlag||'', disputeNote: e.disputeNote||'', disputeStatus: e.disputeStatus||'',
    correctionHistory: (e.correctionHistory||[]).slice(),
    createdAt: e.createdAt || new Date().toISOString(), updatedAt: e.updatedAt || new Date().toISOString()
  };
}

/* ---- Self-attestation (Decision 8) — a warning label only, never proof of
   identity, never an automatic rejection. Normalises case, surrounding
   whitespace, and repeated internal spaces before comparing. ---- */
function normaliseNameForComparison(s){
  return (s||'').toLowerCase().trim().replace(/\s+/g,' ');
}
function checkSelfAttestation(verifierName, worker){
  const v = normaliseNameForComparison(verifierName);
  if(!v) return 'INSUFFICIENT';
  const full = normaliseNameForComparison(worker.identity.fullName);
  const preferred = normaliseNameForComparison(worker.identity.preferredName);
  if(v === full || (preferred && v === preferred)) return 'SELF_ATTESTED_REVIEW_REQUIRED';
  return '';
}
function selfAttestationLabel(flag){
  if(flag==='SELF_ATTESTED_REVIEW_REQUIRED') return 'Potential self-attestation — human review required';
  if(flag==='INSUFFICIENT') return 'Verifier not identified — provenance insufficient';
  return '';
}

/* ---- Creation and dispute — the only two ways an EvidenceRecord changes.
   Creation runs the self-attestation check automatically for WORKER-subject
   records. Dispute never deletes or edits the original fact; it appends a
   correction entry and updates status only. ---- */
function createEvidenceRecord(params){
  const rec = blankEvidenceRecord();
  Object.assign(rec, params);
  if(rec.subjectType === 'WORKER'){
    const worker = workers.find(w=>w.id===rec.subjectId);
    if(worker) rec.provenanceFlag = checkSelfAttestation(rec.verifierName, worker);
  }
  evidenceRecords.push(rec);
  return rec;
}
function disputeEvidenceRecord(record, disputedBy, note){
  record.correctionHistory.push({ timestamp:new Date().toISOString(), actor:disputedBy, previousStatus:record.status, newStatus:'disputed', reason:note||'' });
  record.status = 'disputed';
  record.disputeNote = note||'';
  record.disputeStatus = 'open';
  record.updatedAt = new Date().toISOString();
}
