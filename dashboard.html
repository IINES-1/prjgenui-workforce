<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PRJGENUI Workforce | Verified Workforce Operating System</title>
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png">

<!-- Supabase client library. Uncomment when you have your free database set up.
     Sign up at supabase.com, create a project, add a table called 'kv' with
     columns: key (text, primary key), value (jsonb). Then fill in DB_CONFIG
     below and set enabled to true. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="secrets.js"></script>
<style>
  @font-face{font-family:'Archivo';src:url('fonts/archivo.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap;}
  @font-face{font-family:'IBM Plex Sans';src:url('fonts/ibm-plex-sans.woff2') format('woff2');font-weight:100 700;font-style:normal;font-display:swap;}
  :root{
    --navy:#1F3A2E; --navy-dark:#14271E; --gold:#E8A33D; --gold-light:#FBE9C6; --steel:#7A9A7E; --steel-dark:#4D6A51; --steel-light:#DCE7DD; --steel-pale:#EEF3EE;
    --paper:#FAF9F6; --panel:#FFFFFF; --ink:#1C2029; --slate:#6B7280;
    --line:#E0DBD0; --ok:#2F7A4F; --ok-bg:#E7F3EC; --warn:#B8790A; --warn-bg:#FBF0DD;
    --watch:#3B6FA0; --watch-bg:#E8F0F8;
    --danger:#B23A2F; --danger-bg:#FBEAE8; --none-bg:#EFEEEA;
    --review:#5B3A8E; --review-bg:#EFE7F6;
    --display:'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  button{font-family:var(--sans);cursor:pointer;}
  input,select,textarea{font-family:var(--sans);}
  input:focus,select:focus,textarea:focus,button:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .top-rule{height:3px;background:var(--gold);}

  .prototype-notice{background:var(--navy-dark);color:#D3DED6;font-size:11.5px;text-align:center;padding:7px 14px;}

  header.topbar{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;}
  .brand .mark{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 1.5px var(--gold);flex:none;display:block;}
  .brand .sub{font-size:10.5px;color:#B5C4B9;font-weight:500;display:block;margin-top:1px;}
  nav.tabs{display:flex;gap:2px;flex-wrap:wrap;}
  nav.tabs button{background:transparent;border:none;color:#CBD8CF;padding:8px 11px;border-radius:var(--radius);font-size:13px;font-weight:500;transition:color 150ms ease,background 150ms ease;}
  nav.tabs button.active{background:rgba(255,255,255,0.12);color:#fff;}
  nav.tabs button:hover{color:#fff;}

  main{max-width:960px;margin:0 auto;padding:24px 20px 60px;}
  h1{font-family:var(--display);font-size:24px;font-weight:700;margin:0 0 4px;letter-spacing:-0.02em;}
  h2{font-family:var(--display);font-size:17px;font-weight:600;margin:0 0 10px;letter-spacing:-0.008em;}
  h3{font-family:var(--sans);font-size:14px;font-weight:600;margin:0 0 8px;}
  p.lead{color:var(--slate);font-size:14px;margin:0 0 20px;}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px;}
  .stat .n{font-family:var(--sans);font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-0.02em;color:var(--navy);}
  .stat .l{font-size:11.5px;color:var(--slate);margin-top:4px;}
  @media(max-width:640px){.stat-row{grid-template-columns:repeat(2,1fr);}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:20px;}
  .panel.dim{background:var(--paper);}
  .empty{text-align:center;padding:36px 20px;color:var(--slate);}
  .empty h3{color:var(--ink);margin-bottom:6px;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:2px;white-space:nowrap;}
  .badge.ok{background:var(--ok-bg);color:var(--ok);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.watch{background:var(--watch-bg);color:var(--watch);}
  .badge.danger{background:var(--danger-bg);color:var(--danger);}
  .badge.none{background:var(--none-bg);color:var(--slate);}
  .badge.gold{background:var(--gold-light);color:#865800;}
  .badge.review{background:var(--review-bg);color:var(--review);}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .toolbar input[type=text]{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;background:#fff;}
  .chip{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:6px 13px;font-size:13px;color:var(--slate);transition:background 150ms ease,color 150ms ease,border-color 150ms ease;}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .btn{border-radius:var(--radius);padding:9px 16px;font-size:14px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);transition:background 150ms ease,border-color 150ms ease;}
  .btn:hover{border-color:var(--slate);}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn.primary:hover{background:var(--navy-dark);}
  .btn.danger{color:var(--danger);}
  .btn.small{padding:5px 11px;font-size:12px;}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--slate);}

  .row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .row:last-child{border-bottom:none;}
  .row-main{flex:1;min-width:160px;}
  .row-main .name{font-weight:600;font-size:14px;}
  .row-main .sub{font-size:12px;color:var(--slate);}
  .row-badges{display:flex;gap:6px;flex-wrap:wrap;}
  .row-score{font-size:13px;font-weight:600;min-width:44px;text-align:right;}
  .row-score .u{display:block;font-size:10px;font-weight:400;color:var(--slate);}
  .passport-tag{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--slate);background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:1px 6px;}

  .alert-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .alert-row:last-child{border-bottom:none;}
  .alert-row .who{font-weight:600;}
  .alert-row .what{color:var(--slate);}
  .alert-row .action{font-size:11.5px;color:var(--slate);display:block;margin-top:1px;}

  form .field{margin-bottom:14px;}
  form label{display:block;font-size:12px;color:var(--slate);margin-bottom:5px;font-weight:600;}
  form .hint{font-size:11px;color:var(--slate);margin-top:4px;font-weight:400;}
  form input[type=text],form input[type=tel],form input[type=email],form input[type=date],form input[type=number],form select,form textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;background:#fff;color:var(--ink);
  }
  form textarea{min-height:56px;resize:vertical;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row.three{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:560px){.field-row,.field-row.three{grid-template-columns:1fr;}}

  .subsection{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;}
  .kicker{font-size:11px;color:var(--slate);font-weight:600;margin-bottom:4px;letter-spacing:0;}
  .sub-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px;padding:10px;background:var(--paper);border-radius:var(--radius);}
  @media(max-width:640px){.sub-row{grid-template-columns:1fr;}}
  .sub-row label{margin-bottom:3px;}
  .sub-row .btn{align-self:center;}

  .checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  @media(max-width:560px){.checkgrid{grid-template-columns:1fr;}}
  .checkgrid label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;color:var(--ink);}

  .form-actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);}

  .audit-item{font-size:12.5px;color:var(--slate);padding:6px 0;border-bottom:1px dashed var(--line);}
  .audit-item:last-child{border-bottom:none;}
  .audit-item b{color:var(--ink);}

  .score-breakdown{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
  .score-breakdown .part{display:flex;justify-content:space-between;font-size:12.5px;color:var(--slate);}
  .score-bar{background:var(--none-bg);border-radius:2px;height:6px;overflow:hidden;margin-top:2px;}
  .score-bar div{background:var(--steel);height:100%;}

  .search-summary{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
  .search-summary .big{font-family:var(--sans);font-size:28px;font-weight:800;color:var(--navy);letter-spacing:-0.02em;}
  .search-summary .small{font-size:13px;color:var(--slate);}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--radius);font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,0.2);z-index:999;opacity:0;transition:opacity 0.2s;pointer-events:none;}
  .toast.show{opacity:1;}
  .toast.danger{background:var(--danger);}

  footer.foot{max-width:960px;margin:0 auto;padding:0 20px 40px;text-align:center;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;}
  footer.foot button{font-size:11.5px;color:var(--slate);background:none;border:none;text-decoration:underline;}
  .callout{border:1px solid var(--line);background:var(--gold-light);border-radius:var(--radius);padding:10px 12px;font-size:12.5px;color:#6B5424;margin-bottom:16px;}
  .storage-tag{font-size:10.5px;color:var(--slate);}
  .action-group{margin-bottom:18px;}
  .action-group h3{font-size:12.5px;text-transform:none;color:var(--slate);letter-spacing:.02em;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line);}

  /* ---- 0.2C additions ---- */
  .breadcrumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--slate);margin-bottom:14px;flex-wrap:wrap;}
  .breadcrumb a{cursor:pointer;color:var(--steel-dark);text-decoration:none;}
  .breadcrumb a:hover{text-decoration:underline;}
  .breadcrumb .sep{color:var(--line);}
  .breadcrumb .current{color:var(--ink);font-weight:600;}

  .conflict-note{border:1px solid var(--gold);background:var(--gold-light);border-radius:var(--radius);padding:10px 12px;font-size:12.5px;color:#6B5424;margin-bottom:16px;}
  .conflict-note b{color:var(--navy-dark);}

  .snapshot-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;}
  .snapshot-card .snap-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .snapshot-card .snap-date{font-size:11.5px;color:var(--slate);}

  .stepper{display:flex;gap:0;flex-wrap:wrap;margin-bottom:16px;}
  .stepper .step{flex:1;min-width:80px;text-align:center;position:relative;padding:8px 4px;font-size:11.5px;color:var(--slate);}
  .stepper .step .dot{width:22px;height:22px;border-radius:50%;background:var(--none-bg);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:11px;font-weight:600;color:var(--slate);}
  .stepper .step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff;}
  .stepper .step.current .dot{background:var(--navy);border-color:var(--navy);color:#fff;}
  .stepper .step.review .dot{background:var(--review);border-color:var(--review);color:#fff;}
  .stepper .step:not(:last-child)::after{content:'';position:absolute;top:18px;right:-50%;width:100%;height:2px;background:var(--line);z-index:-1;}
  .stepper .step.done:not(:last-child)::after{background:var(--ok);}

  .timeline{border-left:2px solid var(--line);padding-left:16px;margin:8px 0;}
  .timeline .tl-item{position:relative;padding-bottom:14px;font-size:12.5px;color:var(--slate);}
  .timeline .tl-item:last-child{padding-bottom:0;}
  .timeline .tl-item::before{content:'';position:absolute;left:-21px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--steel);border:2px solid #fff;}
  .timeline .tl-item .tl-date{font-size:11px;color:var(--slate);}
  .timeline .tl-item .tl-label{color:var(--ink);font-weight:600;}

  .ref-tag{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--navy);background:var(--steel-pale);border:1px solid var(--steel-light);border-radius:2px;padding:1px 6px;}
  .match-factors{font-size:12px;color:var(--slate);margin-top:6px;}
  .match-factors .factor{display:inline-block;margin:2px 4px 2px 0;padding:2px 7px;border-radius:2px;font-size:11px;font-weight:600;}
  .match-factors .factor.pass{background:var(--ok-bg);color:var(--ok);}
  .match-factors .factor.fail{background:var(--danger-bg);color:var(--danger);}
  .match-factors .factor.review{background:var(--review-bg);color:var(--review);}
</style>
</head>
<body>

<div class="top-rule"></div>
<div class="prototype-notice">Prototype environment. Data is stored in this browser only. Do not use as the sole legal compliance record.</div>

<header class="topbar">
  <div class="brand"><img class="mark" src="images/brand/crane-mark-96.png" srcset="images/brand/crane-mark-96.png 1x, images/brand/crane-mark-192.png 2x" width="44" height="44" alt=""><span>PRJGENUI Workforce<span class="sub" id="storageTag">Verified Workforce Operating System</span></span></div>
  <nav class="tabs" id="tabs">
    <button data-view="dashboard">Dashboard</button>
    <button data-view="workers">Workers</button>
    <button data-view="compliance">Compliance</button>
    <button data-view="crews">Crews</button>
    <button data-view="contractors">Contractors</button>
    <button data-view="requests">Requests</button>
    <button data-view="assignments">Assignments</button>
  </nav>
</header>

<main id="app"></main>

<footer class="foot">
  <button id="initEasbergBtn">Initialise Easberg pilot</button>
  <button id="integrityCheckBtn">Run integrity check</button>
  <button id="exportBtn">Export data</button>
  <button id="importBtn">Import data</button>
  <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
  <button id="resetBtn">Clear all data</button>
</footer>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIG — Schema v7 (Release 0.2C)
   ========================================================= */
const SCHEMA_VERSION = 7;
const READINESS_RULES_VERSION = '0.1';
const MATCHING_RULES_VERSION = '0.1';
const DB_NAME = 'prjgenui-workforce';
const DB_VERSION = 1;
const STORE_NAME = 'kv';
const W_KEY = 'workers';
const C_KEY = 'crews';
const CL_KEY = 'clients';           // legacy — kept for migration source
const META_KEY = 'meta';
const CTR_KEY = 'contractors';
const PRJ_KEY = 'projects';
const STE_KEY = 'sites';
const ASN_KEY = 'assignmentEntities';
const MIGRATIONS_KEY = 'migrations';
const WFR_KEY = 'workforceRequests';
const MG_KEY = 'matchGenerations';
const MATCH_KEY = 'matches';
const OFFER_KEY = 'assignmentOffers';
const SNAPSHOT_KEY = 'readinessSnapshots';

const CERT_OPTIONS = ['H&S Awareness','Working at height','Asbestos awareness','Manual handling','COSHH','PPE','RAMS Awareness','Fire Safety','First aid','Fire marshal'];
// The single authoritative source for universally-mandatory training and the
// performance evidence review threshold. Nothing else in the app should
// hardcode either of these.
// coreTrainingRequirements is empty by default: no certificate is assumed
// universally mandatory just by existing. Add certificate names here only
// when there's a genuine company-wide requirement.
const WORKFORCE_POLICY = {
  performanceEvidenceReviewThreshold: 70,
  coreTrainingRequirements: []
};
const SECTOR_OPTIONS = ['Education','Housing / residential','Commercial','Healthcare','Industrial','Occupied buildings'];
const AVAILABILITY_OPTIONS = ['To confirm','Available','Within 24h','Unavailable','Booked'];

/* =========================================================
   REMOTE DATABASE CONFIG
   ========================================================= */
const DB_CONFIG = {
  enabled: true,
  url: (window.PRJGENUI && window.PRJGENUI.supabaseUrl) || '',
  anonKey: (window.PRJGENUI && window.PRJGENUI.supabaseAnonKey) || ''
};

/* =========================================================
   STORAGE — Supabase primary, IndexedDB fallback, localStorage last resort.
   One abstraction used everywhere; nothing else touches
   indexedDB/localStorage directly.
   ========================================================= */
const Storage = (function(){
  let backend = null;
  let dbPromise = null;
  let supabaseClient = null;
  let changeHandler = function(){};
  function onBackendChange(){ try{ changeHandler(backend); }catch(e){} }

  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject)=>{
      if(!window.indexedDB){ reject(new Error('IndexedDB unavailable')); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
      req.onblocked = ()=> reject(new Error('IndexedDB blocked'));
    });
    return dbPromise;
  }

  async function idbGet(key){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = ()=> resolve(req.result === undefined ? null : req.result);
      req.onerror = ()=> reject(req.error);
    });
  }
  async function idbSet(key, value){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(value, key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
  }
  async function idbRemove(key){
    const db = await openDB();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
  }
  function lsGet(key){
    try{ const raw = localStorage.getItem('prjgenui:'+key); return raw===null ? null : JSON.parse(raw); }
    catch(e){ return null; }
  }
  function lsSet(key, value){
    try{ localStorage.setItem('prjgenui:'+key, JSON.stringify(value)); return true; }
    catch(e){ return false; }
  }
  function lsRemove(key){
    try{ localStorage.removeItem('prjgenui:'+key); return true; }
    catch(e){ return false; }
  }

  async function remoteGet(key){
    const { data, error } = await supabaseClient.from('kv').select('value').eq('key', key).single();
    if(error && error.code !== 'PGRST116') throw error;
    return data ? data.value : null;
  }
  async function remoteSet(key, value){
    const { error } = await supabaseClient.from('kv').upsert({ key, value });
    if(error) throw error;
    return true;
  }
  async function remoteRemove(key){
    const { error } = await supabaseClient.from('kv').delete().eq('key', key);
    if(error) throw error;
    return true;
  }

  return {
    async init(){
      if(DB_CONFIG.enabled && window.supabase){
        try{
          supabaseClient = window.supabase.createClient(DB_CONFIG.url, DB_CONFIG.anonKey);
          await remoteSet('__healthcheck', true);
          await remoteGet('__healthcheck');
          backend = 'supabase';
          return backend;
        }catch(e){
          console.warn('Supabase connection failed, falling back to local storage:', e);
          supabaseClient = null;
        }
      }
      try{
        await openDB();
        await idbSet('__healthcheck', true);
        await idbGet('__healthcheck');
        backend = 'indexeddb';
      }catch(e){
        backend = 'localstorage';
      }
      return backend;
    },
    backend(){ return backend; },
    onChange(fn){ changeHandler = fn; },
    async get(key){
      if(backend==='supabase'){
        try{ return await remoteGet(key); }
        catch(e){ console.warn('Supabase read error:', e); throw e; }
      }
      if(backend==='indexeddb'){
        try{ return await idbGet(key); }
        catch(e){ backend = 'localstorage'; onBackendChange(); return lsGet(key); }
      }
      return lsGet(key);
    },
    async set(key, value){
      if(backend==='supabase'){
        try{ return await remoteSet(key, value); }
        catch(e){ console.warn('Supabase write error:', e); throw e; }
      }
      if(backend==='indexeddb'){
        try{ return await idbSet(key, value); }
        catch(e){ backend = 'localstorage'; onBackendChange(); return lsSet(key, value); }
      }
      return lsSet(key, value);
    },
    async remove(key){
      if(backend==='supabase'){
        try{ return await remoteRemove(key); }
        catch(e){ console.warn('Supabase delete error:', e); throw e; }
      }

function uid(){
  if(typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7) + Math.random().toString(36).slice(2,7);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowLabel(){ return new Date().toLocaleString('en-GB', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date(todayStr() + 'T00:00:00');
  return Math.round((d - now) / 86400000);
}
function fmtDate(dateStr){
  if(!dateStr) return 'Not set';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function badge(status, label){ return `<span class="badge ${status}">${esc(label)}</span>`; }

/* =========================================================
   PASSPORT ID — permanent, sequential, human-facing.
   ========================================================= */
let passportCounter = 0;
function nextPassportId(){
  passportCounter += 1;
  return 'PW-UK-' + String(passportCounter).padStart(6,'0');
}
function assignPassportIdsIfMissing(){
  let maxSeen = 0;
  workers.forEach(w=>{
    const m = /PW-UK-(\d+)/.exec(w.identity.passportId||'');
    if(m) maxSeen = Math.max(maxSeen, parseInt(m[1],10));
  });
  passportCounter = Math.max(passportCounter, maxSeen);
  workers.forEach(w=>{
    if(!w.identity.passportId) w.identity.passportId = nextPassportId();
  });
}

/* =========================================================
   REFERENCE NUMBERS — public-facing sequential IDs for
   contractors, projects, sites, assignments, requests.
   ========================================================= */
let referenceCounters = {contractor:0, project:0, site:0, assignment:0, request:0};
function nextPublicReference(type){
  referenceCounters[type] = (referenceCounters[type]||0) + 1;
  const n = String(referenceCounters[type]).padStart(6,'0');
  if(type==='contractor') return 'CTR-' + n;
  if(type==='project') return 'PRJ-' + n;
  if(type==='site') return 'STE-' + n;
  if(type==='assignment') return 'ASN-' + new Date().getFullYear() + '-' + n;
  if(type==='request') return 'REQ-' + new Date().getFullYear() + '-' + n;
  return n;
}
function assignReferencesIfMissing(list, type){
  // Deterministic: highest existing numeric suffix first, so re-runs never collide.
  let maxSeen = 0;
  const prefix = {contractor:'CTR-',project:'PRJ-',site:'STE-',assignment:'ASN-',request:'REQ-'}[type] || '';
  list.forEach(item=>{
    if(item.publicReference){
      const m = /(\d+)$/.exec(item.publicReference);
      if(m) maxSeen = Math.max(maxSeen, parseInt(m[1],10));
    }
  });
  referenceCounters[type] = Math.max(referenceCounters[type]||0, maxSeen);
  list.forEach(item=>{
    if(!item.publicReference) item.publicReference = nextPublicReference(type);
  });
}

/* =========================================================
   EXPIRY ENGINE
   ========================================================= */
function expiryBand(dateStr){
  if(!dateStr) return 'none';
  const d = daysUntil(dateStr);
  if(d < 0) return 'expired';
  if(d <= 30) return 'warn';
  if(d <= 60) return 'watch';
  return 'current';
}
function expiryBadgeStatus(band){
  if(band==='expired') return 'danger';
  if(band==='warn') return 'warn';
  if(band==='watch') return 'watch';
  if(band==='current') return 'ok';
  return 'none';
}

/* =========================================================

   ========================================================= */
function evidenceCompleteness(w){
  const items = [];
  items.push({label:'Right to Work evidence', weight:25, met: !!w.rightToWork.evidenceNote});
  items.push({label:'CSCS Smart Check reference', weight:20, met: !!w.cscs.evidenceReference});

  const certs = w.trainingCertificates || [];
  if(certs.length){
    const withEvidence = certs.filter(c=>c.evidenceReference).length;
    items.push({label:'Training certificate evidence', weight:20, met:false, partial: withEvidence/certs.length});
  } else {
    items.push({label:'At least one training certificate on file', weight:20, met:false, partial:0});
  }

  items.push({label:'Competence assessment', weight:15, met: !!(w.tradeProfile.competenceEvidence || w.tradeProfile.competenceScore!==null)});
  items.push({label:'Recent proof-of-work record', weight:10, met: (w.proofOfWork||[]).some(p=>p.verified)});
  items.push({label:'Assignment history', weight:10, met: (w.assignments||[]).length>0});

  const totalWeight = items.reduce((s,i)=>s+i.weight,0);
  const earned = items.reduce((s,i)=> s + (i.met ? i.weight : (i.partial ? i.weight*i.partial : 0)), 0);
  const percent = Math.round(earned/totalWeight*100);
  const missing = items.filter(i=>!i.met && !(i.partial>=0.999)).map(i=>i.label);
  return {percent, missing};
}
function coreTrainingCurrent(w){
  const required = WORKFORCE_POLICY.coreTrainingRequirements || [];
  if(required.length===0) return true;
  return required.every(name=>{
    const cert = (w.trainingCertificates||[]).find(c=>c.name===name);
    return !!cert && certificateIsCurrentlyValid(cert);
  });
}
function certificateIsCurrentlyValid(c){
  return c.status === 'verified' && !!c.evidenceReference && expiryBand(c.expiryDate) !== 'expired';
}

/* =========================================================
   PERFORMANCE EVIDENCE ENGINE — weighted trust score.
   Replaces the old trustScore() function. Every call site
   that used trustScore() now calls performanceEvidence().
   ========================================================= */
const SCORE_WEIGHTS = { competence:0.20, reliability:0.20, clientFeedback:0.15 };

function performanceEvidence(w){
  const parts = [];
  const missingComponents = [];

  // Competence (weight 0.20): from competenceScore/20
  if(w.tradeProfile.competenceScore !== null && w.tradeProfile.competenceScore !== undefined && w.tradeProfile.competenceScore !== ''){
    parts.push({key:'competence', label:'Competence', weight:SCORE_WEIGHTS.competence, value: Math.max(0,Math.min(20,Number(w.tradeProfile.competenceScore)))/20});
  } else {
    missingComponents.push('Competence');
  }

  // Reliability (weight 0.20): attended rate + rehire rate from assignments
  const assignments = w.assignments || [];
  if(assignments.length){
    const attendedRate = assignments.filter(a=>a.attended && !a.noShow).length / assignments.length;
    const decided = assignments.filter(a=>a.rehireDecision==='yes'||a.rehireDecision==='no');
    const rehireRate = decided.length ? decided.filter(a=>a.rehireDecision==='yes').length/decided.length : null;
    parts.push({key:'reliability', label:'Reliability', weight:SCORE_WEIGHTS.reliability, value: rehireRate===null ? attendedRate : (attendedRate+rehireRate)/2});
  } else {
    missingComponents.push('Reliability');
  }

  // Client feedback (weight 0.15): average rating/5 from rated assignments
  const rated = assignments.filter(a=>a.rating);
  if(rated.length){
    const avg = rated.reduce((s,a)=>s+Number(a.rating),0)/rated.length;
    parts.push({key:'clientFeedback', label:'Client feedback', weight:SCORE_WEIGHTS.clientFeedback, value: avg/5});
  } else {
    missingComponents.push('Client feedback');
  }

  const totalWeight = parts.reduce((s,p)=>s+p.weight,0);
  const score = totalWeight>0 ? Math.round(parts.reduce((s,p)=>s+p.value*p.weight,0)/totalWeight*100) : null;

  // Confidence labels
  let confidence;
  if(assignments.length >= 10) confidence = 'High confidence';
  else if(assignments.length >= 3) confidence = 'Building evidence';
  else confidence = 'Limited evidence';

  return {
    score,
    band: score===null ? 'Insufficient data' : scoreBand(score),
    confidence,
    parts: parts.map(p=>({label:p.label, pct:Math.round(p.value*100)})),
    missingComponents
  };
}
function scoreBand(score){
  if(score>=90) return 'Exceptional';
  if(score>=80) return 'Strong';
  if(score>=70) return 'Deployment Ready';
  if(score>=60) return 'Developing';
  return 'Hold / Review';
}
function scoreBreakdownHtml(sc){
  if(sc.score===null) return '<p class="hint">Insufficient data. No performance evidence recorded yet.</p>';
  return `<div class="score-breakdown">${sc.parts.map(p=>`
    <div>
      <div class="part"><span>${esc(p.label)}</span><span>${p.pct}%</span></div>
      <div class="score-bar"><div style="width:${p.pct}%;"></div></div>
    </div>`).join('')}
    ${sc.missingComponents && sc.missingComponents.length ? `<p class="hint" style="margin-top:6px;">Not yet scored: ${sc.missingComponents.join(', ')} (no data recorded).</p>` : ''}
    ${sc.confidence ? `<p class="hint" style="margin-top:4px;">Evidence confidence: ${esc(sc.confidence)}.</p>` : ''}
  </div>`;
}

/* =========================================================
   SPLIT READINESS ENGINE (0.2C)
   Three functions + a backward-compatible wrapper.
   ========================================================= */

/* --- General readiness: pure compliance pass/blocked --- */
function evaluateGeneralReadiness(worker){
  const blockers = [];
  const warnings = [];
  const expiringItems = [];
  const reviewItems = [];

  // RTW checks
  const rtwBand = expiryBand(worker.rightToWork.expiryDate);
  if(worker.rightToWork.status !== 'verified'){
    blockers.push('Confirm Right to Work');
  } else if(!worker.rightToWork.evidenceNote){
    blockers.push('Right to Work verified but missing evidence');
  } else if(rtwBand==='expired'){
    blockers.push('Right to Work expired');
  } else if(rtwBand==='warn'){
    warnings.push('Right to Work expires within 30 days');
    expiringItems.push({item:'Right to Work', expiryDate:worker.rightToWork.expiryDate});
  } else if(rtwBand==='watch'){
    expiringItems.push({item:'Right to Work', expiryDate:worker.rightToWork.expiryDate});
  }

  // CSCS checks
  const cscsBand = expiryBand(worker.cscs.expiryDate);
  if(worker.cscs.status !== 'valid'){
    blockers.push('Confirm CSCS');
  } else if(!worker.cscs.evidenceReference){
    blockers.push('CSCS valid but missing evidence');
  } else if(cscsBand==='expired'){
    blockers.push('CSCS expired');
  } else if(cscsBand==='warn'){
    warnings.push('CSCS expires within 30 days');
    expiringItems.push({item:'CSCS', expiryDate:worker.cscs.expiryDate});
  } else if(cscsBand==='watch'){
    expiringItems.push({item:'CSCS', expiryDate:worker.cscs.expiryDate});
  }

  // Training certificate expiry bands (for valid certs)
  (worker.trainingCertificates||[]).forEach(c=>{
    if(!certificateIsCurrentlyValid(c)) return;
    const band = expiryBand(c.expiryDate);
    if(band==='warn'){
      warnings.push(`${c.name} expires within 30 days`);
      expiringItems.push({item:c.name, expiryDate:c.expiryDate});
    } else if(band==='watch'){
      expiringItems.push({item:c.name, expiryDate:c.expiryDate});
    }
  });

  // Core training requirements from policy
  (WORKFORCE_POLICY.coreTrainingRequirements||[]).forEach(name=>{
    const cert = (worker.trainingCertificates||[]).find(c=>c.name===name);
    if(!cert){
      blockers.push(`${name} required by workforce policy but not held`);
    } else if(!certificateIsCurrentlyValid(cert)){
      const reason = cert.status!=='verified' ? 'not verified' : (!cert.evidenceReference ? 'missing evidence' : 'expired');
      blockers.push(`${name} required by workforce policy: ${reason}`);
    }
  });

  // Evidence completeness as review item only (not a blocker)
  const ev = evidenceCompleteness(worker);
  if(ev.percent < 80) reviewItems.push(`Evidence pack below 80% complete (${ev.percent}%)`);

  // Determine status
  let status;
  const neverStarted = worker.rightToWork.status==='not_verified' && worker.cscs.status==='not_checked' && (worker.trainingCertificates||[]).length===0;
  if(neverStarted) status = 'NOT_VERIFIED';
  else if(blockers.length > 0) status = 'BLOCKED';
  else if(warnings.length > 0 || expiringItems.some(e=>expiryBand(e.expiryDate)==='warn')) status = 'EXPIRING_SOON';
  else status = 'GENERAL_READY';

  return {
    status,
    blockers,
    warnings,
    expiringItems,
    reviewItems,
    evidenceCompleteness: ev.percent,
    missingEvidence: ev.missing,
    evaluatedAt: new Date().toISOString(),
    rulesVersion: READINESS_RULES_VERSION
  };
}

/* --- Performance evidence: weighted trust score (wrapper) --- */
// performanceEvidence() is defined above; this section documents that it
// is the second pillar of the split readiness engine.

/* --- Assignment readiness: layers on top of general --- */
function evaluateAssignmentReadiness(worker, assignmentRequirements){
  const generalReadiness = evaluateGeneralReadiness(worker);
  const perf = performanceEvidence(worker);

  const passedChecks = [];
  const failedChecks = [];
  const warnings = [];
  const reviewItems = [];
  const req = assignmentRequirements || {};

  // Gate on general readiness
  if(generalReadiness.status === 'BLOCKED'){
    generalReadiness.blockers.forEach(b => failedChecks.push(b));
  } else if(generalReadiness.status === 'NOT_VERIFIED'){
    failedChecks.push('Worker not verified — complete RTW and CSCS checks');
  } else {
    passedChecks.push('Compliance gates cleared');
  }

  // Expiry warnings propagate
  if(generalReadiness.status === 'EXPIRING_SOON'){
    warnings.push('Some compliance items expiring soon');
    generalReadiness.expiringItems.forEach(e => warnings.push(`${e.item} due ${fmtDate(e.expiryDate)}`));
  }

  // Trade match
  const tradeOk = !req.tradeRequired || worker.tradeProfile.primaryTrade.toLowerCase().includes(req.tradeRequired.toLowerCase());
  if(req.tradeRequired){
    tradeOk ? passedChecks.push('Trade match') : failedChecks.push('Trade does not match');
  }

  // Sector experience
  if(req.requiredSectorExperience && req.requiredSectorExperience.length){
    const sectorOk = req.requiredSectorExperience.some(s => (worker.commercial.sectorExperience||[]).includes(s));
    sectorOk ? passedChecks.push('Sector experience match') : failedChecks.push('No matching sector experience');
  }

  // Required training
  if(req.requiredTraining && req.requiredTraining.length){
    const trainingOk = req.requiredTraining.every(t => {
      const cert = (worker.trainingCertificates||[]).find(c=>c.name===t);
      return !!cert && certificateIsCurrentlyValid(cert);
    });
    trainingOk ? passedChecks.push('Required training current') : failedChecks.push('Missing or expired required training');
  }

  // Required CSCS
  if(req.requiredCSCS){
    if(worker.cscs.status === 'valid' && certificateIsCurrentlyValid({...worker.cscs, status:'verified', evidenceReference: worker.cscs.evidenceReference || 'x'})){
      passedChecks.push('CSCS confirmed');
    } else if(worker.cscs.status === 'valid'){
      passedChecks.push('CSCS valid');
    } else {
      failedChecks.push('CSCS required but not valid');
    }
  }

  // Availability
  const avail = worker.commercial.availability;
  const availWorkable = avail && avail !== 'Unavailable' && avail !== 'Booked';
  if(!availWorkable){
    warnings.push(`Availability not confirmed as workable (${avail||'not set'})`);
  } else {
    passedChecks.push('Availability confirmed');
  }

  // Performance evidence can trigger HUMAN_REVIEW but never BLOCKED
  const assignments = worker.assignments || [];
  const isNewWorker = assignments.length === 0;
  const perfBelowThreshold = perf.score !== null && perf.score < WORKFORCE_POLICY.performanceEvidenceReviewThreshold;

  let requiresHumanReview = false;

  if(isNewWorker){
    requiresHumanReview = true;
    reviewItems.push('LIMITED_PERFORMANCE_EVIDENCE — new worker with 0 assignments');
  } else if(perfBelowThreshold){
    requiresHumanReview = true;
    reviewItems.push(`Performance evidence below review threshold (${perf.score}% < ${WORKFORCE_POLICY.performanceEvidenceReviewThreshold}%)`);
  }

  // General readiness review items propagate
  generalReadiness.reviewItems.forEach(r => reviewItems.push(r));

  // Determine assignment status
  let status;
  const hasBlockers = failedChecks.length > 0;

  if(generalReadiness.status === 'BLOCKED' || generalReadiness.status === 'NOT_VERIFIED'){
    status = 'BLOCKED';
  } else if(hasBlockers){
    status = 'BLOCKED';
  } else if(generalReadiness.status === 'EXPIRING_SOON'){
    status = 'EXPIRING_SOON';
  } else if(requiresHumanReview){
    status = 'HUMAN_REVIEW';
  } else if(!availWorkable){
    status = 'HOLD';
  } else {
    status = 'ASSIGNMENT_READY';
  }

  const eligible = status === 'ASSIGNMENT_READY' || status === 'EXPIRING_SOON';
  const candidate = !hasBlockers && generalReadiness.status !== 'NOT_VERIFIED';

  return {
    status,
    eligible,
    candidate,
    requiresHumanReview,
    passedChecks,
    failedChecks,
    warnings,
    reviewItems,
    generalReadiness,
    performanceScore: perf.score,
    performanceConfidence: perf.confidence
  };
}

/* --- Backward-compatible wrapper --- */
function evaluateWorkerReadiness(worker, deploymentRequirement){
  const generalReadiness = evaluateGeneralReadiness(worker);
  const perf = performanceEvidence(worker);
  const assignmentReadiness = deploymentRequirement
    ? evaluateAssignmentReadiness(worker, deploymentRequirement)
    : null;

  // Map to the old four-string vocabulary for existing UI
  let complianceStatus, passportStatus, deploymentStatus;

  passportStatus = generalReadiness.status === 'NOT_VERIFIED' ? 'NOT VERIFIED'
    : generalReadiness.status === 'BLOCKED' ? 'BLOCKED'
    : generalReadiness.status === 'EXPIRING_SOON' ? 'EXPIRING SOON'
    : 'VERIFIED';

  complianceStatus = generalReadiness.status === 'BLOCKED' ? 'BLOCKED'
    : generalReadiness.status === 'EXPIRING_SOON' ? 'EXPIRING SOON'
    : 'VERIFIED';

  if(assignmentReadiness){
    deploymentStatus = assignmentReadiness.status === 'BLOCKED' ? 'BLOCKED'
      : assignmentReadiness.status === 'HOLD' ? 'HOLD'
      : assignmentReadiness.status === 'HUMAN_REVIEW' ? 'HOLD'
      : assignmentReadiness.status === 'EXPIRING_SOON' ? 'EXPIRING SOON'
      : 'READY';
  } else {
    // Without a specific deployment requirement, use general + performance + availability
    const avail = worker.commercial.availability;
    const availWorkable = avail && avail !== 'Unavailable' && avail !== 'Booked' && avail !== 'To confirm';
    if(generalReadiness.status === 'BLOCKED' || generalReadiness.status === 'NOT_VERIFIED') deploymentStatus = 'BLOCKED';
    else if(!availWorkable) deploymentStatus = 'HOLD';
    else if(perf.score !== null && perf.score < WORKFORCE_POLICY.performanceEvidenceReviewThreshold) deploymentStatus = 'HOLD';
    else if(generalReadiness.status === 'EXPIRING_SOON') deploymentStatus = 'EXPIRING SOON';
    else deploymentStatus = 'READY';
  }

  const blockers = generalReadiness.blockers;
  const warnings = [...generalReadiness.warnings, ...generalReadiness.reviewItems];
  const expiringItems = generalReadiness.expiringItems;

  const mainBlocker = blockers[0]
    || (assignmentReadiness && assignmentReadiness.failedChecks[0])
    || (assignmentReadiness && assignmentReadiness.warnings[0])
    || warnings[0]
    || 'None';

  let eligible = deploymentStatus === 'READY' || deploymentStatus === 'EXPIRING SOON';
  let requestChecks = null;
  let requiresHumanReview = false;
  let reviewItems = generalReadiness.reviewItems;

  if(assignmentReadiness){
    eligible = assignmentReadiness.eligible;
    requiresHumanReview = assignmentReadiness.requiresHumanReview;
    reviewItems = [...reviewItems, ...assignmentReadiness.reviewItems];
    requestChecks = {
      eligible: assignmentReadiness.eligible,
      pass: assignmentReadiness.passedChecks,
      fail: assignmentReadiness.failedChecks
    };
  }

  return {
    complianceStatus,
    passportStatus,
    deploymentStatus,
    score: perf.score,
    scoreBand: perf.band,
    scoreParts: perf.parts,
    blockers,
    warnings,
    missingEvidence: generalReadiness.missingEvidence,
    expiringItems,
    evidenceCompleteness: generalReadiness.evidenceCompleteness,
    eligible,
    candidate: assignmentReadiness ? assignmentReadiness.candidate : eligible,
    requiresHumanReview,
    reviewItems,
    mainBlocker,
    requestChecks,
    generalReadiness,
    assignmentReadiness
  };
}

/* =========================================================
   MATCHING ENGINE
   ========================================================= */
function runMatchingEngine(request){
  const generation = blankMatchGeneration();
  generation.requestId = request.id;

  const candidates = workers.filter(w => {
    if(request.tradeRequired){
      return w.tradeProfile.primaryTrade.toLowerCase().includes(request.tradeRequired.toLowerCase());
    }
    return true;
  });

  const matches = candidates.map(w => {
    const assignmentReq = {
      tradeRequired: request.tradeRequired,
      requiredTraining: request.requiredTraining,
      requiredSectorExperience: request.requiredSectorExperience,
      requiredCSCS: request.requiredCSCS
    };
    const readiness = evaluateAssignmentReadiness(w, assignmentReq);
    const perf = performanceEvidence(w);

    const factors = [];
    readiness.passedChecks.forEach(c => factors.push({factor: c, result: 'PASS'}));
    readiness.failedChecks.forEach(c => factors.push({factor: c, result: 'FAIL'}));
    if(readiness.requiresHumanReview) factors.push({factor: 'Performance evidence review', result: 'REVIEW'});
    readiness.warnings.forEach(c => factors.push({factor: c, result: 'PASS'}));

    return {
      ...blankMatch(),
      generationId: generation.id,
      requestId: request.id,
      workerId: w.id,
      status: readiness.eligible ? (readiness.requiresHumanReview ? 'PROPOSED' : 'ACCEPTED') : 'REJECTED',
      factors,
      score: perf.score,
      eligible: readiness.eligible,
      requiresHumanReview: readiness.requiresHumanReview
    };
  });

  generation.matchCount = matches.length;
  generation.acceptedCount = matches.filter(m => m.status === 'ACCEPTED').length;
  generation.rejectedCount = matches.filter(m => m.status === 'REJECTED').length;

  return { generation, matches: matches.sort((a,b) => (b.score||0) - (a.score||0)) };
}

/* =========================================================
   MIGRATION SYSTEM (Release 0.2A)
   ========================================================= */
function migrateClientsToContractors(){
  let migrated = 0;
  clients.forEach(cl => {
    if(cl._migratedToContractorId) return; // already migrated
    const ctr = blankContractor();
    ctr.legalName = cl.name || '';
    ctr.tradingName = cl.name || '';
    ctr.sector = cl.sector || '';
    ctr.notes = cl.notes || '';
    ctr.preferredWorkerIds = cl.preferredWorkerIds || [];
    ctr.excludedWorkerIds = cl.excludedWorkerIds || [];
    ctr.standardTrainingRequirements = cl.standardTrainingRequirements || [];
    ctr.standardCSCSRequired = cl.standardCSCSRequired || false;
    ctr.status = 'ACTIVE';
    contractors.push(ctr);
    cl._migratedToContractorId = ctr.id;
    migrated++;
  });
  return migrated;
}

function migrateEmbeddedAssignments(){
  let migrated = 0;
  workers.forEach(w => {
    const assignments = w.assignments || [];
    if(assignments.length === 0) return;
    assignments.forEach(a => {
      const entity = blankAssignmentEntity();
      entity.legacyRecord = true;
      entity.migrationReviewRequired = true;
      entity.status = 'LEGACY_RECORDED';
      entity.workerId = w.id;
      entity.trade = w.tradeProfile.primaryTrade || '';
      entity.legacyProjectLabel = a.project || '';
      entity.legacyClientText = a.client || '';
      entity.legacyDeploymentId = a.deploymentId || '';
      entity.date = a.date || '';
      entity.startDate = a.date || '';
      entity.attended = a.attended !== false;
      entity.late = !!a.late;
      entity.noShow = !!a.noShow;
      entity.rating = a.rating || null;
      entity.rehireDecision = a.rehireDecision || '';
      entity.clientFeedback = a.clientFeedback || '';
      entity.supervisorFeedback = a.supervisorFeedback || '';
      entity.issueRecorded = !!a.issueRecorded;
      entity.outcome = a.outcome || '';
      // Try to match to existing contractor/project by name
      const projMatch = (a.project||'').toLowerCase();
      const matchedProject = projects.find(p => p.name.toLowerCase() === projMatch);
      if(matchedProject){
        entity.projectId = matchedProject.id;
        entity.contractorId = matchedProject.contractorId;
      }
      assignmentEntities.push(entity);
      migrated++;
    });
  });
  return migrated;
}

function runRelease02aMigration(){
  // Check if already completed
  const existing = migrationLog.find(m => m.release === '0.2A' && m.status === 'COMPLETED');
  if(existing){
    return { skipped: true, reason: 'Already completed' };
  }

  const entry = {
    id: uid(),
    release: '0.2A',
    status: 'IN_PROGRESS',
    startedAt: new Date().toISOString(),
    completedAt: null,
    clientsMigrated: 0,
    assignmentsMigrated: 0,
    errors: []
  };

  try {
    // Backup is implicit — the old client records are preserved with _migratedToContractorId markers
    entry.clientsMigrated = migrateClientsToContractors();
    entry.assignmentsMigrated = migrateEmbeddedAssignments();

    // Validation gate
    const integrityErrors = runDeploymentDomainIntegrityCheck();
    if(integrityErrors.length > 0){
      entry.errors = integrityErrors;
      entry.status = 'COMPLETED_WITH_WARNINGS';
    } else {
      entry.status = 'COMPLETED';
    }
    entry.completedAt = new Date().toISOString();
  } catch(e) {
    entry.status = 'FAILED';
    entry.errors = [e.message];
    entry.completedAt = new Date().toISOString();
  }

  migrationLog.push(entry);
  return { skipped: false, entry };
}

function runDeploymentDomainIntegrityCheck(){
  const errors = [];
  const workerIds = new Set(workers.map(w=>w.id));
  const contractorIds = new Set(contractors.map(c=>c.id));
  const projectIds = new Set(projects.map(p=>p.id));
  const siteIds = new Set(sites.map(s=>s.id));

  assignmentEntities.forEach(a => {
    if(!a.workerId) errors.push(`Assignment ${a.publicReference||a.id}: missing workerId`);
    else if(!workerIds.has(a.workerId)) errors.push(`Assignment ${a.publicReference||a.id}: workerId "${a.workerId}" does not match any worker`);
    if(a.contractorId && !contractorIds.has(a.contractorId)) errors.push(`Assignment ${a.publicReference||a.id}: contractorId does not match any contractor`);
    if(a.projectId && !projectIds.has(a.projectId)) errors.push(`Assignment ${a.publicReference||a.id}: projectId does not match any project`);
    if(a.siteId && !siteIds.has(a.siteId)) errors.push(`Assignment ${a.publicReference||a.id}: siteId does not match any site`);
  });

  return errors;
}

/* =========================================================
   COMPLIANCE ACTION CENTRE
   ========================================================= */
function buildActionCentre(){
  const critical = [], dueSoon = [], missingEv = [], devGaps = [];
  workers.forEach(w=>{
    const r = evaluateWorkerReadiness(w);
    r.blockers.forEach(b=>{
      critical.push({worker:w, issue:b, severity:'CRITICAL', action: actionForBlocker(b)});
    });
    r.expiringItems.forEach(e=>{
      dueSoon.push({worker:w, issue:`${e.item}, due ${fmtDate(e.expiryDate)}`, severity: expiryBand(e.expiryDate)==='warn'?'DUE SOON':'WATCH', action:`Renew ${e.item.toLowerCase()}`});
    });
    if(r.missingEvidence.length){
      missingEv.push({worker:w, issue: r.missingEvidence.join(', '), severity:'MISSING EVIDENCE', action:'Complete evidence pack'});
    }
    if(w.tradeProfile.competenceScore===null){
      devGaps.push({worker:w, issue:'Competence assessment needed', severity:'DEVELOPMENT', action:'Assess and record competence'});
    }
    if((w.proofOfWork||[]).length===0){
      devGaps.push({worker:w, issue:'No proof-of-work record yet', severity:'DEVELOPMENT', action:'Log first verified job'});
    }
  });
  return {critical, dueSoon, missingEv, devGaps};
}
function actionForBlocker(b){
  if(b.includes('Right to Work')) return 'Verify via share code, manual check or Employer Checking Service';
  if(b.includes('CSCS')) return 'Verify via CSCS Smart Check';
  if(b.includes('No training certificates')) return 'Add training certificates';
  if(b.includes('not verified')) return 'Mark verified once evidence is checked, not before';
  if(b.includes('available')) return 'Confirm availability';
  if(b.includes('expired')) return 'Renew and re-verify';
  return 'Review and resolve';
}

function renderDashboard(){
  const total = workers.length;
  const verified = workers.filter(w=>evaluateWorkerReadiness(w).passportStatus==='VERIFIED').length;
  const ready = workers.filter(w=>evaluateWorkerReadiness(w).deploymentStatus==='READY').length;
  const hold = workers.filter(w=>evaluateWorkerReadiness(w).deploymentStatus==='HOLD').length;
  const blocked = workers.filter(w=>evaluateWorkerReadiness(w).deploymentStatus==='BLOCKED').length;
  const expiring30 = workers.filter(w=>evaluateWorkerReadiness(w).expiringItems.some(e=>expiryBand(e.expiryDate)==='warn')).length;
  const ac = buildActionCentre();
  const openActions = ac.critical.length + ac.dueSoon.filter(d=>d.severity==='DUE SOON').length;

  if(total===0){
    return `
      <h1>Dashboard</h1>
      <p class="lead">Live readiness across your workforce, from one authoritative engine.</p>
      <div class="panel empty">
        <h3>No workers yet</h3>
        <p>Add your first worker to start building the Workforce Passport.</p>
        <button class="btn primary" id="emptyAddBtn" style="margin-top:8px;">Add a worker</button>
      </div>`;
  }

  const topReady = workers.filter(w=>evaluateWorkerReadiness(w).deploymentStatus==='READY')
    .sort((a,b)=>(performanceEvidence(b).score||0)-(performanceEvidence(a).score||0)).slice(0,5);

  return `
    <h1>Dashboard</h1>
    <p class="lead">Live readiness across your workforce, from one authoritative engine.</p>
    <div class="stat-row">
      <div class="stat"><div class="n">${total}</div><div class="l">Total workers</div></div>
      <div class="stat"><div class="n" style="color:var(--ok)">${verified}</div><div class="l">Passport verified</div></div>
      <div class="stat"><div class="n" style="color:var(--ok)">${ready}</div><div class="l">Deploy ready</div></div>
      <div class="stat"><div class="n" style="color:var(--danger)">${blocked}</div><div class="l">Blocked</div></div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="n" style="color:var(--warn)">${hold}</div><div class="l">On hold</div></div>
      <div class="stat"><div class="n" style="color:var(--watch)">${expiring30}</div><div class="l">Expiring &lt;30 days</div></div>
      <div class="stat"><div class="n">${crews.length}</div><div class="l">Active crews</div></div>
      <div class="stat"><div class="n">${contractors.length}</div><div class="l">Contractors</div></div>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <h2 style="margin-bottom:0;">Compliance Action Centre</h2>
        <button class="btn small" id="goComplianceBtn">Open full centre</button>
      </div>
      <p class="lead" style="margin-bottom:12px;">${openActions} open action${openActions===1?'':'s'} across the workforce.</p>
      ${renderActionGroup('Critical', ac.critical.slice(0,4), 'danger')}
      ${renderActionGroup('Due soon', ac.dueSoon.filter(d=>d.severity==='DUE SOON').slice(0,4), 'warn')}
      ${ac.critical.length===0 && ac.dueSoon.length===0 ? '<p style="color:var(--slate);font-size:13px;margin:0;">Nothing urgent right now.</p>' : ''}
    </div>

    <div class="panel">
      <h2>Top ready workers</h2>
      ${topReady.length===0 ? '<p style="color:var(--slate);font-size:13px;margin:0;">Nobody has cleared Deploy Ready yet.</p>' :
        topReady.map(w=>`<div class="alert-row"><div><span class="who">${esc(w.identity.fullName)}</span> · <span class="what">${esc(w.tradeProfile.primaryTrade)}</span></div><div>${performanceEvidence(w).score}%</div></div>`).join('')}
    </div>`;
}
function renderActionGroup(title, items, tone){
  if(items.length===0) return '';
  return `<div class="action-group"><h3>${title}</h3>
    ${items.map(i=>`<div class="alert-row"><div><span class="who">${esc(workerName(i.worker))}</span> · <span class="what">${esc(i.issue)}</span><span class="action">${esc(i.action)}</span></div><div>${badge(tone,i.severity)}</div></div>`).join('')}
  </div>`;
}
function renderComplianceCentre(){
  const ac = buildActionCentre();
  return `
    <h1>Compliance Action Centre</h1>
    <p class="lead">Everything the readiness engine currently flags, in one place.</p>
    <div class="panel">${renderActionGroup('Critical', ac.critical, 'danger') || '<p style="color:var(--slate);font-size:13px;">No critical issues.</p>'}</div>
    <div class="panel">${renderActionGroup('Due soon (within 30 days)', ac.dueSoon.filter(d=>d.severity==='DUE SOON'), 'warn') || '<p style="color:var(--slate);font-size:13px;">Nothing due soon.</p>'}</div>
    <div class="panel">${renderActionGroup('Watch (31-60 days)', ac.dueSoon.filter(d=>d.severity==='WATCH'), 'watch') || '<p style="color:var(--slate);font-size:13px;">Nothing in the watch window.</p>'}</div>
    <div class="panel">${renderActionGroup('Missing evidence', ac.missingEv, 'none') || '<p style="color:var(--slate);font-size:13px;">No outstanding evidence gaps.</p>'}</div>
    <div class="panel">${renderActionGroup('Workforce development', ac.devGaps, 'gold') || '<p style="color:var(--slate);font-size:13px;">No open development items.</p>'}</div>`;
}

function renderMatchResults(results){
  const { generation, matches, request } = results;
  const accepted = matches.filter(m=>m.status==='ACCEPTED');
  const proposed = matches.filter(m=>m.status==='PROPOSED');
  const rejected = matches.filter(m=>m.status==='REJECTED');

  return `
    <div class="panel">
      <h2>Match results</h2>
      <div class="search-summary">
        <span class="big">${accepted.length + proposed.length}</span>
        <span class="small">eligible match${(accepted.length+proposed.length)===1?'':'es'} of ${request.quantity} needed</span>
      </div>
      <p class="hint" style="margin-bottom:14px;">${accepted.length} accepted · ${proposed.length} proposed (human review) · ${rejected.length} rejected</p>

      ${matches.length===0
        ? `<div class="empty"><h3>No matches</h3><p>Nobody in the register matches this trade.</p></div>`
        : matches.map(m=>{
            const w = workerById(m.workerId);
            if(!w) return '';
            const sc = performanceEvidence(w);
            const tone = m.status==='ACCEPTED'?'ok':m.status==='PROPOSED'?'review':'none';
            const factorsHtml = (m.factors||[]).map(f=>`<span class="factor ${f.result.toLowerCase()}">${esc(f.factor)}</span>`).join('');
            return `<div class="row">
              <div class="row-main">
                <div class="name">${esc(w.identity.fullName)} <span class="passport-tag">${esc(w.identity.passportId||'Pending')}</span></div>
                <div class="sub">${esc(w.tradeProfile.primaryTrade)}${w.commercial.postcode?' · '+esc(w.commercial.postcode):''}</div>
                <div class="match-factors">${factorsHtml}</div>
              </div>
              <div class="row-badges">${badge(tone, m.status)}</div>
              <div class="row-score">${m.score===null?'—':m.score+'%'}<span class="u">score</span></div>
              ${m.eligible ? `<button class="btn small primary" data-create-assignment="${w.id}" data-request="${request.id}" data-match="${m.id}">Create assignment</button>` : ''}
            </div>`;
          }).join('')}
    </div>`;
}
