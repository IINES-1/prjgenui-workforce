    return a.status===assignmentFilterStatus;
  });
  const chips = [['all','All'], ['PROPOSED','Proposed'], ['CONFIRMED','Confirmed'], ['COMPLETED','Completed'], ['LEGACY_RECORDED','Legacy']];

  return `
    <h1>Assignments</h1>
    <p class="lead">${assignmentEntities.length} assignment${assignmentEntities.length===1?'':'s'} in the register.</p>
    <div class="toolbar">
      ${chips.map(([k,l])=>`<button class="chip ${assignmentFilterStatus===k?'active':''}" data-assign-filter="${k}">${l}</button>`).join('')}
    </div>
    <div class="panel">
      ${filtered.length===0
        ? `<div class="empty"><h3>No assignments</h3><p>Assignments are created from workforce requests or migrated from worker history.</p></div>`
        : filtered.map(a=>{
            const w = workerById(a.workerId);
            const ctr = a.contractorId ? contractorById(a.contractorId) : null;
            const proj = a.projectId ? projectById(a.projectId) : null;
            const statusTone = a.status==='CONFIRMED'?'ok':a.status==='COMPLETED'?'gold':a.status==='LEGACY_RECORDED'?'watch':'none';
            const label = a.legacyRecord ? (a.legacyProjectLabel||a.legacyClientText||'Legacy') : (proj?proj.name:(ctr?ctr.legalName:''));
            return `<div class="row">
              <div class="row-main">
                <div class="name">${esc(w?w.identity.fullName:'(unknown worker)')} <span class="ref-tag">${esc(a.publicReference||'Pending')}</span></div>
                <div class="sub">${esc(a.trade||'')} · ${esc(label)}${a.date?' · '+esc(fmtDate(a.date)):''}${a.startDate?' · '+esc(fmtDate(a.startDate)):''}</div>
              </div>
              <div class="row-badges">${badge(statusTone, a.status)}</div>
              <button class="btn small" data-view-assignment="${a.id}">View</button>
            </div>`;
          }).join('')}
    </div>`;
}

function renderAssignmentDetail(){
  const a = assignmentEntities.find(x=>x.id===editingAssignmentId);
  if(!a) return '<div class="empty"><h3>Assignment not found</h3></div>';
  const w = workerById(a.workerId);
  const ctr = a.contractorId ? contractorById(a.contractorId) : null;
  const proj = a.projectId ? projectById(a.projectId) : null;
  const ste = a.siteId ? siteById(a.siteId) : null;
  const statusTone = a.status==='CONFIRMED'?'ok':a.status==='COMPLETED'?'gold':a.status==='LEGACY_RECORDED'?'watch':a.status==='HUMAN_REVIEW'?'review':'none';

  const steps = ['PROPOSED','CONFIRMED','COMPLETED'];
  const currentStepIdx = a.status==='LEGACY_RECORDED' ? -1 : steps.indexOf(a.status);

  return `
    <div class="breadcrumb"><a id="bcAssignments">Assignments</a><span class="sep">/</span><span class="current">${esc(a.publicReference||'Assignment')}</span></div>
    <h1>Assignment Detail</h1>
    <p class="lead"><span class="ref-tag">${esc(a.publicReference||'Pending')}</span></p>

    ${a.legacyRecord ? `<div class="conflict-note"><b>Legacy record</b> — migrated from worker assignment history. Review and link to contractor/project/site as needed.</div>` : ''}

    <div class="panel" style="display:flex;flex-wrap:wrap;gap:18px;align-items:center;">
      <div><div class="kicker">Status</div>${badge(statusTone, a.status)}</div>
      <div><div class="kicker">Worker</div>${esc(w?w.identity.fullName:'(unknown)')}</div>
      <div><div class="kicker">Trade</div>${esc(a.trade||'Not set')}</div>
      <div><div class="kicker">Role</div>${esc(a.role)}</div>
    </div>

    ${a.status!=='LEGACY_RECORDED' ? `
    <div class="panel">
      <h2>Status timeline</h2>
      <div class="stepper">
        ${steps.map((s,i)=>{
          const cls = i < currentStepIdx ? 'done' : i === currentStepIdx ? 'current' : '';
          return `<div class="step ${cls}"><div class="dot">${i+1}</div>${s}</div>`;
        }).join('')}
      </div>
    </div>` : ''}

    <div class="panel">
      <h2>Details</h2>
      <div class="row"><div class="row-main"><div class="name">Contractor</div></div><div>${esc(ctr?ctr.legalName:(a.legacyClientText||'Not linked'))}</div></div>
      <div class="row"><div class="row-main"><div class="name">Project</div></div><div>${esc(proj?proj.name:(a.legacyProjectLabel||'Not linked'))}</div></div>
      <div class="row"><div class="row-main"><div class="name">Site</div></div><div>${esc(ste?ste.name:'Not linked')}</div></div>
      <div class="row"><div class="row-main"><div class="name">Start date</div></div><div>${esc(fmtDate(a.startDate||a.date))}</div></div>
      <div class="row"><div class="row-main"><div class="name">End date</div></div><div>${esc(fmtDate(a.endDate))}</div></div>
      <div class="row"><div class="row-main"><div class="name">Worker pay rate</div></div><div>${esc(a.workerPayRate||'Not set')}</div></div>
      <div class="row"><div class="row-main"><div class="name">Client charge rate</div></div><div>${esc(a.clientChargeRate||'Not set')}</div></div>
    </div>

    ${a.statusHistory && a.statusHistory.length ? `
    <div class="panel">
      <h2>Status history</h2>
      <div class="timeline">
        ${a.statusHistory.map(h=>`<div class="tl-item"><span class="tl-date">${esc(formatAuditTimestamp(h.timestamp))}</span><br><span class="tl-label">${esc(h.status)}</span>${h.note?' · '+esc(h.note):''}${h.by?' · by '+esc(h.by):''}</div>`).join('')}
      </div>
    </div>` : ''}

    ${(a.clientFeedback || a.supervisorFeedback || a.rating || a.rehireDecision) ? `
    <div class="panel">
      <h2>Outcome</h2>
      ${a.attended!==null ? `<div class="row"><div class="row-main"><div class="name">Attended</div></div><div>${a.attended?'Yes':'No'}</div></div>` : ''}
      ${a.rating ? `<div class="row"><div class="row-main"><div class="name">Rating</div></div><div>${a.rating}/5</div></div>` : ''}
      ${a.rehireDecision ? `<div class="row"><div class="row-main"><div class="name">Rehire decision</div></div><div>${esc(a.rehireDecision)}</div></div>` : ''}
      ${a.clientFeedback ? `<div class="row"><div class="row-main"><div class="name">Client feedback</div></div><div>${esc(a.clientFeedback)}</div></div>` : ''}
      ${a.supervisorFeedback ? `<div class="row"><div class="row-main"><div class="name">Supervisor feedback</div></div><div>${esc(a.supervisorFeedback)}</div></div>` : ''}
    </div>` : ''}

    <div class="form-actions">
      <div></div>
      <div style="display:flex;gap:10px;">
        <button type="button" class="btn" id="backToAssignmentsBtn">Back to assignments</button>
        ${a.status==='PROPOSED' ? '<button type="button" class="btn primary" id="confirmAssignmentBtn">Confirm assignment</button>' : ''}
        ${a.status==='CONFIRMED' ? '<button type="button" class="btn primary" id="completeAssignmentBtn">Mark completed</button>' : ''}
      </div>
    </div>`;
}

/* =========================================================
   EVENT HANDLERS
   ========================================================= */
function wireRemoveButtons(){
  document.querySelectorAll('.remove-row').forEach(btn=>{ btn.onclick = ()=> btn.closest('.sub-row').remove(); });
}

function wireViewEvents(){
  if(view==='dashboard'){
    const b = document.getElementById('emptyAddBtn');
    if(b) b.onclick = ()=>{ editingId=null; view='workerForm'; render(); };
    const gc = document.getElementById('goComplianceBtn');
    if(gc) gc.onclick = ()=>{ view='compliance'; render(); };
  }

  if(view==='workers'){
    document.getElementById('searchInput').oninput = (e)=>{
      searchQuery = e.target.value; render();
      const el = document.getElementById('searchInput'); el.focus(); el.setSelectionRange(el.value.length, el.value.length);
    };
    document.querySelectorAll('[data-filter]').forEach(c=> c.onclick = ()=>{ filterStatus = c.dataset.filter; render(); });
    document.getElementById('addWorkerBtn').onclick = ()=>{ editingId=null; view='workerForm'; render(); };
    document.querySelectorAll('[data-edit]').forEach(btn=> btn.onclick = ()=>{ editingId = btn.dataset.edit; view='workerForm'; render(); });
  }

  if(view==='workerForm'){
    document.getElementById('addCertBtn').onclick = ()=>{ document.getElementById('certRows').insertAdjacentHTML('beforeend', certRowHtml(null)); wireRemoveButtons(); };
    document.getElementById('addProofBtn').onclick = ()=>{ document.getElementById('proofRows').insertAdjacentHTML('beforeend', proofRowHtml(null)); wireRemoveButtons(); };
    document.getElementById('addAssignBtn').onclick = ()=>{ document.getElementById('assignRows').insertAdjacentHTML('beforeend', assignRowHtml(null)); wireRemoveButtons(); };
    wireRemoveButtons();
    document.getElementById('cancelFormBtn').onclick = ()=>{ view='workers'; render(); };
    const delBtn = document.getElementById('deleteWorkerBtn');
    if(delBtn) delBtn.onclick = async ()=>{
      if(confirm('Delete this worker? This cannot be undone.')){
        workers = workers.filter(w=>w.id!==editingId);
        await persistWorkers(); editingId=null; view='workers'; render();
        showToast('Worker deleted.');
      }
    };
    document.getElementById('workerForm').onsubmit = async (e)=>{
      e.preventDefault();
      const fullName = document.getElementById('f_fullName').value.trim();
      const trade = document.getElementById('f_trade').value.trim();
      if(!fullName || !trade){ showToast('Full name and primary trade are required.', true); return; }

      const rtwStatusVal = document.getElementById('f_rtwStatus').value;
      const rtwEvidence = document.getElementById('f_rtwEvidence').value.trim();
      if(rtwStatusVal==='verified' && !rtwEvidence){ showToast('Add evidence before marking Right to Work as verified.', true); return; }
      const cscsStatusVal = document.getElementById('f_cscsStatus').value;
      const cscsEvidence = document.getElementById('f_cscsEvidence').value.trim();
      if(cscsStatusVal==='valid' && !cscsEvidence){ showToast('Add evidence before marking CSCS as valid.', true); return; }

      const certs = Array.from(document.querySelectorAll('#certRows .cert-row')).map(row=>({
        id: row.dataset.id || uid(), name: row.querySelector('.cert-name').value, category:'core', issuer:'', certificateNumber:'',
        issueDate:'', expiryDate: row.querySelector('.cert-expiry').value, status: row.querySelector('.cert-status').value,
        requirementType: row.querySelector('.cert-requirement').value,
        verificationMethod:'', verifier:'', verificationDate:'', evidenceReference: row.querySelector('.cert-evidence').value.trim(), notes:''
      }));
      const proofOfWork = Array.from(document.querySelectorAll('#proofRows .proof-row')).map(row=>({
        id: row.dataset.id || uid(), project: row.querySelector('.proof-project').value.trim(), client:'', site:'', trade:'',
        description: row.querySelector('.proof-desc').value.trim(), dateFrom: row.querySelector('.proof-date').value, dateTo:'',
        supervisor: row.querySelector('.proof-verifiedby').value.trim(), verified: !!row.querySelector('.proof-verifiedby').value.trim(),
        verifiedBy: row.querySelector('.proof-verifiedby').value.trim(), evidenceReferences:[], imagesReferences:[], notes:''
      })).filter(p=>p.project || p.description);
      const assignments = Array.from(document.querySelectorAll('#assignRows .assign-row')).map(row=>({
        id: row.dataset.id || uid(), deploymentId:'', client:'', project: row.querySelector('.assign-project').value.trim(), date: row.querySelector('.assign-date').value,
        attended: row.querySelector('.assign-attended').value === 'yes', late:false, noShow: row.querySelector('.assign-attended').value==='no',
        rating: row.querySelector('.assign-rating').value ? Number(row.querySelector('.assign-rating').value) : null,
        rehireDecision: row.querySelector('.assign-rehire').value, clientFeedback:'', supervisorFeedback:'', issueRecorded:false, outcome:''
      })).filter(a=>a.date || a.project);
      const sectorExperience = Array.from(document.querySelectorAll('.sectorCheck:checked')).map(c=>c.value);
      const competenceRaw = document.getElementById('f_competence').value;
      const competenceScoreVal = competenceRaw==='' ? null : Math.max(0,Math.min(20,Number(competenceRaw)));
      const competenceAssessedByVal = document.getElementById('f_competenceBy').value.trim();
      const competenceEvidenceVal = document.getElementById('f_competenceEvidence').value.trim();
      const availabilityVal = document.getElementById('f_availability').value;

      const prev = editingId ? workerById(editingId) : null;

      const rtwAnyChanged = !prev || prev.rightToWork.status!==rtwStatusVal ||
        prev.rightToWork.expiryDate!==document.getElementById('f_rtwExpiry').value ||
        prev.rightToWork.evidenceNote!==rtwEvidence ||
        prev.rightToWork.method!==document.getElementById('f_rtwMethod').value ||
        prev.rightToWork.checkedDate!==document.getElementById('f_rtwChecked').value ||
        prev.rightToWork.verifier!==document.getElementById('f_rtwVerifier').value.trim() ||
        prev.rightToWork.reference!==document.getElementById('f_rtwReference').value.trim();
      const rtwVerificationEventChanged = !prev || prev.rightToWork.status!==rtwStatusVal ||
        prev.rightToWork.expiryDate!==document.getElementById('f_rtwExpiry').value ||
        prev.rightToWork.evidenceNote!==rtwEvidence ||
        prev.rightToWork.method!==document.getElementById('f_rtwMethod').value ||
        prev.rightToWork.checkedDate!==document.getElementById('f_rtwChecked').value ||
        prev.rightToWork.verifier!==document.getElementById('f_rtwVerifier').value.trim();
      const cscsAnyChanged = !prev || prev.cscs.status!==cscsStatusVal ||
        prev.cscs.expiryDate!==document.getElementById('f_cscsExpiry').value ||
        prev.cscs.evidenceReference!==cscsEvidence ||
        prev.cscs.registrationNumber!==document.getElementById('f_cscsReg').value.trim() ||
        prev.cscs.cardType!==document.getElementById('f_cscsType').value.trim() ||
        prev.cscs.scheme!==document.getElementById('f_cscsScheme').value.trim();
      const cscsVerificationEventChanged = !prev || prev.cscs.status!==cscsStatusVal ||
        prev.cscs.expiryDate!==document.getElementById('f_cscsExpiry').value ||
        prev.cscs.evidenceReference!==cscsEvidence;
      const competenceChanged = prev
        ? (prev.tradeProfile.competenceScore!==competenceScoreVal || prev.tradeProfile.competenceAssessedBy!==competenceAssessedByVal || prev.tradeProfile.competenceEvidence!==competenceEvidenceVal)
        : (competenceScoreVal!==null || competenceEvidenceVal!=='');
      const availabilityChanged = prev ? prev.commercial.availability!==availabilityVal : false;

      const prevCerts = prev ? (prev.trainingCertificates||[]) : [];
      const prevCertsById = new Map(prevCerts.map(c=>[c.id,c]));
      const newCertIds = new Set(certs.map(c=>c.id));
      const certsAdded = certs.filter(c=>!prevCertsById.has(c.id));
      const certsRemoved = prevCerts.filter(c=>!newCertIds.has(c.id));
      const certsNewlyVerified = certs.filter(c=>{ const old = prevCertsById.get(c.id); return old && old.status!=='verified' && c.status==='verified'; });
      const certsExpiryChanged = certs.filter(c=>{ const old = prevCertsById.get(c.id); return old && old.expiryDate!==c.expiryDate; });

      const prevProof = prev ? (prev.proofOfWork||[]) : [];
      const prevProofById = new Map(prevProof.map(p=>[p.id,p]));
      const proofAdded = proofOfWork.filter(p=>!prevProofById.has(p.id));
      const proofNewlyVerified = proofOfWork.filter(p=>{ const old = prevProofById.get(p.id); return old && !old.verified && p.verified; });

      const prevAssign = prev ? (prev.assignments||[]) : [];
      const prevAssignById = new Map(prevAssign.map(a=>[a.id,a]));
      const assignAdded = assignments.filter(a=>!prevAssignById.has(a.id));
      const assignRatingChanged = assignments.filter(a=>{ const old = prevAssignById.get(a.id); return old && old.rating!==a.rating; });
      const assignOutcomeChanged = assignments.filter(a=>{ const old = prevAssignById.get(a.id); return old && old.rehireDecision!==a.rehireDecision; });

      const internalUUID = prev ? prev.id : uid();

      const worker = {
        schemaVersion: SCHEMA_VERSION,
        id: internalUUID,
        identity: {
          fullName, preferredName: document.getElementById('f_preferredName').value.trim(),
          phone: document.getElementById('f_phone').value.trim(), email: document.getElementById('f_email').value.trim(),
          postcode: document.getElementById('f_postcode').value.trim(), nationality: document.getElementById('f_nationality').value.trim(),
          workerUUID: internalUUID, passportId: prev ? prev.identity.passportId : nextPassportId(), status:'active'
        },
        rightToWork: {
          status:rtwStatusVal, method:document.getElementById('f_rtwMethod').value, checkedDate:document.getElementById('f_rtwChecked').value,
          expiryDate:document.getElementById('f_rtwExpiry').value, verifier:document.getElementById('f_rtwVerifier').value.trim(),
          reference:document.getElementById('f_rtwReference').value.trim(), evidenceNote:rtwEvidence, evidenceFileReference: prev ? prev.rightToWork.evidenceFileReference : '',
          lastReviewed: rtwVerificationEventChanged ? todayStr() : (prev ? prev.rightToWork.lastReviewed : '')
        },
        cscs: {
          status:cscsStatusVal, registrationNumber:document.getElementById('f_cscsReg').value.trim(), cardType:document.getElementById('f_cscsType').value.trim(),
          occupation: prev ? prev.cscs.occupation : '', scheme:document.getElementById('f_cscsScheme').value.trim(), issueDate: prev ? prev.cscs.issueDate : '',
          expiryDate:document.getElementById('f_cscsExpiry').value,
          verificationMethod: prev ? prev.cscs.verificationMethod : '', verifier: prev ? prev.cscs.verifier : '',
          verificationDate: cscsVerificationEventChanged ? todayStr() : (prev ? prev.cscs.verificationDate : ''),
          evidenceReference:cscsEvidence
        },
        trainingCertificates: certs,
        tradeProfile: {
          primaryTrade: trade, secondaryTrades: prev ? prev.tradeProfile.secondaryTrades : [], yearsExperience: document.getElementById('f_yearsExp').value.trim(),
          competenceScore: competenceScoreVal,
          competenceAssessedBy: competenceAssessedByVal,
          competenceAssessmentDate: competenceChanged ? ((competenceScoreVal!==null || competenceEvidenceVal) ? todayStr() : '') : (prev ? prev.tradeProfile.competenceAssessmentDate : ''),
          competenceEvidence: competenceEvidenceVal,
          notes: prev ? prev.tradeProfile.notes : ''
        },
        proofOfWork, assignments,
        commercial: {
          postcode: document.getElementById('f_postcode').value.trim(), travelRadius: document.getElementById('f_radius').value,
          dayRate: document.getElementById('f_rate').value, availability: availabilityVal,
          availableFrom: document.getElementById('f_availableFrom').value, sectorExperience,
          preferredLocations: prev ? prev.commercial.preferredLocations : [], transport: document.getElementById('f_transport').value.trim(),
          ownTools: prev ? prev.commercial.ownTools : '', notes: document.getElementById('f_commercialNotes').value.trim()
        },
        auditLog: prev ? (prev.auditLog||[]) : []
      };

      if(prev){
        if(rtwAnyChanged){
          if(prev.rightToWork.status!==rtwStatusVal) addAudit(worker,'Right to work','status', prev.rightToWork.status, rtwStatusVal);
          if(prev.rightToWork.expiryDate!==worker.rightToWork.expiryDate) addAudit(worker,'Right to work','expiry', prev.rightToWork.expiryDate, worker.rightToWork.expiryDate);
          if(prev.rightToWork.evidenceNote!==rtwEvidence) addAudit(worker,'Right to work','evidence', prev.rightToWork.evidenceNote, rtwEvidence, {evidenceReference: rtwEvidence});
        }
        if(cscsAnyChanged){
          if(prev.cscs.status!==cscsStatusVal) addAudit(worker,'CSCS','status', prev.cscs.status, cscsStatusVal);
          if(prev.cscs.expiryDate!==worker.cscs.expiryDate) addAudit(worker,'CSCS','expiry', prev.cscs.expiryDate, worker.cscs.expiryDate);
          if(prev.cscs.evidenceReference!==cscsEvidence) addAudit(worker,'CSCS','evidence', prev.cscs.evidenceReference, cscsEvidence, {evidenceReference: cscsEvidence});
        }
        certsAdded.forEach(c=>addAudit(worker,'Certificate','added', null, c.name));
        certsRemoved.forEach(c=>addAudit(worker,'Certificate','removed', c.name, null));
        certsNewlyVerified.forEach(c=>addAudit(worker,'Certificate','verified', null, c.name, {evidenceReference: c.evidenceReference}));
        certsExpiryChanged.forEach(c=>{ const old = prevCertsById.get(c.id); addAudit(worker,'Certificate','expiry changed', old?old.expiryDate:null, c.expiryDate, {note: c.name}); });
        if(competenceChanged) addAudit(worker,'Competence','assessment', prev.tradeProfile.competenceScore, competenceScoreVal, {verifier: competenceAssessedByVal});
        if(availabilityChanged) addAudit(worker,'Availability','availability', prev.commercial.availability, availabilityVal);
        proofAdded.forEach(p=>addAudit(worker,'Proof of work','added', null, p.project||p.description||'(untitled)'));
        proofNewlyVerified.forEach(p=>addAudit(worker,'Proof of work','verified', null, p.project||p.description||'(untitled)', {verifier: p.verifiedBy}));
        assignAdded.forEach(a=>addAudit(worker,'Assignment','added', null, a.project||a.date||'(untitled)'));
        assignRatingChanged.forEach(a=>{ const old = prevAssignById.get(a.id); addAudit(worker,'Assignment','rating', old?old.rating:null, a.rating, {note: a.project||a.date}); });
        assignOutcomeChanged.forEach(a=>{ const old = prevAssignById.get(a.id); addAudit(worker,'Assignment','rehire decision', old?old.rehireDecision:null, a.rehireDecision, {note: a.project||a.date}); });
      } else {
        if(rtwStatusVal==='verified') addAudit(worker,'Right to work','status', null, 'verified', {evidenceReference: rtwEvidence});
        if(cscsStatusVal==='valid') addAudit(worker,'CSCS','status', null, 'valid', {evidenceReference: cscsEvidence});
        certs.filter(c=>c.status==='verified').forEach(c=>addAudit(worker,'Certificate','verified', null, c.name, {evidenceReference: c.evidenceReference}));
        if(competenceScoreVal!==null || competenceEvidenceVal) addAudit(worker,'Competence','assessment', null, competenceScoreVal, {verifier: competenceAssessedByVal});
      }

      if(editingId){ workers = workers.map(w=>w.id===editingId?worker:w); }
      else { workers.push(worker); await persistMeta(); }
      await persistWorkers();
      editingId=null; view='workers'; render();
      showToast('Passport saved.');
    };
  }

  if(view==='crews'){
    document.getElementById('addCrewBtn').onclick = ()=>{ editingId=null; view='crewForm'; render(); };
    document.querySelectorAll('[data-edit-crew]').forEach(btn=> btn.onclick = ()=>{ editingId=btn.dataset.editCrew; view='crewForm'; render(); });
  }
  if(view==='crewForm'){
    document.getElementById('addDeployBtn').onclick = ()=>{ document.getElementById('deployRows').insertAdjacentHTML('beforeend', crewDeployRowHtml(null)); wireRemoveButtons(); };
    wireRemoveButtons();
    document.getElementById('cancelCrewBtn').onclick = ()=>{ view='crews'; render(); };
    const delBtn = document.getElementById('deleteCrewBtn');
    if(delBtn) delBtn.onclick = async ()=>{
      if(confirm('Delete this crew? This cannot be undone.')){
        crews = crews.filter(c=>c.id!==editingId); await persistCrews();
        editingId=null; view='crews'; render(); showToast('Crew deleted.');
      }
    };
    document.getElementById('crewForm').onsubmit = async (e)=>{
      e.preventDefault();
      const name = document.getElementById('cr_name').value.trim();
      if(!name){ showToast('Crew name is required.', true); return; }
      const memberSelect = document.getElementById('cr_members');
      const memberIds = memberSelect ? Array.from(memberSelect.selectedOptions).map(o=>o.value) : [];
      const deployments = Array.from(document.querySelectorAll('#deployRows .deploy-row')).map(row=>({
        date: row.querySelector('.cd-date').value, client: row.querySelector('.cd-client').value.trim(),
        project: row.querySelector('.cd-project').value.trim(), workedWell: row.querySelector('.cd-worked').value === 'yes'
      })).filter(d=>d.date || d.client || d.project);
      const crew = {
        id: editingId || uid(), name, specialism: document.getElementById('cr_specialism').value.trim(),
        supervisorId: document.getElementById('cr_supervisor').value, memberIds,
        notes: document.getElementById('cr_notes').value.trim(), deployments
      };
      if(editingId){ crews = crews.map(c=>c.id===editingId?crew:c); } else { crews.push(crew); }
      await persistCrews(); editingId=null; view='crews'; render(); showToast('Crew saved.');
    };
  }

  if(view==='contractors'){
    document.getElementById('addContractorBtn').onclick = ()=>{ editingId=null; view='contractorForm'; render(); };
    document.querySelectorAll('[data-edit-contractor]').forEach(btn=> btn.onclick = ()=>{ editingId=btn.dataset.editContractor; view='contractorForm'; render(); });
  }
  if(view==='contractorForm'){
    document.getElementById('cancelContractorBtn').onclick = ()=>{ editingId=null; view='contractors'; render(); };
    const delBtn = document.getElementById('deleteContractorBtn');
    if(delBtn) delBtn.onclick = async ()=>{
      if(confirm('Delete this contractor? Projects and sites will remain but be unlinked. This cannot be undone.')){
        contractors = contractors.filter(c=>c.id!==editingId); await persistContractors();

      a.generationId = currentMatchResults ? currentMatchResults.generation.id : null;
      a.statusHistory = [{ id:uid(), timestamp:new Date().toISOString(), status:'PROPOSED', note:'Created from match', by:'' }];
      assignmentEntities.push(a);

      a.statusHistory.push({ id:uid(), timestamp:new Date().toISOString(), status:'COMPLETED', note:'Completed', by:'' });
      a.updatedAt = new Date().toISOString();
      await persistAssignmentEntities(); render();
      showToast('Assignment marked completed.');
    };
  }
}

   ========================================================= */
async function persistWorkers(){ await Storage.set(W_KEY, {schemaVersion:SCHEMA_VERSION, data:workers}); }
async function persistCrews(){ await Storage.set(C_KEY, {schemaVersion:SCHEMA_VERSION, data:crews}); }
async function persistClients(){ await Storage.set(CL_KEY, {schemaVersion:SCHEMA_VERSION, data:clients}); }
async function persistMeta(){ await Storage.set(META_KEY, {schemaVersion:SCHEMA_VERSION, passportCounter, referenceCounters}); }
async function persistContractors(){ await Storage.set(CTR_KEY, {schemaVersion:SCHEMA_VERSION, data:contractors}); }
async function persistProjects(){ await Storage.set(PRJ_KEY, {schemaVersion:SCHEMA_VERSION, data:projects}); }
async function persistSites(){ await Storage.set(STE_KEY, {schemaVersion:SCHEMA_VERSION, data:sites}); }
async function persistAssignmentEntities(){ await Storage.set(ASN_KEY, {schemaVersion:SCHEMA_VERSION, data:assignmentEntities}); }
async function persistWorkforceRequests(){ await Storage.set(WFR_KEY, {schemaVersion:SCHEMA_VERSION, data:workforceRequests}); }
async function persistMatchGenerations(){ await Storage.set(MG_KEY, {schemaVersion:SCHEMA_VERSION, data:matchGenerations}); }
async function persistMatches(){ await Storage.set(MATCH_KEY, {schemaVersion:SCHEMA_VERSION, data:matches}); }
async function persistMigrationLog(){ await Storage.set(MIGRATIONS_KEY, {schemaVersion:SCHEMA_VERSION, data:migrationLog}); }

async function persistAll(){
  await persistWorkers();
  await persistCrews();
  await persistClients();
  await persistMeta();
  await persistContractors();
  await persistProjects();
  await persistSites();
  await persistAssignmentEntities();
  await persistWorkforceRequests();
  await persistMatchGenerations();
  await persistMatches();
  await persistMigrationLog();
}

let fallbackSnapshotInProgress = false;
async function loadAll(){
  Storage.onChange((backend)=>{
    document.getElementById('storageTag').textContent = 'Verified Workforce Operating System · ' + (backend==='supabase' ? 'Supabase' : backend==='indexeddb' ? 'IndexedDB' : 'local storage fallback');
    showToast('Storage switched to local storage fallback after an IndexedDB error. Re-saving everything now.', true);
    if(fallbackSnapshotInProgress) return;
    fallbackSnapshotInProgress = true;
    persistAll().catch(()=>{}).finally(()=>{ fallbackSnapshotInProgress = false; });
  });
  const backend = await Storage.init();
  document.getElementById('storageTag').textContent = 'Verified Workforce Operating System · ' + (backend==='supabase' ? 'Supabase' : backend==='indexeddb' ? 'IndexedDB' : 'local storage fallback');

  const wRaw = await Storage.get(W_KEY);
  const cRaw = await Storage.get(C_KEY);
  const clRaw = await Storage.get(CL_KEY);
  const metaRaw = await Storage.get(META_KEY);
  const ctrRaw = await Storage.get(CTR_KEY);
  const prjRaw = await Storage.get(PRJ_KEY);
  const steRaw = await Storage.get(STE_KEY);
  const asnRaw = await Storage.get(ASN_KEY);
  const wfrRaw = await Storage.get(WFR_KEY);
  const mgRaw = await Storage.get(MG_KEY);
  const matchRaw = await Storage.get(MATCH_KEY);
  const migRaw = await Storage.get(MIGRATIONS_KEY);

  workers = migrateCollection(wRaw ? wRaw.data : [], normaliseWorker);
  crews = (cRaw ? cRaw.data : []) || [];
  clients = (clRaw ? clRaw.data : []) || [];
  passportCounter = (metaRaw && metaRaw.passportCounter) || 0;
  referenceCounters = (metaRaw && metaRaw.referenceCounters) || {contractor:0, project:0, site:0, assignment:0, request:0};

  contractors = migrateCollection(ctrRaw ? ctrRaw.data : [], normaliseContractor);
  projects = migrateCollection(prjRaw ? prjRaw.data : [], normaliseProject);
  sites = migrateCollection(steRaw ? steRaw.data : [], normaliseSite);
  assignmentEntities = migrateCollection(asnRaw ? asnRaw.data : [], normaliseAssignmentEntity);
  workforceRequests = migrateCollection(wfrRaw ? wfrRaw.data : [], normaliseWorkforceRequest);
  matchGenerations = migrateCollection(mgRaw ? mgRaw.data : [], normaliseMatchGeneration);
  matches = migrateCollection(matchRaw ? matchRaw.data : [], normaliseMatch);
  migrationLog = (migRaw ? migRaw.data : []) || [];

  // Run Release 0.2A migration (idempotent)
  if(clients.length > 0 || workers.some(w=>(w.assignments||[]).length > 0)){
    const migResult = runRelease02aMigration();
    if(!migResult.skipped){
      console.log('Release 0.2A migration:', migResult.entry);
      await persistMigrationLog();
    }
  }

  assignPassportIdsIfMissing();
  assignReferencesIfMissing(contractors, 'contractor');
  assignReferencesIfMissing(projects, 'project');
  assignReferencesIfMissing(sites, 'site');
  assignReferencesIfMissing(assignmentEntities, 'assignment');
  assignReferencesIfMissing(workforceRequests, 'request');

  await persistAll();
  runSilentIntegrityWarning();
}

function runSilentIntegrityWarning(){
  const issues = runIntegrityCheck();
  if(issues.length){
    console.log(`PRJGENUI integrity check: ${issues.length} issue(s) found.`);
    console.table(issues);
    showToast(`${issues.length} integrity issue(s) detected. See the browser console.`, true);
  }
  return issues;
}

function showToast(msg, isDanger){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isDanger ? ' danger' : '');
  setTimeout(()=>{ t.className = 'toast'; }, 2800);
}

/* =========================================================
   EASBERG PILOT INITIALISATION
   ========================================================= */
const EASBERG_PILOT_NAMES = ['Christian','Marisa','Bene','Jepherson','Henry','Lucas'];
async function initialiseEasbergPilot(){
  const existingContractor = contractors.find(c=>c.legalName==='Easberg Ltd');
  const existingNames = new Set(workers.map(w=>w.identity.fullName));
  const namesToAdd = EASBERG_PILOT_NAMES.filter(n=>!existingNames.has(n));

  if(existingContractor && namesToAdd.length===0){
    showToast('Easberg pilot already initialised. Nothing to add.');
    return;
  }
  const parts = [];
  if(!existingContractor) parts.push('add Easberg Ltd as a contractor');
  if(namesToAdd.length) parts.push(`add ${namesToAdd.length} worker shell${namesToAdd.length===1?'':'s'} (${namesToAdd.join(', ')})`);
  if(!confirm(`This will ${parts.join(' and ')}, all marked Not Verified / To Confirm. No compliance data will be invented. You'll fill each in as it's confirmed. Continue?`)) return;

  if(!existingContractor){
    const ctr = blankContractor();
    ctr.legalName = 'Easberg Ltd';
    ctr.tradingName = 'Easberg Ltd';
    ctr.sector = 'Housing / residential';
    ctr.status = 'ACTIVE';
    contractors.push(ctr);
    await persistContractors();
  }
  namesToAdd.forEach(name=>{
    const w = blankWorker();
    w.identity.fullName = name;
    w.identity.passportId = nextPassportId();
    w.commercial.availability = 'To confirm';
    workers.push(w);
  });
  if(namesToAdd.length){ await persistWorkers(); await persistMeta(); }
  view = 'workers'; render();
  showToast(`Easberg pilot ready. ${namesToAdd.length} shell${namesToAdd.length===1?'':'s'} added. Primary trade left blank on purpose; fill it in when confirmed.`);
  runSilentIntegrityWarning();
}

/* =========================================================
   INTEGRITY CHECK
   ========================================================= */
function runIntegrityCheck(){
  const issues = [];
  const seenPassportIds = new Map();
  const seenIds = new Map();
  const seenWorkerUUIDs = new Map();

  workers.forEach(w=>{
    const name = w.identity.fullName || '(unnamed)';
    const r = evaluateWorkerReadiness(w);

    if(r.eligible && r.deploymentStatus==='HOLD') issues.push(`${name}: marked eligible while deploymentStatus is HOLD`);
    if(r.eligible && r.deploymentStatus==='BLOCKED') issues.push(`${name}: marked eligible while deploymentStatus is BLOCKED`);
    if(r.deploymentStatus==='READY' && r.blockers.length>0) issues.push(`${name}: marked READY but has compliance blockers (${r.blockers.join('; ')})`);

    if(w.rightToWork.status==='verified' && !w.rightToWork.evidenceNote) issues.push(`${name}: Right to Work verified with no evidence recorded`);
    if(w.cscs.status==='valid' && !w.cscs.evidenceReference) issues.push(`${name}: CSCS valid with no evidence reference`);
    (w.trainingCertificates||[]).forEach(c=>{
      if(c.status==='verified' && !c.evidenceReference) issues.push(`${name}: certificate "${c.name}" verified with no evidence reference`);
    });

    const certIds = (w.trainingCertificates||[]).map(c=>c.id);
    if(new Set(certIds).size !== certIds.length) issues.push(`${name}: duplicate certificate IDs on this worker`);
    const proofIds = (w.proofOfWork||[]).map(p=>p.id);
    if(new Set(proofIds).size !== proofIds.length) issues.push(`${name}: duplicate proof-of-work IDs on this worker`);
    const assignIds = (w.assignments||[]).map(a=>a.id);
    if(new Set(assignIds).size !== assignIds.length) issues.push(`${name}: duplicate assignment IDs on this worker`);

    if(!w.id) issues.push(`${name}: missing internal worker UUID (w.id)`);
    else if(seenIds.has(w.id)) issues.push(`Duplicate worker UUID "${w.id}" (w.id) shared by ${name} and ${seenIds.get(w.id)}`);
    else seenIds.set(w.id, name);

    if(!w.identity.workerUUID) issues.push(`${name}: missing identity.workerUUID`);
    else if(seenWorkerUUIDs.has(w.identity.workerUUID)) issues.push(`Duplicate identity.workerUUID "${w.identity.workerUUID}" shared by ${name} and ${seenWorkerUUIDs.get(w.identity.workerUUID)}`);
    else seenWorkerUUIDs.set(w.identity.workerUUID, name);

    if(w.id && w.identity.workerUUID && w.id !== w.identity.workerUUID) issues.push(`${name}: w.id and identity.workerUUID do not match; they should always be the same internal UUID`);

    const pid = w.identity.passportId;
    if(!pid || !/^PW-UK-\d{6}$/.test(pid)) issues.push(`${name}: missing or malformed Passport ID ("${pid}")`);
    else if(seenPassportIds.has(pid)) issues.push(`Duplicate Passport ID "${pid}" shared by ${name} and ${seenPassportIds.get(pid)}`);
    else seenPassportIds.set(pid, name);
  });

  const workerIds = new Set(workers.map(w=>w.id));
  crews.forEach(c=>{
    (c.memberIds||[]).forEach(id=>{ if(!workerIds.has(id)) issues.push(`Crew "${c.name}": member reference "${id}" does not match any existing worker`); });
    if(c.supervisorId && !workerIds.has(c.supervisorId)) issues.push(`Crew "${c.name}": supervisor reference "${c.supervisorId}" does not match any existing worker`);
  });

  // Contractor integrity checks
  const contractorIds = new Set(contractors.map(c=>c.id));
  contractors.forEach(ctr=>{
    if(!ctr.publicReference || !/^CTR-\d{6}$/.test(ctr.publicReference)) issues.push(`Contractor "${ctr.legalName}": missing or malformed reference ("${ctr.publicReference}")`);
    (ctr.preferredWorkerIds||[]).forEach(id=>{ if(!workerIds.has(id)) issues.push(`Contractor "${ctr.legalName}": preferred-worker reference "${id}" does not match any existing worker`); });
    (ctr.excludedWorkerIds||[]).forEach(id=>{ if(!workerIds.has(id)) issues.push(`Contractor "${ctr.legalName}": excluded-worker reference "${id}" does not match any existing worker`); });
  });

  // Project integrity checks
  const projectIds = new Set(projects.map(p=>p.id));
  projects.forEach(p=>{
    if(!p.publicReference || !/^PRJ-\d{6}$/.test(p.publicReference)) issues.push(`Project "${p.name}": missing or malformed reference ("${p.publicReference}")`);
    if(p.contractorId && !contractorIds.has(p.contractorId)) issues.push(`Project "${p.name}": contractorId "${p.contractorId}" does not match any existing contractor`);
  });

  // Site integrity checks
  sites.forEach(s=>{
    if(!s.publicReference || !/^STE-\d{6}$/.test(s.publicReference)) issues.push(`Site "${s.name}": missing or malformed reference ("${s.publicReference}")`);
    if(s.projectId && !projectIds.has(s.projectId)) issues.push(`Site "${s.name}": projectId "${s.projectId}" does not match any existing project`);
  });

  // Assignment entity integrity checks
  assignmentEntities.forEach(a=>{
    if(!a.publicReference || !/^ASN-\d{4}-\d{6}$/.test(a.publicReference)) issues.push(`Assignment: missing or malformed reference ("${a.publicReference}")`);
    if(a.workerId && !workerIds.has(a.workerId)) issues.push(`Assignment ${a.publicReference||a.id}: workerId does not match any existing worker`);
    if(a.contractorId && !contractorIds.has(a.contractorId)) issues.push(`Assignment ${a.publicReference||a.id}: contractorId does not match any existing contractor`);
    if(a.projectId && !projectIds.has(a.projectId)) issues.push(`Assignment ${a.publicReference||a.id}: projectId does not match any existing project`);
  });

  // Match integrity checks
  const requestIds = new Set(workforceRequests.map(r=>r.id));
  matches.forEach(m=>{
    if(m.workerId && !workerIds.has(m.workerId)) issues.push(`Match: workerId "${m.workerId}" does not match any existing worker`);
    if(m.requestId && !requestIds.has(m.requestId)) issues.push(`Match: requestId "${m.requestId}" does not match any existing request`);
  });

  let maxAssignedPassportNumber = 0;
  workers.forEach(w=>{
    const m = /PW-UK-(\d+)/.exec(w.identity.passportId||'');
    if(m) maxAssignedPassportNumber = Math.max(maxAssignedPassportNumber, parseInt(m[1],10));
  });
  if(passportCounter < maxAssignedPassportNumber) issues.push(`Passport counter (${passportCounter}) is behind the highest assigned Passport ID (${maxAssignedPassportNumber}), so future IDs could collide`);

  return issues;
}
function showIntegrityCheckResult(){
  const issues = runIntegrityCheck();
  console.log(`PRJGENUI integrity check: ${issues.length} issue(s) found.`);
  if(issues.length){ console.table(issues); showToast(`${issues.length} integrity issue(s) found. See the browser console.`, true); }
  else showToast('Integrity check passed. No issues found.');
  return issues;
}
window.PRJGENUI_integrityCheck = runIntegrityCheck;

/* =========================================================
   EXPORT / IMPORT
   ========================================================= */
function exportData(){
  const payload = {
    exportedAt: new Date().toISOString(), schemaVersion: SCHEMA_VERSION,
    workers, crews, clients, passportCounter,
    contractors, projects, sites, assignmentEntities,
    workforceRequests, matchGenerations, matches, assignmentOffers,
    readinessSnapshots, migrationLog, referenceCounters
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `prjgenui-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup downloaded.');
}
async function handleImportFile(file){
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.workers)){
      showToast("That file doesn't look like a PRJGENUI backup.", true); return;
    }
    const summary = `${(data.workers||[]).length} workers, ${(data.contractors||[]).length} contractors, ${(data.workforceRequests||[]).length} requests`;
    if(!confirm(`Import this backup (${summary})? This replaces all current data and cannot be undone.`)) return;
    workers = migrateCollection(data.workers, normaliseWorker);
    crews = data.crews || [];
    clients = data.clients || [];
    contractors = migrateCollection(data.contractors, normaliseContractor);
    projects = migrateCollection(data.projects, normaliseProject);
    sites = migrateCollection(data.sites, normaliseSite);
    assignmentEntities = migrateCollection(data.assignmentEntities, normaliseAssignmentEntity);
    workforceRequests = migrateCollection(data.workforceRequests, normaliseWorkforceRequest);
    matchGenerations = migrateCollection(data.matchGenerations, normaliseMatchGeneration);
    matches = migrateCollection(data.matches, normaliseMatch);
    assignmentOffers = data.assignmentOffers || [];
    readinessSnapshots = data.readinessSnapshots || [];
    migrationLog = data.migrationLog || [];
    passportCounter = data.passportCounter || 0;
    referenceCounters = data.referenceCounters || {contractor:0, project:0, site:0, assignment:0, request:0};

    // Run migration if old clients exist and haven't been migrated
    if(clients.length > 0 && clients.some(c=>!c._migratedToContractorId)){
      runRelease02aMigration();
    }

    assignPassportIdsIfMissing();
    assignReferencesIfMissing(contractors, 'contractor');
    assignReferencesIfMissing(projects, 'project');
    assignReferencesIfMissing(sites, 'site');
    assignReferencesIfMissing(assignmentEntities, 'assignment');
    assignReferencesIfMissing(workforceRequests, 'request');

    await persistAll();
    editingId = null; view = 'dashboard'; render();
    showToast('Backup imported (migrated to current schema if needed).');
    runSilentIntegrityWarning();
  }catch(e){
    showToast('Could not read that file. Is it a valid backup?', true);
  }
}

/* =========================================================
   NAV + RESET + INIT
   ========================================================= */
document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-view]');
  if(!btn) return;
  view = btn.dataset.view; editingId = null; editingProjectId = null; editingSiteId = null;
  editingRequestId = null; editingAssignmentId = null; currentMatchResults = null;
  render();
});
document.getElementById('initEasbergBtn').onclick = initialiseEasbergPilot;
document.getElementById('integrityCheckBtn').onclick = showIntegrityCheckResult;
document.getElementById('exportBtn').onclick = exportData;
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0]; handleImportFile(file); e.target.value = '';
};
document.getElementById('resetBtn').onclick = async ()=>{
  if(confirm('Clear all workforce, crew, contractor, project, site, assignment and request data from this tool? This cannot be undone. Export a backup first if you want to keep a copy.')){
    workers = []; crews = []; clients = []; contractors = []; projects = []; sites = [];
    assignmentEntities = []; workforceRequests = []; matchGenerations = []; matches = [];
    assignmentOffers = []; readinessSnapshots = []; migrationLog = [];
    passportCounter = 0;
    referenceCounters = {contractor:0, project:0, site:0, assignment:0, request:0};
    await persistAll();
    view='dashboard'; render(); showToast('All data cleared.');
  }
};

(async function init(){
  await loadAll();
  render();
})();
</script>
</body>
